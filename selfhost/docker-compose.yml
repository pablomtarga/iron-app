# Uso: dentro da pasta selfhost, rode:  mkdir -p data && docker compose up -d --build
services:
  iron:
    build:
      context: ..
      dockerfile: selfhost/Dockerfile
    container_name: iron
    restart: unless-stopped
    # roda com o seu usuário pra a pasta ./data ficar sua (descubra com: id -u e id -g)
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-8787}:8787"
    environment:
      # endereço(s) onde você abre o app, separados por vírgula. Ex.: https://iron.seudominio.com
      ORIGINS: "${ORIGINS:-}"
      # só o primeiro cadastro é liberado. Mude pra true se quiser deixar outras pessoas criarem conta.
      ALLOW_SIGNUP: "${ALLOW_SIGNUP:-false}"
      TOKEN_DAYS: "${TOKEN_DAYS:-90}"
    volumes:
      - ./data:/data
