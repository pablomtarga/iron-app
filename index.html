<style>
/* ============ TOKENS (Apple HIG) ============ */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#F2F2F7; --elev:#FFFFFF;
  --sep:rgba(60,60,67,.20); --sep-strong:rgba(60,60,67,.34);
  --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.34);
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.20);
  --chrome:rgba(242,242,247,.82);
  --viz1:#1C1C1E; --viz2:#0A0A0C;
  --green:#248A3D; --red:#D70015; --warn:#B25000;
  --accent:#E5A500; --accent-ink:#FFFFFF; --accent-text:#8A6200; --accent-soft:rgba(229,165,0,.14);
  --shadow-1:0 .5px 1px rgba(0,0,0,.05),0 2px 6px -2px rgba(0,0,0,.08);
  --shadow-2:0 8px 30px -8px rgba(0,0,0,.18);
  --r-s:10px; --r-m:14px; --r-l:18px; --r-xl:26px;
  --sp:16px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
html[data-theme=dark]{
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --elev:#2C2C2E;
  --sep:rgba(84,84,88,.55); --sep-strong:rgba(84,84,88,.75);
  --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.32);
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --chrome:rgba(20,20,22,.80);
  --green:#30D158; --red:#FF453A; --warn:#FF9F0A;
  --accent:#FFD426; --accent-ink:#1A1A1A; --accent-text:#FFD426; --accent-soft:rgba(255,212,38,.16);
  --shadow-1:0 .5px 1px rgba(0,0,0,.4),0 4px 14px -4px rgba(0,0,0,.5);
  --shadow-2:0 10px 34px -8px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;letter-spacing:0;
  overflow-x:hidden;padding-bottom:104px;
  transition:background .35s var(--ease),color .35s var(--ease);
  -webkit-font-smoothing:antialiased;
}
body.tmron{padding-top:72px}
.wrap{position:relative;z-index:2;max-width:560px;margin:0 auto}
button,input,a{font-family:inherit}
:where(button,a,[onclick]):active{transform:scale(.97)}
:where(button,a,[onclick]){transition:transform 110ms ease-out,background-color 160ms var(--ease),border-color 160ms var(--ease),color 160ms var(--ease)}
:where(button,a,input,[onclick]):focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ============ HEADER ============ */
header{padding:calc(10px + env(safe-area-inset-top)) var(--sp) 2px}
.htop{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:38px}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer;min-width:0;flex:1}
.brand>div{min-width:0}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-1)}
.brand .logo svg{width:17px;height:17px}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{display:block;color:var(--label2);font-size:11px;font-weight:500;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.hbtns{display:flex;gap:8px;align-items:center}
.thm{width:34px;height:34px;border-radius:50%;border:none;background:var(--fill);
  color:var(--label);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.datebox{background:var(--fill);border:none;border-radius:var(--r-s);padding:5px 9px;text-align:right}
.datebox label{display:block;font-size:10px;color:var(--label3);font-weight:600;letter-spacing:0}
.datebox input{background:none;border:none;color:var(--label);font-weight:600;font-size:13px;
  text-align:right;width:104px;color-scheme:light}
html[data-theme=dark] .datebox input{color-scheme:dark}
.hello{margin-top:10px;font-size:clamp(28px,8.4vw,34px);font-weight:700;line-height:1.06;letter-spacing:-.022em}
.hello em{font-style:normal;color:var(--label)}
.quote{color:var(--label2);font-size:15px;font-weight:400;margin-top:2px;letter-spacing:-.01em}

/* ============ ALERTA ============ */
.alertc{margin:14px var(--sp) 0;background:var(--surface);border-radius:var(--r-m);
  padding:14px;box-shadow:var(--shadow-1);border-left:3px solid var(--warn)}
.alertc+.alertc{margin-top:10px}
.alertc .atop{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;
  letter-spacing:-.01em;color:var(--warn);margin-bottom:3px}
.alertc p{font-size:14px;line-height:1.42;color:var(--label2);margin-bottom:12px;letter-spacing:-.005em}
.alertc p b{color:var(--label);font-weight:600}
.alertc .abtns{display:flex;gap:8px}
.alertc .abtns button{flex:1;border:none;background:var(--fill);color:var(--label);
  border-radius:var(--r-s);padding:10px 8px;font-weight:600;font-size:14px;cursor:pointer;letter-spacing:-.01em}
.alertc .abtns button.pri{background:var(--warn);color:#fff}
.alertc .abtns button.ghost{flex:0 0 auto;color:var(--label2);background:none}

/* ============ ÚLTIMO TREINO ============ */
.lastcard{margin:14px var(--sp) 0;background:var(--surface);border-radius:var(--r-m);
  box-shadow:var(--shadow-1);overflow:hidden}
.lastcard .lhead{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;width:100%;
  background:none;border:none;text-align:left;color:var(--label)}
.lastcard .lbadge{flex:0 0 34px;height:34px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:16px;font-weight:700;color:#1A1A1A;letter-spacing:-.01em}
.lastcard .ltx{flex:1;min-width:0}
.lastcard .ltx .lk{display:block;font-size:11px;color:var(--label3);font-weight:600;letter-spacing:.01em}
.lastcard .ltx b{display:block;font-size:16px;font-weight:600;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.lastcard .ltx small{color:var(--label2);font-size:13px}
.lastcard .ldone{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;
  border-radius:999px;margin-top:3px;letter-spacing:-.005em}
.lastcard .ldone.full{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.lastcard .ldone.part{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.lastcard .lcv{color:var(--label3);font-size:12px;transition:transform .3s var(--ease)}
.lastcard .lhead.op .lcv{transform:rotate(180deg)}
.lastcard .lbody{max-height:0;overflow:hidden;transition:max-height .42s var(--ease)}
.lastcard .lbody.op{max-height:1400px}
.lastcard .lbody-i{padding:2px 14px 8px}
.lastcard .lrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:9px 0;border-top:.5px solid var(--sep)}
.lastcard .lrow span{font-size:15px;font-weight:400;letter-spacing:-.01em;min-width:0}
.lastcard .lrow small{color:var(--label2);font-size:13px;white-space:nowrap;text-align:right}

/* ============ SEGMENTED CONTROL (A/B/C) ============ */
.tabsbar{position:sticky;top:0;z-index:30;padding:12px var(--sp) 8px;background:var(--bg)}
.tabsbar::after{content:'';position:absolute;left:0;right:0;top:100%;height:16px;pointer-events:none;
  background:linear-gradient(var(--bg),transparent)}
.tabs{display:flex;gap:2px;padding:2px;background:var(--fill);border-radius:10px}
.tab{flex:1;border:none;background:none;border-radius:8px;padding:7px 4px;cursor:pointer;
  transition:background-color .22s var(--ease),box-shadow .22s var(--ease),transform 110ms ease-out}
.tab .ltr{font-size:15px;font-weight:600;line-height:1.1;color:var(--label2);letter-spacing:-.01em}
.tab .nm{font-size:11px;font-weight:500;color:var(--label3);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--tc,var(--surface));box-shadow:0 .5px 2px rgba(0,0,0,.14),0 3px 10px -4px rgba(0,0,0,.20)}
.tab.on .ltr{color:var(--tci,var(--label))}
.tab.on .nm{color:var(--tci,var(--label2));opacity:.78}

/* ============ PROGRESSO DO TREINO ============ */
.prog{margin:0 var(--sp) 10px;background:var(--surface);border-radius:var(--r-m);
  padding:13px 14px;box-shadow:var(--shadow-1)}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.prog .row .l{font-size:13px;color:var(--label2);font-weight:500;letter-spacing:-.005em}
.prog .row .r{font-size:15px;font-weight:600;letter-spacing:-.01em}
.prog .row .r em{font-style:normal;color:var(--accent-text)}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--accent);
  transition:width .5s var(--ease)}
.dintro{margin:0 var(--sp) 12px;color:var(--label2);font-size:14px;line-height:1.45;letter-spacing:-.005em}

/* ============ POR QUE ESSA ORDEM ============ */
.order{margin:0 var(--sp) 12px;background:var(--surface);border-radius:var(--r-m);
  box-shadow:var(--shadow-1);overflow:hidden}
.order>button{width:100%;background:none;border:none;color:var(--label);font-weight:500;font-size:15px;
  padding:13px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left;letter-spacing:-.01em}
.order>button .cv{margin-left:auto;color:var(--label3);font-size:12px;transition:transform .3s var(--ease)}
.order>button.op .cv{transform:rotate(180deg)}
.order .bd{max-height:0;overflow:hidden;transition:max-height .45s var(--ease)}
.order .bd.op{max-height:1600px}
.order .bd-i{padding:0 14px 10px}
.order .oi{display:flex;gap:11px;padding:10px 0;border-top:.5px solid var(--sep)}
.order .oi .n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);
  font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.order .oi .tx b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.order .oi .tx span{font-size:13.5px;color:var(--label2);line-height:1.4}

/* ============ EDITAR ============ */
.editrow{margin:0 var(--sp) 10px;display:flex;justify-content:flex-end}
.editbtn{border:none;background:none;color:var(--accent-text);border-radius:999px;
  padding:6px 10px;font-weight:500;font-size:14.5px;cursor:pointer;letter-spacing:-.01em}
.editbtn.on{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:8px 14px}
.ebar{display:flex;gap:8px;padding:12px 14px 0;align-items:center}
.dhandle{flex:0 0 34px;height:34px;border-radius:9px;border:none;background:var(--fill);color:var(--label2);
  font-size:15px;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center}
.card.dragging{z-index:40;position:relative;box-shadow:var(--shadow-2);transform:scale(1.02);
  opacity:.96;cursor:grabbing;transition:none}
.card.shifted{transition:transform .22s var(--ease)}
.list.dragmode .card:not(.dragging){pointer-events:none}
.ebtn{border:none;background:var(--fill);color:var(--label);border-radius:9px;
  padding:9px 12px;font-weight:500;font-size:14px;cursor:pointer;letter-spacing:-.01em}
.ebtn:disabled{opacity:.32;cursor:default}
.ebtn.wide{flex:1}
.ebtn.danger{color:var(--red)}

/* ============ CARD DE EXERCÍCIO ============ */
.list{padding:0 var(--sp) 4px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--shadow-1);
  opacity:0;transform:translateY(10px);animation:rise .42s var(--ease) forwards}
.card.done{box-shadow:var(--shadow-1),0 0 0 1.5px var(--accent)}
@keyframes rise{to{opacity:1;transform:none}}
.ssband{height:2.5px;background:var(--accent);opacity:.55}
.ctop{display:flex;gap:13px;padding:14px 14px 10px}
.viz{flex:0 0 86px;width:86px;height:86px;border-radius:var(--r-m);
  background:linear-gradient(165deg,var(--viz1),var(--viz2));overflow:hidden}
.viz svg{width:100%;height:100%}
.cinfo{flex:1;min-width:0}
.cidx{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cidx .n{font-size:12px;color:var(--label3);font-weight:600}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;letter-spacing:-.005em}
.badge.ss{background:var(--accent-soft);color:var(--accent-text)}
.cname{font-size:19px;font-weight:600;line-height:1.18;margin:2px 0 7px;letter-spacing:-.018em}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--label2)}
.chip b{color:var(--accent-text);font-weight:600}
.vars{display:flex;gap:7px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.vars::-webkit-scrollbar{display:none}
.vars{mask-image:linear-gradient(90deg,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.vlab{flex:0 0 auto;font-size:12px;color:var(--label3);align-self:center;padding-right:2px}
.vchip{flex:0 0 auto;border:none;background:var(--fill);color:var(--label2);
  font-weight:500;font-size:13.5px;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;letter-spacing:-.01em}
.vchip.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.wtlab{padding:2px 16px 4px;font-size:12px;color:var(--label3)}
.wtlab span{opacity:.75}
.wt{display:flex;align-items:stretch;gap:8px;padding:0 14px 6px}
.wt .stp{display:flex;align-items:center;background:var(--fill);border-radius:var(--r-s);overflow:hidden;flex:1}
.wt .stp button{width:44px;border:none;background:none;color:var(--accent-text);font-size:20px;
  font-weight:500;cursor:pointer;padding:10px 0}
.wt .stp .val{flex:1;text-align:center;cursor:text}
.wt .stp .val .num{font-size:22px;font-weight:600;letter-spacing:-.02em}
.wt .stp .val .u{font-size:12px;color:var(--label2);font-weight:500;margin-left:2px}
.wt .stp .val input{width:74px;background:var(--surface);border:1.5px solid var(--accent);border-radius:8px;
  color:var(--label);font-size:19px;font-weight:600;text-align:center;padding:2px}
.wt .rest{flex:0 0 auto;background:var(--fill);border-radius:var(--r-s);padding:0 13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-width:60px}
.wt .rest .t{font-size:15px;font-weight:600;color:var(--accent-text);letter-spacing:-.01em}
.wt .rest .lb{font-size:10.5px;color:var(--label3);font-weight:500}
.prev{margin:4px 16px 0;font-size:12.5px;color:var(--label3)}
.prev b{color:var(--accent-text);font-weight:600}
.lastw{padding:4px 16px 0;font-size:12.5px;color:var(--label3)}

/* séries */
.sets{padding:8px 14px 12px}
.sets .lab{font-size:12.5px;color:var(--label3);margin-bottom:8px;display:flex;justify-content:space-between}
.sets .lab span:last-child{color:var(--accent-text);font-weight:600}
.srows{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:var(--r-s);
  padding:4px 6px;transition:background-color .2s var(--ease)}
.srow.done{background:var(--accent-soft)}
.snum{flex:0 0 20px;height:20px;border-radius:50%;background:var(--surface);
  color:var(--label3);font-weight:600;font-size:11.5px;display:flex;align-items:center;justify-content:center}
.srow.done .snum{background:var(--accent);color:var(--accent-ink)}
.sstep{flex:0 0 30px;height:30px;border-radius:8px;border:none;background:var(--surface);
  color:var(--accent-text);font-size:17px;font-weight:500;line-height:1;cursor:pointer;padding:0;box-shadow:var(--shadow-1)}
.scell{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.swt{text-align:center;cursor:text;font-size:17px;font-weight:600;line-height:1.15;letter-spacing:-.015em}
.swt .u{font-size:11px;color:var(--label2);font-weight:500;margin-left:2px}
.swt.bwlab{font-size:13px;color:var(--label2);font-weight:500;cursor:default;letter-spacing:-.005em}
.swt input{width:64px;background:var(--surface);border:1.5px solid var(--accent);border-radius:7px;
  color:var(--label);font-size:16px;font-weight:600;text-align:center;padding:1px}
.sant{font-size:11px;color:var(--label3);line-height:1.1}
.schk{flex:0 0 32px;height:32px;border-radius:50%;border:1.5px solid var(--sep-strong);background:var(--surface);
  color:var(--label3);font-size:14px;cursor:pointer;padding:0}
.schk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.drnote{margin:0 14px 10px;background:var(--fill);border-radius:var(--r-s);padding:10px 12px;display:flex;gap:9px}
.drnote .ic{flex:0 0 auto;font-size:14px}
.drnote p{font-size:13px;line-height:1.42;color:var(--label2);letter-spacing:-.005em}
.acts{display:flex;gap:8px;padding:0 14px 14px}
.abtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:none;
  background:var(--fill);border-radius:var(--r-s);padding:11px;color:var(--label);
  font-weight:500;font-size:14.5px;cursor:pointer;text-decoration:none;letter-spacing:-.01em}
.abtn.vid{background:var(--accent);color:var(--accent-ink);font-weight:600}
.abtn .cv{color:inherit;font-size:11px;transition:transform .3s var(--ease)}
.abtn.op .cv{transform:rotate(180deg)}
.how{max-height:0;overflow:hidden;transition:max-height .42s var(--ease);margin:0 14px}
.how.op{max-height:900px;margin-bottom:14px}
.how-i{padding:2px 0 4px;border-top:.5px solid var(--sep)}
.frames{display:flex;gap:8px;margin:12px 0 4px}
.frm{flex:1;text-align:center}
.frz{border-radius:var(--r-s);background:linear-gradient(165deg,var(--viz1),var(--viz2));
  overflow:hidden;aspect-ratio:1.2/1}
.frz svg{width:100%;height:100%}
.frz img{width:100%;height:100%;object-fit:cover;display:block}
.frz.photo{background:var(--fill)}
.fcredit{font-size:10.5px;color:var(--label3);text-align:center;margin-top:8px;line-height:1.35}
.frz.f0 svg *,.frz.f1 svg *{animation-play-state:paused!important;animation-duration:2s!important}
.frz.f0 svg *{animation-delay:0s!important}
.frz.f1 svg *{animation-delay:-1s!important}
.frm span{display:block;font-size:11px;color:var(--label3);margin-top:5px}
.how ol{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:9px;margin:12px 0}
.how ol li{counter-increment:s;position:relative;padding-left:28px;font-size:15px;line-height:1.42;
  color:var(--label);letter-spacing:-.01em}
.how ol li::before{content:counter(s);position:absolute;left:0;top:1px;width:20px;height:20px;
  border-radius:50%;background:var(--accent-soft);color:var(--accent-text);font-weight:600;font-size:12px;
  display:flex;align-items:center;justify-content:center}
.cue{display:flex;gap:8px;font-size:14px;line-height:1.4;padding:9px 0;border-top:.5px solid var(--sep);letter-spacing:-.005em}
.cue.g{color:var(--green)}.cue.b{color:var(--red)}
.cue b{font-weight:600}
.fin{margin:16px var(--sp) 4px}
.fin button{width:100%;border:none;border-radius:var(--r-m);padding:16px;font-size:17px;font-weight:600;
  cursor:pointer;background:var(--fill);color:var(--label2);letter-spacing:-.015em}
.fin button.ready{background:var(--accent);color:var(--accent-ink)}

/* ============ PROGRESSO ============ */
.pv{padding:4px var(--sp) 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:none;border-radius:var(--r-m);padding:13px 8px;text-align:center;
  box-shadow:var(--shadow-1);cursor:pointer;width:100%}
.stat .v{font-size:26px;font-weight:700;line-height:1.05;color:var(--accent-text);letter-spacing:-.02em}
.stat .k{font-size:11.5px;color:var(--label2);margin-top:3px;letter-spacing:-.005em;line-height:1.2}
.week{background:var(--surface);border-radius:var(--r-m);padding:14px 0 12px;margin-bottom:16px;box-shadow:var(--shadow-1)}
.week h4{font-size:13px;color:var(--label2);font-weight:500;margin:0 14px 10px}
.wkscroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wkscroll::-webkit-scrollbar{display:none}
.wkpage{flex:0 0 100%;scroll-snap-align:center;padding:0 14px}
.wklab{font-size:13px;color:var(--label2);font-weight:500;text-align:center;margin-bottom:10px;letter-spacing:-.005em}
.days{display:flex;justify-content:space-between;gap:5px}
.day{flex:1;text-align:center}
.day .ball{width:100%;height:38px;border-radius:10px;background:var(--fill);border:none;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;
  color:var(--label3);cursor:pointer;letter-spacing:-.01em}
.day .ball.hit{background:var(--accent);color:var(--accent-ink)}
.day .ball.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day small{display:block;font-size:11px;color:var(--label3);margin-top:4px}
.wkfoot{margin:10px 14px 0;font-size:12px;color:var(--label3);text-align:center}
.sectit{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:6px 2px 10px;
  display:flex;justify-content:space-between;align-items:center}
.sectit button{background:var(--fill);border:none;color:var(--label2);border-radius:999px;
  font-size:13px;font-weight:500;padding:6px 12px;cursor:pointer}
.hist{display:flex;flex-direction:column;gap:9px}
.hrow{background:var(--surface);border-radius:var(--r-m);padding:12px 14px;display:flex;align-items:center;
  gap:12px;box-shadow:var(--shadow-1);cursor:pointer}
.hrow .wk{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;flex:0 0 auto;color:#1A1A1A}
.hrow .mid{flex:1;min-width:0}
.hrow .mid b{font-size:15.5px;font-weight:600;letter-spacing:-.015em}
.hrow .mid small{display:block;color:var(--label2);font-size:13px}
.hrow .pct{font-size:15px;font-weight:600;color:var(--accent-text)}
.hrow .hcv{color:var(--label3);font-size:11px;transition:transform .3s var(--ease)}
.hrow.op .hcv{transform:rotate(180deg)}
.hdetail{display:none;background:var(--surface);border-radius:0 0 var(--r-m) var(--r-m);
  margin:-9px 0 0;padding:4px 14px 12px;box-shadow:var(--shadow-1)}
.hdetail.op{display:block}
.hd-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;
  border-top:.5px solid var(--sep);font-size:14.5px;letter-spacing:-.01em}
.hd-row small{color:var(--label2);font-size:13px;white-space:nowrap;text-align:right}
.hdel{width:100%;margin-top:8px;border:none;background:var(--fill);color:var(--red);
  border-radius:var(--r-s);padding:10px;font-weight:500;font-size:14px;cursor:pointer}
.wkhead{font-size:13px;color:var(--label3);font-weight:500;margin:16px 2px 6px}
.wkhead:first-child{margin-top:0}
.exports{display:flex;gap:9px;margin:0 0 12px}
.exports .abtn{padding:12px;font-size:14.5px}
.tips{margin-top:18px}
.tip{background:var(--surface);border-radius:var(--r-m);padding:12px 14px;margin-bottom:9px;
  display:flex;gap:11px;box-shadow:var(--shadow-1)}
.tip .ic{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--fill);

.tip p{font-size:14px;line-height:1.42;color:var(--label2);letter-spacing:-.005em}

.empty{text-align:center;color:var(--label3);font-size:14.5px;padding:24px 10px;line-height:1.5}

/* ============ TIMER (material translúcido) ============ */
.tmr{position:fixed;left:var(--sp);right:var(--sp);top:calc(8px + env(safe-area-inset-top));z-index:60;
  background:var(--chrome);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  color:var(--label);border-radius:var(--r-m);padding:11px 14px;display:none;align-items:center;gap:13px;
  box-shadow:var(--shadow-2);max-width:528px;margin:0 auto;border:.5px solid var(--sep)}

@keyframes matIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
.tmr .big{font-size:30px;font-weight:700;line-height:1;min-width:78px;color:var(--accent-text);
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tmr .info{flex:1;min-width:0}
.tmr .info b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.tmr .info small{display:block;color:var(--label2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmr .x{width:34px;height:34px;border-radius:50%;border:none;background:var(--fill2);color:var(--label);
  font-size:15px;cursor:pointer}
.tmr .ring{position:absolute;left:0;bottom:0;height:2.5px;background:var(--accent);
  border-radius:2px;transition:width 1s linear}

/* ============ TAB BAR ============ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;gap:0;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));

  border-top:.5px solid var(--sep)}
.nav button{flex:1;max-width:200px;border:none;background:none;padding:5px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--label3)}
.nav button.on{color:var(--accent-text)}
.nav button svg{width:24px;height:24px}
.nav button span{font-size:10.5px;font-weight:500;letter-spacing:0}

/* ============ TOAST / CONFETE ============ */
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(16px);
  background:var(--chrome);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);

  opacity:0;transition:opacity .28s var(--ease),transform .28s var(--ease);pointer-events:none;

.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.cfx{position:fixed;inset:0;z-index:80;pointer-events:none;overflow:hidden}
.cf{position:absolute;width:8px;height:12px;top:-20px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}

/* ============ SHEETS / MODAIS ============ */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:75;display:flex;
  align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(3px);

#pickOv{z-index:120}
#boxOv{z-index:118}
.modal{background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;max-width:560px;width:100%;

.modal::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--sep-strong);

.modal h3{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.modal .sub{font-size:14.5px;color:var(--label2);margin-bottom:16px;line-height:1.42;letter-spacing:-.005em}
.modal input{width:100%;background:var(--fill);border:1.5px solid transparent;border-radius:var(--r-s);
  padding:13px 14px;color:var(--label);font-weight:400;font-size:17px;margin-bottom:10px}
.modal input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.modal .mrow{display:flex;gap:9px;margin-top:6px;flex:0 0 auto}

.modal .mbtn.pri{background:var(--accent);color:var(--accent-ink)}
.modal .merr{color:var(--red);font-size:13.5px;font-weight:500;min-height:16px;margin-top:8px}
.modal .merr.ok{color:var(--green)}
.modal .mfoot{margin-top:12px;text-align:center;flex:0 0 auto}
.modal .mfoot button{background:none;border:none;color:var(--accent-text);font-size:14.5px;font-weight:500;cursor:pointer}
.modal .mback{background:none;border:none;color:var(--accent-text);font-weight:500;font-size:15px;
  cursor:pointer;padding:0 0 10px;text-align:left;letter-spacing:-.01em}
.modal .who{background:var(--fill);border-radius:var(--r-s);padding:12px;font-size:15px;font-weight:500;
  margin-bottom:12px;word-break:break-all}
.modal .who small{display:block;color:var(--label2);font-weight:400;font-size:13px;margin-top:3px}
.mlist{overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px;flex:1 1 auto;min-height:0}
.pick{max-width:560px}
.pgrid{overflow-y:auto;-webkit-overflow-scrolling:touch;margin:6px -4px 0;padding:0 4px;flex:1 1 auto;min-height:0}
.pchips{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;flex:0 0 auto}
.pchips::-webkit-scrollbar{display:none}
.prow{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:.5px solid var(--sep)}
.prow .rtx{flex:1;min-width:0}
.prow .rtx b{display:block;font-size:15.5px;font-weight:500;letter-spacing:-.01em}
.prow .rtx small{color:var(--label2);font-size:13px}
.prow .padd{width:32px;height:32px;border-radius:50%;border:none;background:var(--accent);
  color:var(--accent-ink);font-size:17px;font-weight:600;cursor:pointer}

/* ============ ONBOARDING ============ */
#ob{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(16px + env(safe-area-inset-top)) var(--sp) calc(28px + env(safe-area-inset-bottom))}
.ob-in{max-width:560px;margin:0 auto}
.ob-steps{display:flex;gap:6px;margin-bottom:22px}
.ob-steps i{flex:1;height:3px;border-radius:2px;background:var(--fill)}
.ob-steps i.on{background:var(--accent)}
.ob-hero{text-align:center;padding:30px 4px 8px}
.ob-hero .logo{width:68px;height:68px;border-radius:18px;background:var(--accent);margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-1)}
.ob-hero .logo svg{width:38px;height:38px}
.ob-hero h1{font-size:clamp(30px,8.6vw,36px);font-weight:700;line-height:1.06;letter-spacing:-.025em}
.ob-hero h1 em{font-style:normal;color:var(--accent-text)}
.ob-hero p{color:var(--label2);font-size:16px;line-height:1.45;margin:12px auto 24px;max-width:420px;letter-spacing:-.01em}
.ob-cta{display:flex;flex-direction:column;gap:10px;max-width:420px;margin:0 auto}
.ob-btn{border:none;background:var(--surface);color:var(--label);border-radius:var(--r-m);
  padding:15px;font-weight:500;font-size:16.5px;cursor:pointer;box-shadow:var(--shadow-1);letter-spacing:-.015em}
.ob-btn.pri{background:var(--accent);color:var(--accent-ink);font-weight:600}
.ob-btn.ghost{background:none;box-shadow:none;color:var(--accent-text);font-size:15px;padding:8px}
.ob-name{display:block;width:100%;max-width:420px;margin:0 auto 12px;background:var(--surface);
  border:1.5px solid transparent;border-radius:var(--r-m);padding:14px 16px;color:var(--label);
  font-weight:400;font-size:17px;text-align:center;box-shadow:var(--shadow-1)}
.ob-name:focus{outline:none;border-color:var(--accent)}
.qb .ob-name{max-width:100%;text-align:left;box-shadow:none;background:var(--fill);margin:0}
.ob h2{font-size:28px;font-weight:700;letter-spacing:-.022em;margin-bottom:4px}
.ob .lead{color:var(--label2);font-size:15px;line-height:1.45;margin-bottom:18px;letter-spacing:-.01em}
.qb{background:var(--surface);border-radius:var(--r-m);padding:15px;margin-bottom:12px;box-shadow:var(--shadow-1)}
.qb h4{font-size:16px;font-weight:600;margin-bottom:2px;letter-spacing:-.015em}
.qb .hint{font-size:13.5px;color:var(--label2);margin-bottom:12px;line-height:1.4}
.qchips{display:flex;flex-wrap:wrap;gap:8px}
.qchip{border:none;background:var(--fill);color:var(--label2);border-radius:999px;padding:9px 15px;
  font-weight:500;font-size:14.5px;cursor:pointer;letter-spacing:-.01em}
.qchip.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.ob-nav{display:flex;gap:10px;margin-top:18px}
.ob-nav .ob-btn{flex:1}
.rday{background:var(--surface);border-radius:var(--r-l);margin-bottom:13px;box-shadow:var(--shadow-1);overflow:hidden}
.rday .rhead{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:.5px solid var(--sep)}
.rday .rhead .lt{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:#1A1A1A}
.rday .rhead .tx b{display:block;font-size:17px;font-weight:600;letter-spacing:-.015em}
.rday .rhead .tx small{color:var(--label2);font-size:13px}
.rex{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:.5px solid var(--sep)}
.rex:last-of-type{border-bottom:none}
.rex .rn{flex:0 0 20px;height:20px;border-radius:50%;background:var(--fill);color:var(--label3);
  font-weight:600;font-size:11.5px;display:flex;align-items:center;justify-content:center}
.rex .rtx{flex:1;min-width:0}
.rex .rtx b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.rex .rtx small{color:var(--label3);font-size:12.5px}
.rex .rx{width:30px;height:30px;border-radius:50%;border:none;background:var(--fill);color:var(--label2);
  cursor:pointer;font-size:13px}
.radd{width:calc(100% - 28px);margin:11px 14px 13px;border:none;background:var(--fill);color:var(--accent-text);
  border-radius:var(--r-s);padding:11px;font-weight:500;font-size:14.5px;cursor:pointer}
.radd.big{width:100%;margin:2px 0 6px;padding:15px;font-size:16px}

/* ============ ACESSIBILIDADE ============ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.12s!important;scroll-behavior:auto!important}
  .card{opacity:1;transform:none}
  .frz svg *{animation:none!important}
}
@media (prefers-reduced-transparency:reduce){
  .tmr,.nav,.toast{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--surface)}
}
@media (prefers-contrast:more){
  :root{--sep:rgba(60,60,67,.5);--label2:rgba(60,60,67,.85)}
  .card,.lastcard,.stat,.hrow,.tip{box-shadow:var(--shadow-1),0 0 0 1px var(--sep)}
}
/* ============ CALORIAS (gamificado) ============ */
.kcal-hero{margin:0 0 16px;background:linear-gradient(165deg,var(--surface),var(--fill));
  border-radius:var(--r-l);padding:26px 20px 22px;box-shadow:var(--shadow-1);text-align:center;
  position:relative;overflow:hidden}
.kcal-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 0%,rgba(255,180,60,.14),transparent 70%);
  pointer-events:none}
.kcal-ringwrap{position:relative;width:188px;height:188px;margin:0 auto 6px}
.kcal-ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.kcal-ringbg{fill:none;stroke:var(--fill);stroke-width:11}
.kcal-ringfg{fill:none;stroke:url(#kcalGrad);stroke-width:11;stroke-linecap:round;
  transition:stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1)}
.kcal-ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kcal-num{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--label)}
.kcal-num .u{font-size:15px;font-weight:600;color:var(--label2);margin-left:2px}
.kcal-sub{font-size:12.5px;color:var(--label2);margin-top:5px;font-weight:500}
.kcal-badge{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:5px 12px;
  border-radius:999px;background:rgba(255,150,30,.14);color:#C2600A;font-size:12px;font-weight:700}
html[data-theme=dark] .kcal-badge{background:rgba(255,170,60,.18);color:#FFB84D}
.kcal-badge.hot{animation:kcalPulse 1.6s infinite ease-in-out}
@keyframes kcalPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

.kcal-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.kcal-stat{background:var(--surface);border-radius:var(--r-m);padding:12px 6px;text-align:center;
  box-shadow:var(--shadow-1)}
.kcal-stat .v{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--label);
  font-variant-numeric:tabular-nums}
.kcal-stat .k{font-size:10px;color:var(--label3);margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}

.kcal-panel{background:var(--surface);border-radius:var(--r-l);padding:18px;margin-bottom:14px;
  box-shadow:var(--shadow-1);position:relative;overflow:hidden}
.kcal-ptitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.kcal-ptitle h4{font-size:15px;font-weight:700;letter-spacing:-.01em}
.kcal-ptitle button{background:var(--fill);border:none;color:var(--label2);border-radius:999px;
  font-size:11px;font-weight:600;padding:5px 10px;cursor:pointer}

/* moedas */
.coinrow{display:flex;align-items:center;gap:14px}
.coin-ic{flex:0 0 auto;width:52px;height:52px;border-radius:50%;

  display:flex;align-items:center;justify-content:center;font-size:24px;
  box-shadow:0 2px 0 #8A5A00,0 6px 14px -4px rgba(184,119,0,.55);
  position:relative;animation:coinFloat 2.6s infinite ease-in-out}
.coin-ic::after{content:'';position:absolute;top:8%;left:18%;width:26%;height:26%;border-radius:50%;
  background:rgba(255,255,255,.55);filter:blur(1px)}
@keyframes coinFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
.coininfo{flex:1;min-width:0}
.coin-num{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  color:var(--label);display:flex;align-items:baseline;gap:5px}
.coin-num small{font-size:12px;color:var(--label3);font-weight:600}
.coin-hint{font-size:12px;color:var(--label2);margin-top:2px}

/* barra de progresso pra próxima cruz */
.crossbar-wrap{margin-top:14px}
.crossbar{height:12px;border-radius:7px;background:var(--fill);overflow:hidden;position:relative}
.crossbar i{display:block;height:100%;border-radius:7px;width:0%;
  background:linear-gradient(90deg,#3FCB6B,#22A555);
  transition:width 1s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.crossbar i::after{content:'';position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 48%,transparent 66%);
  background-size:220% 100%;animation:shimmerMove 2.2s infinite linear}
@keyframes shimmerMove{0%{background-position:140% 0}100%{background-position:-40% 0}}
.crossbar-lab{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;
  color:var(--label3);font-weight:600;font-variant-numeric:tabular-nums}

/* cruzes conquistadas */
.crossgrid{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.crossitem{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:21px;background:linear-gradient(160deg,#3FCB6B,#1C8A46);color:#fff;
  box-shadow:0 2px 0 #0F5C2C,0 5px 12px -4px rgba(28,138,70,.55);
  animation:crossPop .5s cubic-bezier(.24,1.4,.4,1) backwards}
.crossitem.next{background:var(--fill);color:var(--label3);box-shadow:none;
  border:1.5px dashed var(--sep-strong);position:relative;animation:none}
.crossitem.next .cxfill{position:absolute;inset:0;border-radius:11px;overflow:hidden}
.crossitem.next .cxfill i{position:absolute;left:0;bottom:0;width:100%;height:0%;
  background:linear-gradient(0deg,#3FCB6B,#6EE499);transition:height .9s cubic-bezier(.16,1,.3,1)}
.crossitem.next span{position:relative;z-index:2}
@keyframes crossPop{0%{transform:scale(0) rotate(-25deg);opacity:0}70%{transform:scale(1.18) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.cross-empty{font-size:12.5px;color:var(--label3);padding:6px 2px;line-height:1.5}

/* burst de conquista (cruz nova) */
.kcal-burst{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0}
.kcal-burst.show{opacity:1;animation:burstFade 1.9s ease forwards}
@keyframes burstFade{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0}}
.kcal-burst .bx{width:120px;height:120px;border-radius:32px;display:flex;align-items:center;justify-content:center;
  font-size:56px;color:#fff;background:linear-gradient(160deg,#3FCB6B,#1C8A46);
  box-shadow:0 8px 0 #0F5C2C,0 20px 50px -10px rgba(28,138,70,.6);
  animation:burstPop 1.9s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes burstPop{0%{transform:scale(.2) rotate(-40deg)}45%{transform:scale(1.22) rotate(8deg)}62%{transform:scale(1) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}
.kcal-burst .blab{position:absolute;margin-top:150px;font-size:16px;font-weight:800;color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.4);white-space:nowrap}

/* peso corporal editável */
.bodykg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--fill);border-radius:var(--r-m);padding:12px 14px;margin-bottom:14px;cursor:pointer}
.bodykg-row .l{font-size:13px;color:var(--label2);font-weight:600}
.bodykg-row .v{font-size:15px;font-weight:800;color:var(--label)}
.bodykg-row .v span{color:var(--label3);font-weight:600;font-size:12px}

/* moedas voadoras */
.coinfly{position:fixed;z-index:96;pointer-events:none;font-size:20px;
  animation:coinFly 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes coinFly{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-10px) scale(1.15)}
  100%{transform:translateY(-130px) scale(.7);opacity:0}}

@media (prefers-reduced-motion:reduce){
  .coin-ic,.crossbar i::after,.kcal-badge.hot,.crossitem{animation:none!important}
}
.hidden{display:none!important}
</style>

/* why genéricos por papel na ordem */
function whyFor(ex,idx,dayHasComp){
  if(ex.cat==='cardio')return 'Fecha o treino com gasto extra sem roubar energia da musculação (curto e por último de propósito).';
  if(ex.cat==='lomb')return 'A lombar estabiliza tudo. Se cansasse antes dos pesados, sua forma iria embora: estabilizador é sempre o último.';
  if(ex.cat==='core')return 'Core no fim de propósito: cansar o estabilizador antes dos exercícios pesados comprometeria sua execução.';
  if(ex.cat==='calf')return 'Não interfere em nenhum outro exercício, então vai pro fim. Responde melhor a repetições altas e amplitude total.';
  if(ex.cat==='comp')return idx===0?'Maior composto do dia: vem primeiro porque com você descansado dá pra mover mais carga com forma limpa, e é daqui que sai o principal estímulo.':'Composto: aproveita a força que ainda resta antes de partir pros isolados.';
  return 'Isolado de '+ex.mus.toLowerCase()+': completa o estímulo do dia com foco total, sem exigir dos músculos auxiliares já cansados.';
}

const CARDIO_IDS=['treadmillv','runningv','ellipticalv','stairsv','rowerv','finisher'];
const CARDIO_SUPPORT=['plankv','absfull','bridgev','lowerback','reversecrunch'];
const FUNCTIONAL_POOL=['kettlebellswing','farmercarry','sledpush','battleropes','medicineball','boxjump','trxrow','jumpropev','burpeev','mountainclimberv'];
function buildCardioDay(dayIdx,n,prefs){
  const base=(prefs&&prefs.length)?prefs.concat(CARDIO_IDS.filter(id=>!prefs.includes(id))):CARDIO_IDS;
  const rot=base.slice(dayIdx%base.length).concat(base.slice(0,dayIdx%base.length));
  const cardCount=Math.max(2,n-2);
  const chosen=rot.slice(0,cardCount).map(id=>({id,...E[id]}));
  const supCount=Math.max(1,n-chosen.length);
  const sup=[];
  for(let i=0;i<supCount;i++){const sid=CARDIO_SUPPORT[(dayIdx+i)%CARDIO_SUPPORT.length];sup.push({id:sid,...E[sid]})}
  return [...chosen,...sup];
}
function buildFunctionalDay(dayIdx,n){
  const rot=FUNCTIONAL_POOL.slice(dayIdx%FUNCTIONAL_POOL.length).concat(FUNCTIONAL_POOL.slice(0,dayIdx%FUNCTIONAL_POOL.length));
  return rot.slice(0,n).map(id=>({id,...E[id]}));
}
/* intercala exercícios em duplas (superset em circuito), sem descanso entre os dois da dupla */
function pairAsCircuit(sel,restBetween){
  const out=[];
  for(let k=0;k<sel.length;k+=2){
    if(sel[k+1]){
      out.push({...sel[k],ss:'C'+(k/2),rest:0});
      out.push({...sel[k+1],ss:'C'+(k/2),rest:restBetween||30});
    }else{out.push(sel[k])}
  }
  return out;
}

  if(!reps)return {kind:'reps',avg:10};
  const r=String(reps).toLowerCase();
  if(r.indexOf('min')>=0){
    const nums=(r.match(/\d+/g)||['5']).map(Number);
    const avg=nums.length>1?(nums[0]+nums[1])/2:nums[0];
    return {kind:'time',seconds:avg*60};
  }
  if(r.indexOf('s')>=0&&r.indexOf('sess')<0){
    const nums=(r.match(/\d+/g)||['30']).map(Number);
    const avg=nums.length>1?(nums[0]+nums[1])/2:nums[0];
    return {kind:'time',seconds:avg};
  }
  const nums=r.match(/\d+/g);
  if(nums){const ns=nums.map(Number);const avg=ns.length>1?(ns[0]+ns[1])/2:ns[0];return {kind:'reps',avg}}
  return {kind:'reps',avg:10};
}
function bodyKg(){return (SETUP&&SETUP.bodyKg)||75}
function estimateKcalForItem(ex,a,doneCount,trackedVal){
  if(!doneCount&&!((a.unit==='m'||a.unit==='min')&&trackedVal>0))return 0;
  const met=MET_OVERRIDE[a.vid]!=null?MET_OVERRIDE[a.vid]:(MET_BY_CAT[ex.cat]||4);
  let seconds;
  if(a.unit==='m'){seconds=((trackedVal||0)/36.7)*60}
  else if(a.unit==='min'){seconds=(trackedVal||0)*60}
  else{
    const info=parseRepsSeconds(a.reps);
    const perSet=info.kind==='time'?info.seconds:(info.avg*3);
    seconds=doneCount*perSet+Math.max(0,doneCount-1)*(a.rest||0);
  }
  return met*bodyKg()*(seconds/3600);
}
function estimateKcalForHistItem(it){
  const meta=E[it.id];if(!meta)return 0;
  const met=MET_OVERRIDE[it.id]!=null?MET_OVERRIDE[it.id]:(MET_BY_CAT[meta.cat]||4);
  let seconds;
  if(meta.unit==='m'){
    const vals=(it.sw||[]).filter(v=>v!=null);
    const m=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:(it.w||0);
    seconds=(m/36.7)*60;
  }else if(meta.unit==='min'){
    const vals=(it.sw||[]).filter(v=>v!=null);
    const mins=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:(it.w||0);
    seconds=mins*60;
  }else{
    const info=parseRepsSeconds(meta.reps);
    const perSet=info.kind==='time'?info.seconds:(info.avg*3);
    const doneCount=it.s||0;
    seconds=doneCount*perSet+Math.max(0,doneCount-1)*(meta.rest||0);
  }
  return met*bodyKg()*(seconds/3600);
}
function recomputeKcal(h){
  if(!h.items||!h.items.length)return h.kcal||0;
  return Math.round(h.items.reduce((s,it)=>s+estimateKcalForHistItem(it),0));
}
function kcalOf(h){return h.kcal!=null?h.kcal:recomputeKcal(h)}

function buildDay(pool,n,prio){
  const noPrio=Object.keys(GRP_LABEL).filter(g=>!prio.includes(g));
  let items=pool.map(id=>({id,...E[id]}));
  // remove isolados de grupos desmarcados (mantém compostos pra base)
  let removed=items.filter(x=>x.cat!=='comp'&&noPrio.includes(x.grp)&&prio.length>0&&prio.length<8);
  items=items.filter(x=>!removed.includes(x));
  // ordena: comp > iso(prioritário) > iso > calf > core/lomb
  const rank=x=>x.cat==='comp'?0:(x.cat==='iso'?(prio.includes(x.grp)?1:2):(x.cat==='calf'?3:4));
  items.sort((a,b)=>rank(a)-rank(b));
  if(items.length<n)items=items.concat(removed); // repõe se faltar
  const coresArr=items.filter(x=>['core','lomb'].includes(x.cat));
  const restArr=items.filter(x=>!['core','lomb'].includes(x.cat));
  let sel;
  if(coresArr.length&&n>=4){sel=restArr.slice(0,n-1);sel.push(coresArr[0])}
  else{sel=items.slice(0,n)}
  // se dia tem muitos exercícios, compostos extras caem pra 3 séries
  sel=sel.map((x,i)=>{
    let sets=x.sets;
    if(n>=7&&x.cat==='comp'&&i>0)sets=3;
    return {...x,sets};
  });
  // superset abdutora+adutora se ambos presentes: aproxima e marca
  const ia=sel.findIndex(x=>x.id==='abductor'),ib=sel.findIndex(x=>x.id==='adductor');
  if(ia>=0&&ib>=0){
    const [add]=sel.splice(ib,1);
    sel.splice(sel.findIndex(x=>x.id==='abductor')+1,0,add);
    sel=sel.map(x=>x.id==='abductor'?{...x,ss:'A',rest:0}:x.id==='adductor'?{...x,ss:'A'}:x);
  }
  return sel;
}
function generateProgram(setup){
  const goal=setup.goal||'hipertrofia';
  const gdef=GOALS[goal]||GOALS.hipertrofia;
  let days,spName;
  if(gdef.cardioFocus){
    days=Array.from({length:setup.splits},(_,i)=>({cardio:true,idx:i}));
    spName=GOALS.cardio.label;
  }else if(gdef.functionalFocus){
    days=Array.from({length:setup.splits},(_,i)=>({functional:true,idx:i}));
    spName=GOALS.funcional.label;
  }else{
    const sp=SPLITS[setup.splits];spName=sp.name;
    days=sp.days.map(d=>({...d}));
    const fi=Math.max(0,days.findIndex(d=>d.label===setup.first));
    days=[...days.slice(fi),...days.slice(0,fi)];
  }
  const prog={};
  days.forEach((d,i)=>{
    const L=LETTERS[i];
    let sel=d.cardio?buildCardioDay(i,setup.perDay,setup.cardioPrefs):
             d.functional?buildFunctionalDay(i,setup.perDay):
             buildDay(d.pool,setup.perDay,setup.groups);
    // calibra reps/descanso conforme o objetivo escolhido
    sel=sel.map(x=>{
      if(x.cat==='comp')return {...x,reps:gdef.repsComp,rest:gdef.restComp};
      if(x.cat==='iso')return {...x,reps:gdef.repsIso,rest:gdef.restIso};
      return x;
    });
    // circuito: intercala em duplas sem descanso entre elas (o "queima gordura" alternando dois aparelhos)
    if(gdef.circuitPairs&&!d.cardio)sel=pairAsCircuit(sel,gdef.restComp);
    const ex=sel.map((x,idx)=>({
      id:x.id,fig:x.fig,name:x.name,muscle:x.mus,w:x.w||0,bw:!!x.bw,unit:x.unit,
      sets:x.sets,reps:x.reps,rest:(x.ss==='A'&&x.id==='abductor')?0:x.rest,
      ss:x.ss,yt:x.yt,steps:x.steps,g:x.g,b:x.b,
      why:d.cardio?(x.cat==='cardio'?'Base do treino de cardio: gasto calórico sustentado e condicionamento.':'Estabilidade central pra sustentar a postura durante o cardio.'):
          d.functional?'Movimento funcional: treina o corpo como uma unidade, replicando padrões do dia a dia.':
          (x.ss?'Estação de circuito: intercala com o próximo exercício sem descanso, mantendo a frequência cardíaca elevada pra maximizar a queima.':whyFor(x,idx,true)),
      alts:(x.alts||[]).map(aid=>({id:aid,fig:E[aid].fig,name:E[aid].name,w:E[aid].w,bw:!!E[aid].bw,unit:E[aid].unit,reps:E[aid].reps,yt:E[aid].yt,steps:E[aid].steps,g:E[aid].g,b:E[aid].b}))
    }));
    if(setup.finisher&&!d.cardio&&!d.functional&&(i===0||i===days.length-1)){
      const f=E.finisher;
      ex.push({id:'finisher',fig:f.fig,name:f.name,muscle:f.mus,w:0,bw:true,sets:1,reps:f.reps,rest:0,yt:f.yt,steps:f.steps,g:f.g,b:f.b,why:whyFor(f,99),
        alts:f.alts.map(aid=>({id:aid,fig:E[aid].fig,name:E[aid].name,bw:true,reps:E[aid].reps,yt:E[aid].yt,steps:E[aid].steps,g:E[aid].g,b:E[aid].b}))});
    }
    const label=d.cardio?(sel[0]?sel[0].name:'Cardio'):d.functional?'Funcional '+L:d.label;
    const sub=d.cardio?'Condicionamento':d.functional?'Full body · circuito':d.sub;
    const intro=d.cardio?
      `${gdef.label} · ${setup.freq}x por semana. Máquinas de cardio alternadas com estabilidade central pra sustentar postura e queimar mais.`:
      d.functional?
      `${gdef.label} · ${setup.freq}x por semana. Kettlebell, trenó, TRX, cordas e movimentos como burpee, sempre em duplas sem descanso entre elas: mais gasto calórico no mesmo tempo.`:
      gdef.circuitPairs?
      `${spName} · ${setup.freq}x por semana · circuito de ${gdef.label.toLowerCase()}. Exercícios alternados em duplas, sem descanso entre eles: mais gasto calórico no mesmo tempo.`:
      `${spName} · ${setup.freq}x por semana · foco em ${gdef.label.toLowerCase()}. Compostos pesados primeiro (você fresco = mais carga = mais estímulo), isolados completam, core fecha.`;
    prog[L]={label,sub,intro,ex};
  });
  return prog;
}
function weekPlan(setup){
  const keys=LETTERS.slice(0,setup.splits);
  let seq=[];for(let i=0;i<setup.freq;i++)seq.push(keys[i%keys.length]);
  return seq.join(' → ');
}

const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
function activeOf(ex){

  if(vid&&ex.alts){const alt=ex.alts.find(a=>a.id===vid);
    if(alt) return {...ex,...alt,baseId:ex.id,vid:alt.id};}
  return {...ex,baseId:ex.id,vid:ex.id};
}
const wOf=a=>WEIGHTS[a.vid]!=null?WEIGHTS[a.vid]:(a.w||0);
function unitOf(vid){return (E[vid]&&E[vid].unit)||'kg'}
function stepForUnit(u){return u==='m'?50:u==='min'?5:2.5}

function setsArr(baseId,n,key){
  const k=key||cur;
  if(!SESSION[k])SESSION[k]={};
  let s=SESSION[k][baseId];
  if(!s||s.length!==n){s=Array.from({length:n},()=>({d:false,w:null}));SESSION[k][baseId]=s}
  else if(typeof s[0]!=='object'||s[0]===null){s=s.map(v=>({d:!!v,w:null}));SESSION[k][baseId]=s}
  return s;
}
function sessionStats(key){
  const day=PROGRAM[key];if(!day)return {done:0,tot:0};
  const s=SESSION[key]||{};let done=0,tot=0;
  day.ex.forEach(ex=>{const a=activeOf(ex);tot+=a.sets;
    const arr=s[ex.id];
    if(Array.isArray(arr))arr.forEach(x=>{if(x&&typeof x==='object'?x.d:x)done++});
  });
  return {done,tot};
}
let RESUMED=null;
function pendingDays(){
  const out=[];
  Object.keys(PROGRAM).forEach(k=>{
    const st=sessionStats(k);
    if(st.done>0){
      const meta=SESSMETA[k]||{};
      const d=meta.d||todayISO();
      const hoje=d===todayISO();
      const ativo=k===cur&&view==='train'&&(hoje||k===RESUMED);
      if(!ativo)out.push({key:k,done:st.done,tot:st.tot,date:d,hoje});
    }
  });
  return out;
}
function lastSets(vid,name){
  for(const h of HISTORY){
    if(h.items){const it=h.items.find(x=>x.id===vid||x.n===name);
      if(it)return {sw:it.sw||null,s:it.s,t:it.t,w:it.w!=null?it.w:null}}
    if(h.weights&&h.weights[vid]!=null)return {sw:null,s:null,t:null,w:h.weights[vid]};
  }
  return null;
}

const KCAL_PER_COIN=10, COINS_PER_CROSS=50, KCAL_DAILY_GOAL=400;
function kcalRangeSum(pred){return HISTORY.filter(pred).reduce((s,h)=>s+kcalOf(h),0)}
function kcalToday(){const d=todayISO();return Math.round(kcalRangeSum(h=>h.date===d))}
function kcalThisWeek(){
  const mon=weekMondayOf(0);const a=isoOf(mon);const b=new Date(mon);b.setDate(mon.getDate()+6);const e=isoOf(b);
  return Math.round(kcalRangeSum(h=>h.date>=a&&h.date<=e));
}
function kcalThisMonth(){const m=todayISO().slice(0,7);return Math.round(kcalRangeSum(h=>h.date.slice(0,7)===m))}
function kcalThisYear(){const y=todayISO().slice(0,4);return Math.round(kcalRangeSum(h=>h.date.slice(0,4)===y))}
function kcalAllTime(){return Math.round(kcalRangeSum(()=>true))}
function animateNumber(el,to,duration){
  if(!el)return;
  const from=parseInt(el.dataset.val||'0',10)||0;
  el.dataset.val=to;
  const start=performance.now();
  function frame(now){
    const p=Math.min(1,(now-start)/duration);
    const eased=1-Math.pow(1-p,3);
    const v=Math.round(from+(to-from)*eased);
    const txt=v.toLocaleString(localeOf());
    if(el.firstChild&&el.firstChild.nodeType===1){el.firstChild.textContent=txt}else{el.textContent=txt}
    if(p<1)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function finishWorkout(key,dateStr){
  const day=PROGRAM[key];if(!day)return null;
  let done=0,tot=0,kcalTotal=0;const snap={};
  const items=day.ex.map(ex=>{
    const a=activeOf(ex);const arr=setsArr(ex.id,a.sets,key);
    const s=arr.filter(x=>x.d).length;done+=s;tot+=a.sets;
    if(!a.bw)snap[a.vid]=wOf(a);
    const sw=a.bw?null:arr.map(x=>x.d?(x.w!=null?x.w:wOf(a)):null);
    const trackedVal=((a.unit==='m'||a.unit==='min')&&s>0)?(()=>{const first=arr.find(x=>x.d);return first&&first.w!=null?first.w:wOf(a)})():0;
    kcalTotal+=estimateKcalForItem(ex,a,s,trackedVal);
    return {id:a.vid,n:a.name,s,t:a.sets,w:a.bw?null:wOf(a),sw};
  });
  if(done===0)return null;
  const kcal=Math.round(kcalTotal);
  HISTORY.unshift({date:dateStr||todayISO(),workout:key,label:day.label,done,tot,weights:snap,items,kcal,ts:Date.now()});
  save('iron_history',HISTORY);
  SESSION[key]={};save('iron_session',SESSION);
  delete SESSMETA[key];save('iron_sessmeta',SESSMETA);
  if(RESUMED===key)RESUMED=null;
  cloudSync();
  return {done,tot,kcal};
}

};

function askDate(defISO,cb){
  const hoje=todayISO();
  const y=new Date(hoje+'T00:00');y.setDate(y.getDate()-1);const ont=isoOf(y);
  boxOpen(`<h3>${t('askdatetit')}</h3>
    <div class="sub">${t('askdatesub')}</div>
    <div class="qchips" style="margin-bottom:10px">
      <button class="qchip${defISO===hoje?' on':''}" onclick="pickDate('${hoje}')">${t('hoje')}</button>
      <button class="qchip${defISO===ont?' on':''}" onclick="pickDate('${ont}')">${t('ontem')}</button>
    </div>
    <input type="date" id="askD" value="${defISO}" max="${hoje}" style="width:100%;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--ink);font-family:'Manrope';font-weight:700;font-size:14px;margin-bottom:10px">
    <div class="mrow">
      <button class="mbtn" onclick="boxClose()">${t('cancelar')}</button>
      <button class="mbtn pri" onclick="confirmDate()">${t('confirmar')}</button>
    </div>`);
  ASKCB=cb;
}
let ASKCB=null;
function pickDate(iso){$('askD').value=iso;confirmDate()}
function confirmDate(){
  const v=$('askD').value||todayISO();
  boxClose();
  if(ASKCB){const f=ASKCB;ASKCB=null;f(v)}
}

/* ---- clicar num dia da semana ---- */
function openDay(iso){
  const hits=HISTORY.filter(h=>h.date===iso);
  if(!hits.length){
    boxOpen(`<h3>${dtBR(iso)}</h3>
      <div class="sub">Nenhum treino registrado neste dia.</div>
      <div class="mrow"><button class="mbtn pri" onclick="boxClose()">Fechar</button></div>`);
    return;
  }
  if(hits.length===1){editHist(hits[0].ts);return}
  boxOpen(`<h3>${dtBR(iso)}</h3>
    <div class="sub">${hits.length} treinos neste dia. Escolha qual editar.</div>
    <div class="mlist">${hits.map(h=>`<div class="prow"><div class="rtx"><b>${h.label} · Treino ${h.workout}</b><small>${h.done}/${h.tot} séries</small></div>
      <button class="padd" onclick="editHist(${h.ts})">✎</button></div>`).join('')}</div>
    <div class="mrow" style="margin-top:10px"><button class="mbtn" onclick="boxClose()">← Voltar</button></div>`);
}

/* ---- editar um treino já registrado ---- */
let EDITH=null;
function normRows(h,it){
  const t=it.t||0;const rows=[];
  const sw=it.sw||[];
  if(sw.length===t){for(let i=0;i<t;i++)rows.push({d:sw[i]!=null,w:sw[i]!=null?sw[i]:(it.w!=null?it.w:0)})}
  else{for(let i=0;i<t;i++){const on=i<(it.s||0);rows.push({d:on,w:on&&sw[i]!=null?sw[i]:(it.w!=null?it.w:0)})}}
  return rows;
}
function editHist(ts){
  const h=HISTORY.find(x=>x.ts===ts);if(!h){toast(t('regnaoenc'));return}
  if(!h.items||!h.items.length){
    h.items=Object.entries(h.weights||{}).map(([vid,w])=>({id:vid,n:vidName(vid),s:1,t:1,w,sw:[w]}));
    if(!h.items.length){toast('Esse registro não tem detalhes pra editar');return}
  }
  EDITH={ts,date:h.date,rows:h.items.map(it=>({n:it.n,id:it.id,u:unitOf(it.id),bw:it.w==null&&!(it.sw&&it.sw.length),sets:normRows(h,it)}))};
  paintEditH();
}
function paintEditH(){
  const e=EDITH;
  boxOpen(`<button class="mback" onclick="boxClose()">← Voltar</button>
    <h3>Editar treino</h3>
    <div class="sub">Ajuste as séries feitas e as cargas. Toque no ✓ pra marcar ou desmarcar.</div>
    <input type="date" id="ehDate" value="${e.date}" max="${todayISO()}" onchange="EDITH.date=this.value"
      style="width:100%;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font-family:'Manrope';font-weight:700;font-size:13.5px;margin-bottom:10px">
    <div class="mlist">${e.rows.map((r,ri)=>`
      <div style="margin-bottom:11px">
        <div style="font-size:12.5px;font-weight:800;margin-bottom:5px">${r.n}</div>
        <div class="srows">${r.sets.map((s,si)=>`
          <div class="srow${s.d?' done':''}" data-r="${ri}" data-s="${si}">
            <div class="snum">${si+1}</div>
            ${r.bw?'<div class="scell"><div class="swt bwlab">corporal</div></div>':
             `<button class="sstep" onclick="ehBump(${ri},${si},${-stepForUnit(r.u)})">−</button>
              <div class="scell"><div class="swt">${fmtW(s.w)}<span class="u">${r.u||'kg'}</span></div></div>
              <button class="sstep" onclick="ehBump(${ri},${si},${stepForUnit(r.u)})">+</button>`}
            <button class="schk${s.d?' on':''}" onclick="ehTgl(${ri},${si})">${s.d?'✓':''}</button>
          </div>`).join('')}</div>
      </div>`).join('')}</div>
    <div class="mrow" style="margin-top:12px">
      <button class="mbtn" onclick="boxClose()">Cancelar</button>
      <button class="mbtn pri" onclick="ehSave()">Salvar</button>
    </div>`);
}
function ehRow(ri,si){return document.querySelector(`#boxModal .srow[data-r="${ri}"][data-s="${si}"]`)}
function ehTgl(ri,si){
  const s=EDITH.rows[ri].sets[si];s.d=!s.d;
  const row=ehRow(ri,si);if(!row)return paintEditH();
  row.classList.toggle('done',s.d);
  const b=row.querySelector('.schk');b.classList.toggle('on',s.d);b.textContent=s.d?'✓':'';
  if(navigator.vibrate)navigator.vibrate(18);
}
function ehBump(ri,si,d){
  const r=EDITH.rows[ri];const s=r.sets[si];let v=(s.w||0)+d;if(v<0)v=0;s.w=Math.round(v*10)/10;
  const row=ehRow(ri,si);if(!row)return paintEditH();
  const w=row.querySelector('.swt');if(w)w.innerHTML=fmtW(s.w)+'<span class="u">'+(r.u||'kg')+'</span>';
}
function ehSave(){
  const e=EDITH;const h=HISTORY.find(x=>x.ts===e.ts);if(!h){boxClose();return}
  let done=0,tot=0;
  h.items=h.items.map((it,ri)=>{
    const r=e.rows[ri];if(!r)return it;
    const s=r.sets.filter(x=>x.d).length;done+=s;tot+=r.sets.length;
    const firstW=(r.sets.find(x=>x.d)||{}).w;
    return {...it,s,t:r.sets.length,
      w:r.bw?null:(firstW!=null?firstW:it.w),
      sw:r.bw?null:r.sets.map(x=>x.d?x.w:null)};
  });
  h.done=done;h.tot=tot;h.date=e.date;
  if(!r_hasBW(h))h.weights=Object.fromEntries(h.items.filter(i=>i.w!=null).map(i=>[i.id||i.n,i.w]));
  h.kcal=recomputeKcal(h);
  HISTORY.sort((a,b)=>(b.date<a.date?-1:b.date>a.date?1:(b.ts||0)-(a.ts||0)));
  save('iron_history',HISTORY);cloudSync();
  boxClose();render();toast('Treino atualizado ✔');
}
function r_hasBW(h){return false}
function delHistTs(ts){
  const i=HISTORY.findIndex(x=>x.ts===ts);if(i<0)return;
  const h=HISTORY[i];
  if(!confirm('Mover para a lixeira?\n\n'+h.label+' · Treino '+h.workout+' ('+dtBR(h.date)+')\n\nVocê pode restaurar depois em "Treinos excluídos".'))return;
  HISTORY.splice(i,1);
  TRASH.unshift({...h,delAt:Date.now()});
  save('iron_history',HISTORY);save('iron_trash',TRASH);cloudSync();
  boxClose();render();toast(t('movidolixeira'));
}
function openTrash(){
  if(!TRASH.length){
    boxOpen(`<h3>Treinos excluídos</h3>
      <div class="sub">A lixeira está vazia. Tudo que você excluir aparece aqui e pode ser restaurado.</div>
      <div class="mrow"><button class="mbtn pri" onclick="boxClose()">Fechar</button></div>`);
    return;
  }
  boxOpen(`<button class="mback" onclick="boxClose()">← Voltar</button>
    <h3>Treinos excluídos</h3>
    <div class="sub">${TRASH.length} registro${TRASH.length===1?'':'s'} na lixeira. Restaure o que precisar.</div>
    <div class="mlist">${TRASH.map((h,i)=>`<div class="prow">
      <div class="rtx"><b>${h.label} · Treino ${h.workout}</b><small>${dtBR(h.date)} · ${h.done}/${h.tot} séries</small></div>
      <button class="padd" onclick="restoreTrash(${i})">↩</button></div>`).join('')}</div>
    <div class="mrow" style="margin-top:12px">
      <button class="mbtn" onclick="boxClose()">Fechar</button>
      <button class="mbtn pri" onclick="restoreAll()">Restaurar todos</button>
    </div>`);
}
function restoreTrash(i){
  const h=TRASH[i];if(!h)return;
  TRASH.splice(i,1);
  const {delAt,...clean}=h;
  HISTORY.push(clean);
  HISTORY.sort((a,b)=>(b.date<a.date?-1:b.date>a.date?1:(b.ts||0)-(a.ts||0)));
  save('iron_history',HISTORY);save('iron_trash',TRASH);cloudSync();
  render();toast('Treino restaurado ✔');
  if(TRASH.length)openTrash();else boxClose();
}
function restoreAll(){
  if(!TRASH.length)return;
  TRASH.forEach(h=>{const {delAt,...clean}=h;HISTORY.push(clean)});
  TRASH=[];
  HISTORY.sort((a,b)=>(b.date<a.date?-1:b.date>a.date?1:(b.ts||0)-(a.ts||0)));
  save('iron_history',HISTORY);save('iron_trash',TRASH);cloudSync();
  boxClose();render();toast('Todos os treinos restaurados ✔');
}

/* ---- estatísticas clicáveis ---- */

  const h=HISTORY.find(x=>x.ts===ts);if(!h){toast(t('regnaoenc'));return}
  const det=(h.items&&h.items.length)?h.items.map(it=>{
    const sv=(it.sw||[]).filter(v=>v!=null);
    const u=unitOf(it.id);
    const wtx=sv.length?sv.map(fmtW).join(' · ')+' '+u:(it.w!=null?fmtW(it.w)+' '+u:'peso corporal');
    return `<div class="hd-row"><span>${it.n}</span><small>${it.s}/${it.t} séries<br>${wtx}</small></div>`}).join(''):
    (h.weights&&Object.keys(h.weights).length?Object.entries(h.weights).map(([vid,w])=>
      `<div class="hd-row"><span>${vidName(vid)}</span><small>${fmtW(w)} ${unitOf(vid)}</small></div>`).join(''):
      '<div class="empty">Sem detalhes salvos nesta sessão.</div>');
  boxOpen(`<button class="mback" onclick="boxClose()">← Voltar</button>
    <h3>${h.label} · Treino ${h.workout}</h3>
    <div class="sub">${dtBR(h.date)} · ${h.done}/${h.tot} séries (${Math.round(h.done/h.tot*100)}%)</div>
    <div class="mlist">${det}</div>
    <div class="mrow" style="margin-top:12px">
      <button class="mbtn pri" onclick="editHist(${h.ts})">✎ Editar treino</button>
    </div>
    <div class="mrow">
      <button class="mbtn" onclick="dupHist(${h.ts})">Repetir hoje</button>
      <button class="mbtn" onclick="delHistTs(${h.ts})" style="color:var(--red)">Excluir</button>
    </div>`);
}
function dupHist(ts){
  const h=HISTORY.find(x=>x.ts===ts);if(!h)return;
  const copy=JSON.parse(JSON.stringify(h));
  copy.date=todayISO();copy.ts=Date.now();
  HISTORY.unshift(copy);
  HISTORY.sort((a,b)=>(b.date<a.date?-1:b.date>a.date?1:(b.ts||0)-(a.ts||0)));
  save('iron_history',HISTORY);cloudSync();boxClose();render();
  toast('Treino repetido em '+dtBR(copy.date));
}
function statWeek(){
  const now=new Date();
  const list=HISTORY.filter(h=>{const d=new Date(h.date+'T00:00');const diff=(now-d)/864e5;return diff>=0&&diff<7});
  const sets=list.reduce((s,h)=>s+h.done,0);
  boxOpen(`<button class="mback" onclick="boxClose()">← Voltar</button>
    <h3>Últimos 7 dias</h3>
    <div class="sub">${list.length} treino${list.length===1?'':'s'} · ${sets} séries no total.</div>
    <div class="mlist">${list.length?list.map(h=>`<div class="prow"><div class="rtx"><b>${h.label} · Treino ${h.workout}</b>
      <small>${dtBR(h.date)} · ${h.done}/${h.tot} séries</small></div>
      <button class="padd" onclick="editHist(${h.ts})">✎</button></div>`).join(''):'<div class="empty">Nenhum treino nos últimos 7 dias.</div>'}</div>
    <div class="mrow" style="margin-top:10px"><button class="mbtn pri" onclick="boxClose()">Fechar</button></div>`);
}
function statLast(){
  const h=HISTORY[0];
  if(!h){boxOpen(`<h3>Último treino</h3><div class="sub">Você ainda não registrou nenhum treino.</div>
    <div class="mrow"><button class="mbtn pri" onclick="boxClose()">Fechar</button></div>`);return}
  const det=(h.items||[]).map(it=>{
    const u=unitOf(it.id);const sv=(it.sw||[]).filter(v=>v!=null);const wtx=sv.length?sv.map(fmtW).join(' · ')+' '+u:(it.w!=null?fmtW(it.w)+' '+u:'peso corporal');
    return `<div class="hd-row"><span>${it.n}</span><small>${it.s}/${it.t} séries<br>${wtx}</small></div>`}).join('');
  boxOpen(`<button class="mback" onclick="boxClose()">← Voltar</button>
    <h3>${h.label} · Treino ${h.workout}</h3>
    <div class="sub">${dtBR(h.date)} · ${h.done}/${h.tot} séries (${Math.round(h.done/h.tot*100)}%)</div>
    <div class="mlist">${det||'<div class="empty">Sem detalhes salvos.</div>'}</div>
    <div class="mrow" style="margin-top:10px">
      <button class="mbtn" onclick="boxClose()">Fechar</button>
      <button class="mbtn pri" onclick="editHist(${h.ts})">✎ Editar</button>
    </div>`);
}
function statTotal(){
  const by={};
  HISTORY.forEach(h=>{const k=h.date.slice(0,7);(by[k]=by[k]||[]).push(h)});
  const keys=Object.keys(by).sort().reverse();
  const mLbl=k=>{const d=new Date(k+'-01T00:00');return d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
  boxOpen(`<button class="mback" onclick="boxClose()">← Voltar</button>
    <h3>Total: ${HISTORY.length} treinos</h3>
    <div class="sub">Agrupados por mês. Toque no ✎ pra editar.</div>
    <div class="mlist">${keys.length?keys.map(k=>`
      <div class="wkhead">${mLbl(k)} · ${by[k].length} treino${by[k].length===1?'':'s'}</div>
      ${by[k].map(h=>`<div class="prow"><div class="rtx"><b>${h.label} · Treino ${h.workout}</b>
        <small>${dtBR(h.date)} · ${h.done}/${h.tot} séries</small></div>
        <button class="padd" onclick="editHist(${h.ts})">✎</button></div>`).join('')}
      `).join(''):'<div class="empty">Nenhum treino registrado.</div>'}</div>
    <div class="mrow" style="margin-top:10px"><button class="mbtn pri" onclick="boxClose()">Fechar</button></div>`);
}

/* =================== PROGRESSO =================== */
function weekMondayOf(off){
  const now=new Date(todayISO()+'T00:00');
  const dw=(now.getDay()+6)%7;
  const m=new Date(now);m.setDate(now.getDate()-dw+(off*7));
  return m;
}
const isoOf=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
function weekLabel(off){
  const a=weekMondayOf(off),b=new Date(a);b.setDate(a.getDate()+6);
  const f=x=>x.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
  if(off===0)return 'Esta semana';
  if(off===-1)return 'Semana passada';
  return f(a)+' a '+f(b);
}
function shiftWeek(n){
  const nw=WEEKOFF+n;
  if(nw>0)return;
  WEEKOFF=nw;renderProgress();
}
function renderProgress(){
  const pv=$('progView');
  const now=new Date();
  const last7=new Set();
  HISTORY.forEach(h=>{const d=new Date(h.date+'T00:00');const diff=(now-d)/864e5;if(diff>=0&&diff<7)last7.add(h.date)});
  const total=HISTORY.length;
  const lastH=HISTORY[0];
  const wd=[t('wdSeg'),t('wdTer'),t('wdQua'),t('wdQui'),t('wdSex'),t('wdSab'),t('wdDom')];
  const WKPAGES=12;
  let pagesHtml='';
  for(let off=-(WKPAGES-1);off<=0;off++){
    const mon=weekMondayOf(off);
    let ds='';
    for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);
      const iso=isoOf(d);
      const hits=HISTORY.filter(h=>h.date===iso);
      const isToday=iso===todayISO();
      const lbl=hits.length?(hits.length>1?hits.length+'×':hits[0].workout):'';
      ds+=`<div class="day"><button class="ball${hits.length?' hit':''}${isToday?' today':''}" onclick="openDay('${iso}')">${lbl}</button><small>${wd[i]}</small></div>`;
    }
    const a=isoOf(mon);const bb=new Date(mon);bb.setDate(mon.getDate()+6);const e=isoOf(bb);
    const cnt=HISTORY.filter(h=>h.date>=a&&h.date<=e).length;
    pagesHtml+=`<div class="wkpage"><div class="wklab">${weekLabel(off)} · ${cnt} treino${cnt===1?'':'s'}</div><div class="days">${ds}</div></div>`;
  }
  const wkKey=iso=>{const d=new Date(iso+'T00:00');const dw=(d.getDay()+6)%7;d.setDate(d.getDate()-dw);return isoOf(d)};
  const wkLbl=mon=>{const a=new Date(mon+'T00:00');const b=new Date(a);b.setDate(a.getDate()+6);
    const f=x=>x.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});return 'Semana de '+f(a)+' a '+f(b)};
  let lastWk=null;
  const hist=HISTORY.length?HISTORY.map((h,i)=>{
    const d=new Date(h.date+'T00:00');
    const ds=d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
    const pct=Math.round(h.done/h.tot*100);
    const wk=wkKey(h.date);
    const head=wk!==lastWk?`<div class="wkhead">${wkLbl(wk)}</div>`:'';
    lastWk=wk;
    const det=h.items?h.items.map(it=>{
      const u=unitOf(it.id);const sv=(it.sw||[]).filter(v=>v!=null);const wtx=sv.length?sv.map(fmtW).join(' · ')+' '+u:(it.w!=null?fmtW(it.w)+' '+u:'');
      return `<div class="hd-row"><span>${it.n}</span><small>${it.s}/${it.t} séries${wtx?' · '+wtx:''}</small></div>`}).join(''):
      (h.weights&&Object.keys(h.weights).length?Object.entries(h.weights).map(([vid,w])=>
      `<div class="hd-row"><span>${vidName(vid)}</span><small>${fmtW(w)} ${unitOf(vid)}</small></div>`).join(''):
      '<div class="hd-row"><span>Sem detalhes salvos nesta sessão</span></div>');
    return `${head}<div class="hrow" onclick="openHistMenu(${h.ts})">
      <div class="wk" style="background:${accentFor(h.workout).a};color:${accentFor(h.workout).ink}">${h.workout}</div>
      <div class="mid"><b>${h.label} · Treino ${h.workout}</b><small>${ds} · ${h.done}/${h.tot} séries</small></div>
      <div class="pct">${pct}%</div><span class="hcv" style="transform:rotate(-90deg)">▾</span></div>`;
  }).join(''):'<div class="empty">Nenhum treino registrado ainda.<br>Conclua um treino e ele aparece aqui. 📈</div>';
  const plan=SETUP?`<div class="tip"><div class="ic">📅</div><p><b>Sua semana:</b> ${weekPlan(SETUP)} (${SETUP.freq}x). Nos outros dias, descanso ou caminhada leve.</p></div>`:'';

  pv.innerHTML=`
    <div class="stats">
      <button class="stat" onclick="statWeek()"><div class="v">${last7.size}</div><div class="k">${t('ultimos7')}</div></button>
      <button class="stat" onclick="statLast()"><div class="v">${lastH?lastH.workout:'–'}</div><div class="k">${t('ultimotreino')}</div></button>
      <button class="stat" onclick="statTotal()"><div class="v">${total}</div><div class="k">${t('totalfeitos')}</div></button>
    </div>
    <div class="week">
      <h4>${t('sersemana')}</h4>
      <div class="wkscroll" id="wkscroll" onscroll="WKSCROLL=this.scrollLeft">${pagesHtml}</div>
      <div class="wkfoot">Arraste para o lado para ver semanas anteriores · toque num dia para ver ou editar</div>
    </div>
    <div class="exports">
      <button class="abtn vid" onclick="exportXLSX()">${t('exportarxlsx')}</button>
      <button class="abtn" onclick="exportPDF()">${t('exportarpdf')}</button>
    </div>
    <div class="exports">
      <button class="abtn" onclick="openWizard(true)">${t('personalizar')}</button>
      <button class="abtn vid" onclick="askEvolve()">${t('evoluir')}</button>
    </div>
    <div class="exports">
      <button class="abtn" onclick="openTrash()">${t('excluidos')}${TRASH.length?' ('+TRASH.length+')':''}</button>
      <button class="abtn" onclick="openBackup()">${t('backup')}</button>
    </div>
    ${PROG_BACKUPS.length?`<div class="exports"><button class="abtn" onclick="openProgBackups()">${t('versoesant')} (${PROG_BACKUPS.length})</button></div>`:''}
    <div class="sectit">Histórico ${TRASH.length?`<button onclick="openTrash()">🗑 Excluídos (${TRASH.length})</button>`:''}</div>
    <div class="hist">${hist}</div>
    <div class="tips">
      <div class="sectit" style="font-size:14px">Princípios do Dr. 🧬</div>
      ${plan}
      <div class="tip"><div class="ic">📈</div><p><b>Progressão dupla:</b> fechou o topo das reps em todas as séries (com 2 na reserva)? Sobe ~5% na carga e volta pro fundo da faixa.</p></div>
      <div class="tip"><div class="ic">🔁</div><p><b>Frequência 2×:</b> treinar cada músculo 2x por semana rende mais hipertrofia que 1x com o mesmo volume.</p></div>
      <div class="tip"><div class="ic">⏳</div><p><b>Descansos:</b> 90 a 120s nos compostos pesados e 45 a 60s nos isolados é o que a evidência mais recente aponta como ideal.</p></div>

    </div>
    ${LS_OK?'':'<div class="empty" style="color:var(--red)">⚠️ Este ambiente não salva dados entre sessões. Hospede o arquivo (ex: GitHub Pages).</div>'}
  `;
  const ws=$('wkscroll');
  if(ws)requestAnimationFrame(()=>{ws.scrollLeft=(WKSCROLL!=null?WKSCROLL:ws.scrollWidth)});
}
function calcStreak(){
  if(!HISTORY.length)return 0;
  const weeks=new Set();
  HISTORY.forEach(h=>{const d=new Date(h.date+'T00:00');const oneJan=new Date(d.getFullYear(),0,1);
    const wk=d.getFullYear()+'-'+Math.ceil(((d-oneJan)/864e5+oneJan.getDay()+1)/7);weeks.add(wk)});
  const now=new Date();const oneJan=new Date(now.getFullYear(),0,1);
  let wkNum=Math.ceil(((now-oneJan)/864e5+oneJan.getDay()+1)/7);
  let streak=0;
  while(weeks.has(now.getFullYear()+'-'+wkNum)){streak++;wkNum--}
  return streak;
}

let DRAG=null;
function dragStart(e,i){
  e.preventDefault();e.stopPropagation();
  const list=$('list');
  const cards=[...list.querySelectorAll('.card')];
  const el=cards[i];if(!el)return;
  const rects=cards.map(c=>c.getBoundingClientRect());
  DRAG={i,from:i,el,cards,rects,startY:e.clientY,dy:0,h:rects[i].height+12,to:i};
  el.setPointerCapture(e.pointerId);
  el.classList.add('dragging');list.classList.add('dragmode');
  cards.forEach(c=>{if(c!==el)c.classList.add('shifted')});
  if(navigator.vibrate)navigator.vibrate(14);
  el.onpointermove=dragMove;el.onpointerup=dragEnd;el.onpointercancel=dragEnd;
}
function dragMove(e){
  if(!DRAG)return;
  DRAG.dy=e.clientY-DRAG.startY;
  DRAG.el.style.transform=`translateY(${DRAG.dy}px) scale(1.02)`;
  const centro=DRAG.rects[DRAG.i].top+DRAG.rects[DRAG.i].height/2+DRAG.dy;
  let to=DRAG.i;
  DRAG.rects.forEach((r,j)=>{
    if(j===DRAG.i)return;
    const c=r.top+r.height/2;
    if(DRAG.dy>0&&c<centro&&j>DRAG.i)to=Math.max(to,j);
    if(DRAG.dy<0&&c>centro&&j<DRAG.i)to=Math.min(to===DRAG.i?j:to,j);
  });
  if(to!==DRAG.to){DRAG.to=to;if(navigator.vibrate)navigator.vibrate(8)}
  DRAG.cards.forEach((c,j)=>{
    if(c===DRAG.el)return;
    let shift=0;
    if(DRAG.to>DRAG.i&&j>DRAG.i&&j<=DRAG.to)shift=-DRAG.h;
    if(DRAG.to<DRAG.i&&j<DRAG.i&&j>=DRAG.to)shift=DRAG.h;
    c.style.transform=shift?`translateY(${shift}px)`:'';
  });
}
function dragEnd(e){
  if(!DRAG)return;
  const {el,to,from}=DRAG;
  el.onpointermove=el.onpointerup=el.onpointercancel=null;
  el.classList.remove('dragging');el.style.transform='';
  $('list').classList.remove('dragmode');
  DRAG.cards.forEach(c=>{c.classList.remove('shifted');c.style.transform=''});
  DRAG=null;
  if(to!==from){
    const exs=PROGRAM[cur].ex;
    const [mv]=exs.splice(from,1);
    exs.splice(to,0,mv);
    save('iron_program',PROGRAM);cloudSync();

    return 'Muitos pedidos seguidos. O plano gratuito libera poucos e-mails por hora: espere uns 30 a 60 minutos e tente de novo.';

    return 'O endereço de retorno não está liberado. No Supabase: Authentication > URL Configuration > adicione esta página em Site URL e Redirect URLs.';
  if(m.indexOf('smtp')>=0||m.indexOf('sending')>=0||m.indexOf('email')>=0&&m.indexOf('error')>=0)
    return 'O servidor de e-mail do Supabase recusou o envio. Verifique Authentication > Emails, ou tente de novo mais tarde.';
  if(m.indexOf('invalid login')>=0)return 'E-mail ou senha incorretos.';
  if(m.indexOf('already registered')>=0)return 'Esse e-mail já tem conta. Use Entrar.';
  if(m.indexOf('user not found')>=0)return 'Não achei conta com esse e-mail. Confira se digitou certo.';
  if(m.indexOf('signup')>=0&&m.indexOf('disabled')>=0)return 'Cadastro desativado no painel do Supabase (Authentication > Providers > Email).';
  if(m.indexOf('failed to fetch')>=0||m.indexOf('network')>=0)return 'Sem conexão com o servidor. Verifique a internet e tente de novo.';
