false,"w":14,"sets":1,"reps":"10–20 min","rest":0,"yt":"stepmill workout form","steps":["Suba no aparelho e escolha o modo manual ou um programa","Mantenha as mãos leves no corrimão","Suba degrau por degrau com passos completos","Ajuste a velocidade conforme seu fôlego"],"g":"Pise com o pé inteiro pra trabalhar o glúteo.","b":"Não se debruce sobre o corrimão."},"treadmillhiit":{"name":"Esteira: Tiros Intervalados (HIIT)","fig":"custom","grp":"cardio","mus":"Condicionamento","cat":"cardio","eq":"cardio","unit":"min","bw":false,"w":14,"sets":1,"reps":"12–16 min","rest":0,"evolve":"assaultbike","yt":"treadmill hiit sprint intervals","steps":["Aqueça 3 min em ritmo leve","Corra forte por 30 s, em um ritmo que você sustente só por esse tempo","Volte pra caminhada ou trote leve por 60 a 90 s","Repita 6 a 8 vezes e termine com 3 min leves"],"g":"Se conseguir conversar durante o tiro, ele ainda não está forte o bastante.","b":"Não use inclinação alta nem velocidade em que você perca o controle dos passos."},"bikehiit":{"name":"Bike: Intervalos (HIIT)","fig":"custom","grp":"cardio","mus":"Condicionamento","cat":"cardio","eq":"cardio","unit":"min","bw":false,"w":14,"sets":1,"reps":"12–16 min","rest":0,"yt":"stationary bike hiit intervals","steps":["Pedale 3 min leve pra aquecer","Aumente a carga e pedale forte por 30 s","Reduza a carga e gire leve por 60 s","Repita 8 a 10 vezes e finalize com 3 min leves"],"g":"Ótima opção de HIIT com pouco impacto nas articulações.","b":"Não deixe os joelhos caírem pra dentro nos tiros."},"rowerhiit":{"name":"Remo: Intervalos (HIIT)","fig":"custom","grp":"cardio","mus":"Condicionamento","cat":"cardio","eq":"cardio","unit":"min","bw":false,"w":12,"sets":1,"reps":"10–14 min","rest":0,"yt":"rowing machine hiit intervals","steps":["Reme 3 min leve pra aquecer","Reme forte por 30 s empurrando bem com as pernas","Reme leve por 60 s recuperando o fôlego","Repita 6 a 8 vezes e finalize com 2 min leves"],"g":"A ordem do remo é pernas, tronco e braços; na volta, braços, tronco e pernas.","b":"Não puxe só com os braços nem curve a lombar."},"latraisemachine":{"name":"Elevação Lateral na Máquina","fig":"lateralraise","grp":"shoulders","mus":"Deltóide lateral","cat":"iso","eq":"machine","w":15,"sets":3,"reps":"12–15","rest":45,"yt":"machine lateral raise form","steps":["Ajuste o banco para o ombro ficar na altura do eixo de giro da máquina","Sentado, costas apoiadas, encoste os antebraços ou cotovelos nas almofadas","Eleve os braços para os lados até a altura dos ombros, empurrando com os cotovelos","Desça devagar, sem deixar a pilha de pesos bater"],"g":"Empurre com o cotovelo, não com a mão: o ombro faz o trabalho e o trapézio fica relaxado.","b":"Não suba acima da altura dos ombros nem encolha os ombros em direção às orelhas."}};
const NEWX_EN={"cablecrunchv":{"name":"Cable Crunch","steps":["Kneel facing a high cable with the rope beside your neck","Hips stay still over your heels, torso slightly forward","Curl your spine, bringing elbows toward knees","Return under control without letting the weight pull you up"],"g":"The movement comes from the abs, not from pulling with your arms.","b":"Do not sit your hips back: it turns into an arm pull, not a crunch."},"declinecrunch":{"name":"Decline Crunch","steps":["Lie on a decline bench with your feet hooked under the pads","Cross your arms on your chest or keep hands light behind the head","Curl up, bringing ribs toward pelvis","Lower slowly until the abs stretch, without fully lying down"],"g":"Chin away from the chest, eyes forward.","b":"Do not pull your head with your hands or rely on momentum."},"crosscrunch":{"name":"Cross-Body Crunch (elbow to knee)","steps":["Lie down, knees bent, hands light behind your head","Lift your torso and rotate to bring one elbow toward the opposite knee","Hold 1s squeezing the oblique","Lower slowly and alternate sides"],"g":"The twist comes from the torso, not the neck.","b":"Do not yank your neck with your hands."},"jackknife":{"name":"Jackknife Sit-Up (V-up)","steps":["Lie down with arms extended overhead and legs straight","Raise torso and legs together, reaching hands toward your feet","Squeeze the abs hard at the top, forming a V","Lower under control without dropping to the floor"],"g":"Nearly straight legs hit the lower abs harder.","b":"Do not throw your arms: momentum takes work away from the abs."},"obliquecrunch":{"name":"Floor Oblique Crunch","steps":["Lie on your back, knees bent and tilted to one side","One hand light behind your head","Lift your shoulder toward your hip, squeezing the side of your abs","Lower under control and switch sides after the set"],"g":"Think of bringing your rib toward your hip.","b":"Do not force your neck forward."},"dbsidebend":{"name":"Dumbbell Side Bend","steps":["Stand with a dumbbell in one hand and the other hand behind your head","Bend your torso sideways toward the dumbbell","Come back up squeezing the oblique on the opposite side","Finish your reps and switch sides"],"g":"Move only in the side plane, without rotating.","b":"Avoid heavy loads: they can overload the lower back."},"scissorkick":{"name":"Scissor Kick","steps":["Lie on your back, hands under your hips, legs straight","Raise both legs a few centimetres off the floor","Cross the legs over each other alternately, in short movements","Keep your lower back pressed into the floor throughout"],"g":"The lower the legs, the harder it gets: adjust to your lower back.","b":"Do not let your lower back arch."},"kneeraisebars":{"name":"Knee Raise on Parallel Bars","steps":["Rest forearms and back on the pads, legs hanging","Contract your abs and bring knees toward your chest","Curl the pelvis slightly and pause at the top","Lower slowly without swinging"],"g":"Curling the pelvis works the abs, not just the hip flexors.","b":"Do not swing your legs using momentum."},"abmachine":{"name":"Ab Crunch Machine","steps":["Adjust the seat so your hips line up with the machine pivot","Hold the handles with feet planted","Flex your torso forward contracting the abs","Return under control without letting the stack touch down"],"g":"Exhale as you crunch and keep your lower back against the pad.","b":"Do not pull with your arms or legs."},"situpv":{"name":"Sit-Up","steps":["Lie down, knees bent, feet flat (or anchored)","Arms crossed on chest or hands light behind head","Sit up all the way, contracting the abs","Lower under control, one vertebra at a time"],"g":"Curl up by rolling the spine, do not throw your torso.","b":"Do not pull your neck with your hands."},"weightedcrunch":{"name":"Weighted Crunch (plate or medicine ball)","steps":["Lie down, knees bent, weight held to your chest","Curl your torso up rolling the spine","Squeeze the abs at the top for 1s","Lower slowly until your shoulder blades almost touch the floor"],"g":"Weight at the chest keeps it safe: extend it only when you master the move.","b":"Do not pull your head forward."},"ballcrunch":{"name":"Stability Ball Crunch","steps":["Sit on the ball and roll down until your lower back is supported","Feet planted, hands crossed on chest","Curl up lifting your shoulder blades","Return by extending your back over the ball, under control"],"g":"The instability recruits the whole core: go slowly.","b":"Do not let the ball roll as you rise."},"cablecrunchtwist":{"name":"Cable Crunch with Twist","steps":["Kneel facing a high cable with the rope by your head","Curl your torso down","Rotate bringing the elbow toward the opposite knee, alternating sides","Return under control keeping the abs engaged"],"g":"Rotate through the ribs, hips stay still.","b":"Do not twist your whole body: rotation comes from the torso."},"legpullin":{"name":"Lying Leg Pull-In","steps":["Lie on a bench (or mat) with legs off the end, hands under your hips","Extend your legs straight out","Bend the knees and pull thighs toward your chest, exhaling","Hold 1s and extend the legs slowly, without touching the floor"],"g":"Short, controlled movement: the lower abs do the work.","b":"Do not rock your torso for momentum."},"dbfly":{"name":"Dumbbell Fly","steps":["Lie on a bench, dumbbells above your chest, elbows slightly bent","Open your arms in an arc until your chest stretches","Keep the elbow angle fixed the whole time","Close in an arc squeezing the chest, without clanking the dumbbells"],"g":"Think of hugging a tree: wide, controlled arc.","b":"Do not lower past a comfortable stretch: protects the shoulder."},"inclinefly":{"name":"Incline Dumbbell Fly","steps":["Incline bench at 30–45° with dumbbells above your chest","Open your arms in an arc with elbows slightly bent","Lower until you feel the upper chest stretch","Close in an arc contracting the chest"],"g":"About 30° of incline emphasizes the upper chest.","b":"Do not raise the incline too much: it becomes a shoulder exercise."},"dbpullover":{"name":"Dumbbell Pullover","steps":["Lie on a bench holding one dumbbell with both hands above your chest","Take the dumbbell behind your head in an arc, elbows slightly bent","Stretch chest and lats without arching your lower back","Return in an arc to the start"],"g":"Ribs down and core tight through the whole arc.","b":"Do not arch your lower back to gain range."},"inclinepushup":{"name":"Incline Push-Up (hands elevated)","steps":["Hands on a bench, box or bar, body straight","Elbows about 45° from your torso","Lower your chest almost to the support","Push back up keeping your core tight"],"g":"The higher the support, the easier: a great entry point.","b":"Do not let your hips sag."},"feetelevpushup":{"name":"Feet-Elevated Push-Up","steps":["Feet on a bench, hands on the floor slightly wider than shoulders","Straight body from head to heels, abs tight","Lower your chest close to the floor","Push back up without arching your lower back"],"g":"Higher feet = more upper chest and shoulder.","b":"Do not let your lower back sag."},"diamondpushup":{"name":"Diamond Push-Up (triceps focus)","steps":["Hands together under your chest, thumbs and index fingers forming a diamond","Body straight, elbows close to your ribs","Lower until your chest almost touches your hands","Push back up fully extending the elbows"],"g":"Elbows tucked in focus the effort on the triceps.","b":"Do not flare your elbows: it loses focus and stresses the shoulder."},"chestdips":{"name":"Chest Dips","steps":["Support yourself on the parallel bars, arms straight","Lean your torso slightly forward and bend your knees","Lower with elbows wide until you feel the chest stretch","Press back up without locking the elbows"],"g":"Leaning forward shifts the work to the chest.","b":"Do not go deeper than your shoulder tolerates."},"declinedb":{"name":"Decline Dumbbell Bench Press","steps":["Lie on a decline bench with dumbbells at chest level","Press the dumbbells up extending your arms","Lower slowly to the lower chest line","Keep your shoulder blades pinned to the bench"],"g":"Emphasizes the lower chest with controlled load.","b":"Do not let the dumbbells wobble."},"lowcablefly":{"name":"Low Cable Crossover (upper chest)","steps":["Cables at the low position, one step forward and torso slightly leaning","Pull the cables in an arc from low to chest height","Squeeze the chest at the top for 1s","Return under control feeling the stretch"],"g":"Elbows slightly bent and fixed.","b":"Do not use body momentum to lift."},"invertedrow":{"name":"Inverted Row (low bar)","steps":["Lie under a low bar (hip height) with hands shoulder-width","Body straight, heels on the floor, arms extended","Pull your chest toward the bar squeezing your shoulder blades","Lower slowly until arms are straight"],"g":"The more horizontal your body, the harder it gets.","b":"Do not let your hips sag while pulling."},"dbbentrow":{"name":"Bent-Over Dumbbell Row","steps":["Stand with knees slightly bent and torso hinged, spine neutral","Dumbbells hanging under your shoulders","Pull the dumbbells toward your hips squeezing the shoulder blades","Lower with control until arms are straight"],"g":"Open chest and neck aligned with the spine.","b":"Do not round your back or use momentum."},"reverserow":{"name":"Reverse-Grip Barbell Row","steps":["Hold the bar underhand (palms up) shoulder-width","Hinge your torso with a neutral spine and slightly bent knees","Pull the bar toward your navel keeping elbows close","Lower under control until arms are straight"],"g":"The underhand grip recruits more biceps and lower lats.","b":"Do not stand up as you pull."},"cablerow1":{"name":"Single-Arm Cable Row","steps":["Sit facing a low cable, feet braced and spine neutral","Hold the handle with one hand","Pull toward your hip squeezing the shoulder blade","Return slowly and switch sides after the set"],"g":"Let the shoulder stretch on the way back, without rounding the back.","b":"Do not twist your torso to pull more load."},"assistedpullup":{"name":"Band-Assisted Pull-Up","steps":["Attach a band to the bar and rest a foot or knee in it","Overhand grip, slightly wider than shoulders","Pull your chest toward the bar with elbows driving down","Lower under control until arms are straight"],"g":"The band helps most at the bottom: use less assistance over time.","b":"Do not kick your legs for momentum."},"bandlateral":{"name":"Band Lateral Raise","steps":["Stand on the band with both feet and hold the ends at your sides","Raise your arms sideways to shoulder height","Elbows slightly bent and wrists aligned","Lower slowly keeping band tension"],"g":"Raise up to shoulder line, not beyond.","b":"Do not swing your torso to lift."},"bandrevfly":{"name":"Band Pull-Apart (reverse fly)","steps":["Hold the band in front of your chest with straight arms","Pull apart squeezing your shoulder blades together","Hold 1s with the band at chest level","Return slowly keeping tension"],"g":"Great for the posture of people who sit all day.","b":"Do not shrug your shoulders."},"cablerevfly":{"name":"Cable Reverse Fly","steps":["Cables at shoulder height, hold the opposite handles crossed","Arms almost straight in front of your body","Open your arms back to shoulder line","Return under control keeping tension"],"g":"Elbows slightly bent and fixed.","b":"Do not pull with your back: the rear delts do the work."},"seateddblat":{"name":"Seated Lateral Raise","steps":["Sit on an upright bench with dumbbells at your sides","Raise your arms sideways to shoulder height","Pause briefly at the top","Lower slowly without swinging"],"g":"Sitting removes body momentum and isolates the side delts.","b":"Do not raise above shoulder line."},"dbpressstand":{"name":"Standing Dumbbell Shoulder Press","steps":["Stand with dumbbells at shoulder height and core tight","Press overhead until your arms are straight","Finish with dumbbells slightly in front of your ears","Lower under control to your shoulders"],"g":"Squeeze glutes and abs to avoid arching your lower back.","b":"Do not lean back."},"cablefrontraise":{"name":"Cable Front Raise","steps":["Face away from a low cable, hold the handle between your legs","Raise your arm in front to shoulder height","Pause briefly at the top","Lower under control"],"g":"Torso still and firm.","b":"Do not use torso momentum."},"zottman":{"name":"Zottman Curl","steps":["Stand with dumbbells at your sides, palms up","Curl up as in a normal curl","At the top, rotate palms to face down","Lower slowly palms down and rotate back at the bottom"],"g":"The slow lowering works forearms and brachialis.","b":"Do not swing your body."},"inclinecurl":{"name":"Incline Dumbbell Curl","steps":["Sit on an incline bench (45–60°) with arms hanging behind your torso","Palms up","Curl the dumbbells without moving your elbows","Lower slowly until the biceps is fully stretched"],"g":"Stretched biceps on the way down = more stimulus.","b":"Do not let your elbows drift forward."},"ezcurl":{"name":"EZ-Bar Curl","steps":["Stand gripping the angled parts of the EZ bar, elbows at your sides","Curl the bar contracting the biceps","Pause briefly at the top","Lower under control until arms are straight"],"g":"The EZ bar is easier on the wrists than a straight bar.","b":"Do not swing your back to lift."},"reversecurl":{"name":"Reverse Curl","steps":["Stand with an overhand grip (palms down) shoulder-width","Elbows at your sides","Curl the bar without moving the elbows","Lower slowly under control"],"g":"Works forearms and brachialis: great for grip.","b":"Do not let your wrists bend."},"dbkickback":{"name":"Dumbbell Triceps Kickback","steps":["Hinge forward with a neutral spine and elbow tucked to your side","Arm bent at 90° holding the dumbbell","Extend the elbow taking the dumbbell back","Return under control without moving the upper arm"],"g":"Only the forearm moves: elbow stays still.","b":"Do not swing your torso."},"dbtriext":{"name":"Standing Overhead Dumbbell Triceps Extension","steps":["Stand holding one dumbbell with both hands overhead","Bend the elbows lowering the dumbbell behind your head","Keep your elbows pointing forward","Extend your arms back to the top"],"g":"Elbows tucked close to your head.","b":"Do not arch your lower back."},"pushdownbar":{"name":"Triceps Pushdown (straight bar)","steps":["Face a high cable, bar at chest height","Elbows tucked at your sides","Push the bar down until your arms are straight","Return slowly until forearms pass 90°"],"g":"Elbows fixed: only the forearm moves.","b":"Do not lean your body to push."},"cablehammer":{"name":"Cable Rope Hammer Curl","steps":["Face a low cable, rope in both hands with palms facing each other","Elbows tucked at your sides","Curl the rope contracting biceps and brachialis","Lower under control keeping tension"],"g":"The cable keeps tension constant, even at the bottom.","b":"Do not let your elbows travel back."},"bwsquat":{"name":"Bodyweight Squat","steps":["Feet shoulder-width, toes slightly out","Arms forward for balance and chest up","Sit your hips back and down until thighs are parallel","Drive through the floor and return to standing"],"g":"Knees track over your toes.","b":"Do not let your knees cave in."},"dbsquat":{"name":"Dumbbell Squat","steps":["Stand with a dumbbell in each hand at your sides","Chest up and eyes forward","Squat by sending hips back and down","Stand up pushing through the middle of your foot"],"g":"Neutral spine and heels on the floor.","b":"Do not round your back on the way down."},"sumosquat":{"name":"Dumbbell Sumo Squat","steps":["Wide stance, toes pointed out, dumbbell between your legs","Torso upright","Lower bending knees and hips until thighs are parallel","Stand up squeezing glutes and inner thighs"],"g":"Knees follow the direction of your toes.","b":"Do not let your torso lean forward."},"jumpsquat":{"name":"Jump Squat","steps":["Squat position with feet shoulder-width","Squat to parallel and explode upward","Land softly with knees absorbing the impact","Reset into the next controlled squat"],"g":"A quiet landing protects your knees.","b":"Do not land with straight legs."},"splitsquat":{"name":"Dumbbell Split Squat","steps":["Take a long step forward, dumbbells at your sides, torso upright","Lower by bending both knees until the back knee almost touches the floor","Keep the front knee aligned with your foot","Push through the floor to rise without moving your feet"],"g":"Weight on the heel of your front leg.","b":"Do not let the front knee travel far past your toes."},"reverselunge":{"name":"Dumbbell Reverse Lunge","steps":["Stand with dumbbells at your sides","Take a long step backward","Lower until both knees reach about 90°","Drive through the front leg to return and alternate"],"g":"Friendlier to the knee than a forward lunge.","b":"Do not lean your torso forward."},"singlelegdl":{"name":"Single-Leg Romanian Deadlift","steps":["Stand with a kettlebell (or dumbbell) in the hand opposite your standing leg","Hinge forward and lift the other leg back like a seesaw","Keep your back straight and the standing knee slightly bent","Return squeezing glute and hamstring"],"g":"Hips and shoulders stay square, no twisting.","b":"Do not round your back to reach lower."},"lyinglegcurl":{"name":"Lying Leg Curl (machine)","steps":["Lie face down with the pad just above your heels","Hips firmly on the bench","Bend your knees bringing the pad toward your glutes","Return slowly without letting the stack slam"],"g":"Hips glued to the bench through the whole move.","b":"Do not lift your hips for momentum."},"ballegcurl":{"name":"Stability Ball Leg Curl","steps":["Lie on your back with heels on the ball and hips raised","Pull your heels in rolling the ball toward your glutes","Keep your hips high the whole time","Extend your legs slowly controlling the ball"],"g":"High hips = glutes and hamstrings stay active.","b":"Do not let your hips drop."},"barbelllunge":{"name":"Barbell Lunge","steps":["Barbell on your shoulders, feet hip-width","Step forward and lower with control","Back knee almost touching the floor","Push off the floor and return to the start"],"g":"Upright torso and tight core.","b":"Do not let the front knee cave in."},"singlelegbridge":{"name":"Single-Leg Glute Bridge","steps":["Lie on your back with one foot planted and the other leg extended","Lift your hips squeezing the glute of the planted leg","Keep your hips level at the top","Lower slowly without fully resting on the floor"],"g":"Drive through the heel of the planted foot.","b":"Do not let your hips rotate."},"barbellbridge":{"name":"Barbell Glute Bridge","steps":["Lie down with a padded barbell over your hips and knees bent","Feet planted hip-width","Lift your hips until your body forms a straight line","Squeeze your glutes at the top and lower under control"],"g":"Chin slightly tucked and ribs down.","b":"Do not hyperextend your lower back at the top."},"monsterwalk":{"name":"Monster Walk (band)","steps":["Mini band above your knees, feet hip-width, knees slightly bent","Take lateral steps keeping tension on the band","Do not let your knees collapse inward","Switch direction at the end of the set"],"g":"Short steps and constant band tension.","b":"Do not lean your torso sideways."},"sumodeadlift":{"name":"Sumo Deadlift","steps":["Wide stance with toes out and a narrow grip inside your legs","Hips low, chest up, bar against your shins","Drive the floor away extending knees and hips together","Lower under control keeping the bar close"],"g":"Knees follow the direction of your feet.","b":"Do not round your spine when breaking the bar off the floor."},"cablepullthrough":{"name":"Cable Pull-Through","steps":["Face away from a low cable, rope between your legs","Hinge your hips back with knees slightly bent","Feel your hamstrings stretch","Drive your hips forward squeezing your glutes"],"g":"A hip hinge with a neutral spine.","b":"Do not squat: it is a hip movement, not a knee movement."},"donkeycalf":{"name":"Donkey Calf Raise","steps":["Lean forward with hands on a bench and toes on a step","Knees straight","Rise as high as you can on your toes","Lower stretching the calves fully"],"g":"1s pause at the top and a full stretch at the bottom.","b":"Do not bend your knees to cheat."},"turkishgetup":{"name":"Kettlebell Turkish Get-Up","steps":["Lie down with a kettlebell in one hand, arm straight up, eyes on it","Roll and prop up on your elbow, then your hand, hips lifted","Sweep the leg under and kneel, then stand up","Reverse the movement under control back to the floor"],"g":"Eyes on the kettlebell at all times and arm locked.","b":"Start with no weight until you master the sequence."},"kbthruster":{"name":"Kettlebell Thruster","steps":["Kettlebell at shoulder height, feet shoulder-width","Squat keeping your torso upright","Drive up explosively and press the weight overhead","Bring it back to your shoulders and repeat"],"g":"Use leg power to drive the weight up.","b":"Do not arch your lower back in the press."},"inchworm":{"name":"Inchworm","steps":["Stand, hinge forward and place your hands on the floor","Walk your hands out to a plank position","Pause, then walk your feet back toward your hands","Stand up and repeat"],"g":"Nearly straight legs stretch the hamstrings.","b":"Do not let your hips sag in the plank."},"standinglongjump":{"name":"Standing Broad Jump","steps":["Feet shoulder-width with arms swung back","Dip quickly and jump forward driving your arms","Land softly with knees bent","Stop, stabilize and repeat"],"g":"Stable landing before the next jump.","b":"Do not land with straight legs."},"bandrotext":{"name":"Band External Rotation","steps":["Anchor the band at elbow height and stand sideways to it","Elbow tucked to your side, bent 90°, hand near your belly","Rotate your forearm outward, moving the hand away from your body","Return slowly keeping the elbow still"],"g":"Place a folded Do not rotate your hips to gain range."},"bandupright":{"name":"Band Upright Row","steps":["Stand on the band and hold the ends in front of your thighs","Elbows above hands","Pull up to chest height, elbows higher than wrists","Lower slowly keeping tension"],"g":"Pull up to chest height, not much higher: protects the shoulder.","b":"Do not shrug toward your ears."},"wristroller":{"name":"Wrist Roller","steps":["Hold the bar with arms extended in front, at shoulder height","Roll up the rope by turning your wrists until the weight rises","Stop at the top and unroll slowly, controlling the descent","Keep your arms still, only the wrists turn"],"g":"Light load: the forearms fatigue very fast.","b":"Do not let your shoulders rise or your arms drop."},"bwlunge":{"name":"Bodyweight Lunge","steps":["Stand with hands on hips and torso upright","Take a long step forward","Lower until both knees reach about 90°","Push off the floor to return and alternate legs"],"g":"Long enough step so the front knee stays over the foot.","b":"Do not let the front knee cave in."},"bicyclecrunch":{"name":"Bicycle Crunch","steps":["Lie down with your lower back pressed into the floor, hands lightly beside your head","Lift your shoulders off the floor and bring your knees above your hips","Extend one leg while the opposite elbow travels toward the bent knee","Alternate sides at a controlled pace without pulling on your neck"],"g":"Rotate the torso, not just the elbow: the obliques do the work.","b":"Do not yank your head with your hands or let your lower back lift off the floor."},"heeltouch":{"name":"Alternating Heel Touch","steps":["Lie down with knees bent and feet flat, hip-width apart","Arms by your sides, palms on the floor","Crunch sideways until your hand touches the heel on that side","Return to center and repeat to the other side"],"g":"Short, sideways movement: think of shortening the side of your waist.","b":"Do not twist your hips or drag your feet."},"cablerussian":{"name":"Cable Russian Twist","steps":["Cable at chest height, stand side-on to the tower holding the handle with both hands","Arms extended in front of your chest, hips and feet planted","Rotate your torso away from the stack, arms moving with your chest","Return slowly, resisting the pull of the cable"],"g":"The cable keeps tension the whole time: control the return as much as the rotation.","b":"Do not rotate with your arms alone; the movement comes from the torso."},"cableseatedcrunch":{"name":"Seated Cable Crunch","steps":["Sit facing away from a high cable, rope held at your shoulders","Let the weight extend your spine slightly, hips stationary","Flex at the waist, bringing your elbows toward your hips","Return slowly to the start"],"g":"Load is easy to progress, like a bench press: add weight gradually.","b":"Do not pull with your arms or lift your hips off the bench."},"legsballcrunch":{"name":"Legs-Elevated Crunch","steps":["Lie down with your calves resting on a bench or ball, knees at 90°","Hands lightly beside your head, elbows wide","Press your lower back into the floor and curl up","Lower without fully relaxing your abs"],"g":"Elevated legs take the hip flexors out so your abs do the job.","b":"Do not pull on your neck; keep your gaze on the ceiling."},"declineoblique":{"name":"Decline Oblique Crunch","steps":["Lie on a decline bench with your feet secured","One hand beside your head, the other on your thigh","Curl up while rotating until your elbow points toward the opposite knee","Lower slowly and switch sides each set"],"g":"The incline increases the load from your own bodyweight.","b":"Do not use momentum or pull on your neck."},"declinereverse":{"name":"Decline Reverse Crunch","steps":["Lie on a decline bench holding the top with both hands","Legs extended, knees slightly bent and together","Bring your knees toward your chest, curling the pelvis","Extend back slowly without letting your body slide"],"g":"Curl your hips up a few centimeters each rep: that is what ur lower back"],"g":"Go only as far as you can control your lower back. Extend your reach week by week.","b":"Do not let the hips drop or the lower back sag."},"cablesidebend":{"name":"Cable Side Bend","steps":["High pulley, stand side-on, near hand holding the handle at your shoulder","Feet hip-width, free hand on your waist","Bend sideways away from the stack, contracting the oblique","Return slowly keeping the arm still"],"g":"Keep your arm still: the side of your waist does the pulling.","b":"Do not lean forward or swing."},"seatedlegtuck":{"name":"Seated Leg Tuck","steps":["Sit at the end of a bench, hands gripping the sides","Lean back about 45° with your legs extended","Bring knees and torso toward each other at the same time","Extend back slowly without touching your feet to the floor"],"g":"Breathe out as you fold: it helps you contract the abs harder.","b":"Do not let your feet drop at the end of each rep."},"spidercrawl":{"name":"Spider Crawl","steps":["Start in a push-up position, body straight, arms bent to 90°","Lift one foot and drive that knee toward the same-side elbow","Return the foot to the floor and repeat with the other leg","Keep your hips low throughout"],"g":"The slower you go, the harder your core has to work.","b":"Do not let your hips pike or your chest sag."},"toetouchers":{"name":"Toe Touch Crunch","steps":["Lie down with your legs raised almost perpendicular to the floor","Arms extended above your chest toward your feet","Curl up trying to touch your toes","Lower slowly without dropping your back all at once"],"g":"Keep your legs still; only the torso moves.","b":"Do not use arm momentum."},"cocoon":{"name":"Cocoon Crunch","steps":["Lie down with legs straight and arms extended behind your head","Tuck knees and torso together, rolling the pelvis up","Arms sweep over your head as you fold","Extend everything back out slowly"],"g":"Think about bringing ribs and pelvis closer together.","b":"Do not rock for momentum."},"suspendedfallout": y","Return, bringing your chin toward your chest without forcing"],"g":"Short, controlled movement; light weight.","b":"Do not bounce your head or let go of the plate."},"dbextrot":{"name":"Dumbbell External Rotation","steps":["Lie on your side on a bench, elbow bent 90° against your body","Hold a light dumbbell in the top hand, forearm pointing forward","Rotate the forearm upward, elbow pinned to your waist","Lower slowly back to the start"],"g":"Use very light weights: the rotator cuff is small and easy to injure.","b":"Do not let your elbow drift from your body."},"smithsquat":{"name":"Smith Machine Squat","steps":["Set the bar at shoulder height on your upper back, feet slightly in front of the bar","Unrack and descend with an upright torso until thighs are parallel","Drive through your heels to stand","Rack the bar at the end"],"g":"Feet slightly forward protect your knees on this rail.","b":"Do not let your knees cave in."},"starjump":{"name":"Star Jump","steps":["Stand with feet shoulder-width and arms by your sides","Dip into a quarter squat and jump as high as you can","In the air, spread arms and legs into a star","Land softly with bent knees and reset"],"g":"Land on the balls of your feet and let your knees cushion.","b":"Do not land with straight legs."},"splitjump":{"name":"Split Jump","steps":["Start in a lunge, rear knee close to the floor","Jump as high as you can, swinging your arms","Switch legs in mid-air","Land in a lunge with the other foot forward"],"g":"Keep your torso upright and the front knee in line with your foot.","b":"Do not let the front knee drift far past your toes."},"kneetuckjump":{"name":"Tuck Jump","steps":["Stand with knees slightly bent, hands in front of your chest","Dip quickly and explode upward","Drive your knees to your hands at the peak","Land softly and go again right away"],"g":"The less time you spend on the floor between jumps, the better.","b":"Skip it when fatigued: landing control drops."},"plyopushup":{"name":"Plyometric Push-Up","steps":["Start in a push-up position, hands shoulder-width","Lower your chest with control","Push explosively enough for your hands to leave the floor","Land with soft elbows and repeat"],"g":"Only try it once you can do 15 clean push-ups.","b":"Do not let your hips sag."},"benchjump":{"name":"Bench Jump","steps":["Stand beside a low bench, feet shoulder-width","Dip slightly and jump over it, using your arms","Land on the other side with bent knees","Jump back and repeat"],"g":"Start with a low bench and raise it only when you land quietly.","b":"Do not use an unstable bench or jump when tired."},"fastskipping":{"name":"Fast Skipping (High Knees)","steps":["Stand tall with one foot slightly forward","Do quick alternating hops, driving your knees up","Arms swing opposite to the legs","Keep ground contact short and the pace high"],"g":"Think of the floor as hot coals.","b":"Do not lean back."},"lateralbound":{"name":"Lateral Bound","steps":["Half squat, facing sideways to your direction of travel","Push off the outside leg and bound sideways as far as you can","Land on one foot and stabilize","Bound back to the other side"],"g":"Stabilize for a second on landing before the next bound.","b":"Do not let your knee cave inward."},"rocketjump":{"name":"Rocket Jump","steps":["Feet shoulder-width, arms by your sides","Drop into a half squat","Jump as high as possible, arms overhead","Land absorbing with your legs and repeat"],"g":"Fully extend from feet to hands in the air.","b":"Do not land with locked knees."},"sledgehammer":{"name":"Sledgehammer Tire Strike","steps":["Face a tire in a staggered stance","Back hand at the end of the handle, front hand near the head","Raise the sledgehammer overhead and strike the tire","Switch sides every set"],"g":"Power comes from the hips and core, not just your arms.","b":"Do not swing without controlling your range."},"dbvertswing":{"name":"Dumbbell Swing","steps":["Hold a dumbbell with both hands between your legs, s /* why genéricos por papel na ordem */
function whyFor(ex,idx,dayHasComp){
  if(LANG==='en'){
    if(ex.cat==='cardio')return 'Closes the workout with extra burn without stealing energy from the lifting (short and deliberately last).';
    if(ex.cat==='lomb')return "The lower back stabilizes everything. If it got tired before the heavy lifts, your form would fall apart: stabilizers always go last.";
    if(ex.cat==='core')return "Core at the end on purpose: tiring the stabilizer before the heavy lifts would compromise your form.";
    if(ex.cat==='calf')return "Doesn't interfere with any other exercise, so it goes last. Responds better to high reps and full range.";
    if(ex.cat==='comp')return idx===0?"Biggest compound of the day: goes first because you're fresh, so you can move more weight with clean form, and that's where the main stimulus comes from.":'Compound: uses the strength you have left before moving to isolations.';
    return 'Isolation for the '+musLabel(ex.mus).toLowerCase()+': rounds out the day with full focus, without needing tired supporting muscles.';
  }
  if(ex.cat==='cardio')return 'Fecha o treino com gasto extra sem roubar energia da musculação (curto e por último de propósito).';
  if(ex.cat==='lomb')return 'A lombar estabiliza tudo. Se cansasse antes dos pesados, sua forma iria embora: estabilizador é sempre o último.';
  if(ex.cat==='core')return 'Core no fim de propósito: cansar o estabilizador antes dos exercícios pesados comprometeria sua execução.';
  if(ex.cat==='calf')return 'Não interfere em nenhum outro exercício, então vai pro fim. Responde melhor a repetições altas e amplitude total.';
  if(ex.cat==='comp')return idx===0?'Maior composto do dia: vem primeiro porque com você descansado dá pra mover mais carga com forma limpa, e é daqui que sai o principal estímulo.':'Composto: aproveita a força que ainda resta antes de partir pros isolados.';
  return 'Isolado de '+ex.mus.toLowerCase()+': completa o estímulo do dia com foco total, sem exigir dos músculos auxiliares já cansados.';
}

/* cada exercício da biblioteca ganha as alternativas atuais (equipamento diferente / peso do corpo) */
function migrateProgramLib(){
  if(!PROGRAM)return;
  let changed=false;
  Object.keys(PROGRAM).forEach(k=>{
    const day=PROGRAM[k];if(!day||!day.ex)return;
    day.ex.forEach(ex=>{
      const m=E[ex.id];if(!m||m.custom||ex.id==='finisher')return;
      const want=(m.alts||[]).filter(a=>E[a]&&a!==ex.id).slice();
      const vid=VARIANT[ex.id];
      if(vid&&vid!==ex.id&&E[vid]&&want.indexOf(vid)<0)want.push(vid);
      const have=(ex.alts||[]).map(a=>a.id).join(',');
      if(have!==want.join(',')){ex.alts=want.map(altItem);changed=true}
    });
  });
  if(changed)save('iron_program',PROGRAM);
}

function roleWhy(day,i){
  const ex=day.ex[i],lib=E[ex.id],meta=Object.assign({},day.meta||{});
  if(meta.kind==='tpl')meta.kind=meta.tplKind;
  if(meta.kind==='cardio')return lib&&lib.cat==='cardio'?(LANG==='en'?'Base of the cardio workout: sustained calorie burn and conditioning.':'Base do treino de cardio: gasto calórico sustentado e condicionamento.'):(LANG==='en'?'Core stability to support your posture during the cardio.':'Estabilidade central pra sustentar a postura durante o cardio.');
  if(meta.kind==='functional')return LANG==='en'?'Functional movement: trains the body as one unit, mirroring everyday patterns.':'Movimento funcional: treina o corpo como uma unidade, replicando padrões do dia a dia.';
  if(ex.ss)return LANG==='en'?'Circuit station: alternates with the next exercise with no rest, keeping your heart rate up to maximize the burn.':'Estação de circuito: intercala com o próximo exercício sem descanso, mantendo a frequência cardíaca elevada pra maximizar a queima.';

}

 treadmillv:9,runningv:10,ellipticalv:6,stairsv:9,rowerv:7,finisher:7,swimmingv:8,

function parseRepsSeconds(reps){
  if(!reps)return {kind:'reps',avg:10};
  const r=String(reps).toLowerCase();
  if(r.indexOf('min')>=0){
    const nums=(r.match(/\d+/g)||['5']).map(Number);
    const avg=nums.length>1?(nums[0]+nums[1])/2:nums[0];
    return {kind:'time',seconds:avg*60};
  }
  if(r.indexOf('s')>=0&&r.indexOf('sess')<0){
    const nums=(r.match(/\d+/g)||['30']).map(Number);
    const avg=nums.length>1?(nums[0]+nums[1])/2:nums[0];
    return {kind:'time',seconds:avg};
  }
  const nums=r.match(/\d+/g);
  if(nums){const ns=nums.map(Number);const avg=ns.length>1?(ns[0]+ns[1])/2:ns[0];return {kind:'reps',avg}}
  return {kind:'reps',avg:10};
}
function bodyKg(){return (SETUP&&SETUP.bodyKg)||75}
function estimateKcalForItem(ex,a,doneCount,trackedVal){
  if(!doneCount&&!((a.unit==='m'||a.unit==='min')&&trackedVal>0))return 0;
  const met=MET_OVERRIDE[a.vid]!=null?MET_OVERRIDE[a.vid]:(MET_BY_CAT[ex.cat]||4);
  let seconds;
  if(a.unit==='m'){seconds=((trackedVal||0)/36.7)*60}
  else if(a.unit==='min'){seconds=(trackedVal||0)*60}
  else{
    const info=parseRepsSeconds(a.reps);
    const perSet=info.kind==='time'?info.seconds:(info.avg*3);
    seconds=doneCount*perSet+Math.max(0,doneCount-1)*(a.rest||0);
  }
  return met*bodyKg()*(seconds/3600);
}
function estimateKcalForHistItem(it){
  const meta=E[it.id];if(!meta)return 0;
  const met=MET_OVERRIDE[it.id]!=null?MET_OVERRIDE[it.id]:(MET_BY_CAT[meta.cat]||4);
  let seconds;
  if(meta.unit==='m'){
    const vals=(it.sw||[]).filter(v=>v!=null);
    const m=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:(it.w||0);
    seconds=(m/36.7)*60;
  }else if(meta.unit==='min'){
    const vals=(it.sw||[]).filter(v=>v!=null);
    const mins=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:(it.w||0);
    seconds=mins*60;
  }else{
    const info=parseRepsSeconds(meta.reps);
    const perSet=info.kind==='time'?info.seconds:(info.avg*3);
    const doneCount=it.s||0;
    seconds=doneCount*perSet+Math.max(0,doneCount-1)*(meta.rest||0);
  }
  return met*bodyKg()*(seconds/3600);
}
function recomputeKcal(h){
  if(!h.items||!h.items.length)return h.kcal||0;
  return Math.round(h.items.reduce((s,it)=>s+estimateKcalForHistItem(it),0));
}
function kcalOf(h){return h.kcal!=null?h.kcal:recomputeKcal(h)}

function buildDay(pool,n,prio){
  const noPrio=Object.keys(GRP_LABEL).filter(g=>!prio.includes(g));
  let items=pool.map(id=>({id,...E[id]}));
  // remove isolados de grupos desmarcados (mantém compostos pra base)
  let removed=items.filter(x=>x.cat!=='comp'&&noPrio.includes(x.grp)&&prio.length>0&&prio.length<8);
  items=items.filter(x=>!removed.includes(x));
  // ordena: comp > iso(prioritário) > iso > calf > core/lomb
  const rank=x=>x.cat==='comp'?0:(x.cat==='iso'?(prio.includes(x.grp)?1:2):(x.cat==='calf'?3:4));
  items.sort((a,b)=>rank(a)-rank(b));
  if(items.length<n)items=items.concat(removed); // repõe se faltar
  const coresArr=items.filter(x=>['core','lomb'].includes(x.cat));
  const restArr=items.filter(x=>!['core','lomb'].includes(x.cat));
  let sel;
  if(coresArr.length&&n>=4){sel=restArr.slice(0,n-1);sel.push(coresArr[0])}
  else{sel=items.slice(0,n)}
  // se dia tem muitos exercícios, compostos extras caem pra 3 séries
  sel=sel.map((x,i)=>{
    let sets=x.sets;
    if(n>=7&&x.cat==='comp'&&i>0)sets=3;
    return {...x,sets};
  });
  // superset abdutora+adutora se ambos presentes: aproxima e marca
  const ia=sel.findIndex(x=>x.id==='abductor'),ib=sel.findIndex(x=>x.id==='adductor');
  if(ia>=0&&ib>=0){
    const [add]=sel.splice(ib,1);
    sel.splice(sel.findIndex(x=>x.id==='abductor')+1,0,add);
    sel=sel.map(x=>x.id==='abductor'?{...x,ss:'A',rest:0}:x.id==='adductor'?{...x,ss:'A'}:x);
  }
  return sel;
}

/* ---- escolha do exercício dentro de cada vaga ---- */
const _slotCache={};
function parseSlot(s){
  if(_slotCache[s])return _slotCache[s];
  const tk=s.trim().split(/\s+/),o={ids:tk[0].split('/')};
  tk.slice(1).forEach(t=>{let m;
    if(m=/^(\d+)x([\d\-–]+)(s|min)?$/.exec(t)){o.sets=+m[1];o.reps=m[2].replace('-','–')+(m[3]==='s'?'s':m[3]==='min'?' min':'')}
    else if(m=/^r(\d+)$/.exec(t))o.rest=+m[1];
    else if(m=/^&(\w)$/.exec(t))o.ss=m[1];
    else if(t==='c')o.core=true});
  return _slotCache[s]=o;
}
const STYLE_EQ={home:['dumbbell','kettlebell','band','body','bench','plate','ball','bar'],body:['body','band','bench','bar']};
const STYLE_OK=['jumpropev','abwheel','benchjump','wristroller'];
function styleOK(id,st){const f=STYLE_EQ[st];if(!f)return true;return STYLE_OK.indexOf(id)>=0||f.indexOf(eqKey(id))>=0}
const _byPref=(list,pref)=>list.map((id,i)=>[id,i]).sort((a,b)=>((pref.indexOf(eqKey(b[0]))>=0)-(pref.indexOf(eqKey(a[0]))>=0))||(a[1]-b[1])).map(x=>x[0]);
function pickCand(cands,pos,setup,used){
  const st=setup.style||'mix';
  let list=cands.filter(id=>E[id]&&styleOK(id,st)&&!used.has(id));
  if(!list.length){
    /* todos os candidatos foram usados ou não servem ao estilo: tenta as alternativas deles (peso livre / peso do corpo) */
    cands.forEach(c=>{const f=E[c];((f&&f.alts)||[]).forEach(a=>{if(E[a]&&styleOK(a,st)&&!used.has(a)&&list.indexOf(a)<0)list.push(a)})});
    list=list.slice(0,3);
    if(!list.length)return null;
  }
  if(st==='mach')list=_byPref(list,['machine','cable']);
  else if(st==='free')list=_byPref(list,['dumbbell','barbell','kettlebell','plate','body','bar']);
  const cp=setup.cardioPrefs||[];
  if(cp.length)list=list.map((id,i)=>[id,i]).sort((a,b)=>((cp.indexOf(b[0])>=0)-(cp.indexOf(a[0])>=0))||(a[1]-b[1])).map(x=>x[0]);
  const seed=setup.vseed||0;
  return list[seed>0?(seed+pos)%list.length:0];
}
/* quando o treino tem mais vagas do que exercícios por dia: tira primeiro os isolados de grupos repetidos (mantém o 1º exercício e o core) */
function trimDay(items,n){
  const out=items.slice();
  while(out.length>n){
    const cnt={};out.forEach(s=>{const g=E[s.id].grp;cnt[g]=(cnt[g]||0)+1});
    let best=-1,bs=-1;
    out.forEach((s,i)=>{if(i===0||s.o.core)return;
      const sc=cnt[E[s.id].grp]*100+(E[s.id].cat==='comp'?0:10)+i*.1;
      if(sc>bs){bs=sc;best=i}});
    if(best<0)break;
    out.splice(best,1);
  }
  return out.length>n?out.slice(0,n):out;
}
const VIS_GRP=['chest','back','shoulders','arms','legs','glutes','core','calf'];
const FILL_BODY=['bwsquat','pushupv','bridgev','plankv','bwlunge','mountainclimberv','supermanv','deadbug','invertedrow','bicyclecrunch'];
function buildTplDay(day,setup,gdef,tpl){
  const prio=setup.groups||[],used=new Set(),sel=[];
  day.x.map(parseSlot).forEach((o,pos)=>{const id=pickCand(o.ids,pos,setup,used);if(id){used.add(id);sel.push({o,id})}});
  const chosen=VIS_GRP.filter(g=>prio.indexOf(g)>=0);
  let items=sel;
  if(chosen.length>0&&chosen.length<VIS_GRP.length)items=sel.filter(s=>!(E[s.id].cat==='iso'&&VIS_GRP.indexOf(E[s.id].grp)>=0&&chosen.indexOf(E[s.id].grp)<0));
  const n=setup.perDay,minN=Math.min(4,n);
  if(items.length<minN)items=sel;
  let out=trimDay(items,n);
  /* estilos sem equipamento podem esvaziar vagas: completa com movimentos de peso do corpo */
  if(out.length<minN){
    FILL_BODY.forEach(id=>{if(out.length<minN&&E[id]&&!used.has(id)&&styleOK(id,setup.style||'mix')){used.add(id);out=out.concat([{o:{},id}])}});
  }
  const ex=!tpl.ign;
  let res=out.map(s=>{const x=E[s.id],it={id:s.id,...x};
    if(ex&&s.o.sets)it.sets=s.o.sets;
    if(ex&&s.o.reps)it.reps=s.o.reps;else if(x.cat==='comp')it.reps=gdef.repsComp;else if(x.cat==='iso')it.reps=gdef.repsIso;
    if(ex&&s.o.rest!=null)it.rest=s.o.rest;else if(x.cat==='comp')it.rest=gdef.restComp;else if(x.cat==='iso')it.rest=gdef.restIso;
    it._ss=ex?s.o.ss:null;return it});
  const tags={};res.forEach((it,i)=>{if(it._ss)(tags[it._ss]=tags[it._ss]||[]).push(i)});

function buildDayIntro(meta){
  if(!meta)return '';
  if(meta.quick)return qkIntro(meta);

    const tp=tplById(meta.tpl),en=LANG==='en',note=(GOAL_NOTE[meta.goal]||GOAL_NOTE.geral)[en?1:0];
    const nm=tp?tName(tp):trSplitName(meta.spName);
    return en?`${nm} · ${meta.freq}x per week · ${goalLabel(meta.goal)}. ${note}`:`${nm} · ${meta.freq}x por semana · ${goalLabel(meta.goal)}. ${note}`;
  }
  const gl=goalLabel(meta.goal).toLowerCase();
  const spN=trSplitName(meta.spName);
  if(meta.kind==='cardio')return LANG==='en'?
    `${goalLabel('cardio')} · ${meta.freq}x per week. Cardio machines alternated with core stability to hold posture and burn more.`:
    `${goalLabel('cardio')} · ${meta.freq}x por semana. Máquinas de cardio alternadas com estabilidade central pra sustentar postura e queimar mais.`;
  if(meta.kind==='functional')return LANG==='en'?
    `${goalLabel('funcional')} · ${meta.freq}x per week. Kettlebell, sled, TRX, ropes and moves like burpees, always in pairs with no rest between them: more calorie burn in the same time.`:
    `${goalLabel('funcional')} · ${meta.freq}x por semana. Kettlebell, trenó, TRX, cordas e movimentos como burpee, sempre em duplas sem descanso entre elas: mais gasto calórico no mesmo tempo.`;
  if(meta.circuitPairs)return LANG==='en'?

    `${spN} · ${meta.freq}x por semana · circuito de ${meta.goal==='circuito'?'queima':gl}. Exercícios alternados em duplas, sem descanso entre eles: mais gasto calórico no mesmo tempo.`;

function buildDayLabel(meta,fallback){

function buildDaySub(meta,fallback){
  if(!meta)return fallback;
  if(meta.quick)return qkSub(meta);

function generateProgram(setup){
  let tpl=setup.tpl&&tplById(setup.tpl);
  if(!tpl&&setup.goal==='hiit')tpl=tplPick(setup.goal||'hipertrofia',setup.splits||3);
  return tpl?generateFromTpl(setup,tpl):generateProgramLegacy(setup);
}
function generateProgramLegacy(setup){
  const goal=setup.goal||'hipertrofia';
  const gdef=GOALS[goal]||GOALS.hipertrofia;
  let days,spName;
  if(gdef.cardioFocus){
    days=Array.from({length:setup.splits},(_,i)=>({cardio:true,idx:i}));
    spName=GOALS.cardio.label;
  }else if(gdef.functionalFocus){
    days=Array.from({length:setup.splits},(_,i)=>({functional:true,idx:i}));
    spName=GOALS.funcional.label;
  }else{
    const sp=SPLITS[setup.splits];spName=sp.name;
    days=sp.days.map(d=>({...d}));
    const fi=Math.max(0,days.findIndex(d=>d.label===setup.first));
    days=[...days.slice(fi),...days.slice(0,fi)];
  }
  const prog={};
  days.forEach((d,i)=>{
    const L=LETTERS[i];
    let sel=d.cardio?buildCardioDay(i,setup.perDay,setup.cardioPrefs):
             d.functional?buildFunctionalDay(i,setup.perDay):
             buildDay(d.pool,setup.perDay,setup.groups);
    // calibra reps/descanso conforme o objetivo escolhido
    sel=sel.map(x=>{
      if(x.cat==='comp')return {...x,reps:gdef.repsComp,rest:gdef.restComp};
      if(x.cat==='iso')return {...x,reps:gdef.repsIso,rest:gdef.restIso};
      return x;
    });
    // circuito: intercala em duplas sem descanso entre elas (o "queima gordura" alternando dois aparelhos)
    if(gdef.circuitPairs&&!d.cardio)sel=pairAsCircuit(sel,gdef.restComp);
    const ex=sel.map((x,idx)=>({
      id:x.id,fig:x.fig,name:x.name,muscle:x.mus,w:x.w||0,bw:!!x.bw,unit:x.unit,
      sets:x.sets,reps:x.reps,rest:(x.ss==='A'&&x.id==='abductor')?0:x.rest,
      ss:x.ss,yt:x.yt,steps:x.steps,g:x.g,b:x.b,
      why:d.cardio?(x.cat==='cardio'?(LANG==='en'?'Base of the cardio workout: sustained calorie burn and conditioning.':'Base do treino de cardio: gasto calórico sustentado e condicionamento.'):(LANG==='en'?'Core stability to support your posture during the cardio.':'Estabilidade central pra sustentar a postura durante o cardio.')):
          d.functional?(LANG==='en'?'Functional movement: trains the body as one unit, mirroring everyday patterns.':'Movimento funcional: treina o corpo como uma unidade, replicando padrões do dia a dia.'):
          (x.ss?(LANG==='en'?'Circuit station: alternates with the next exercise with no rest, keeping your heart rate up to maximize the burn.':'Estação de circuito: intercala com o próximo exercício sem descanso, mantendo a frequência cardíaca elevada pra maximizar a queima.'):whyFor(x,idx,true)),
      alts:(x.alts||[]).map(aid=>({id:aid,fig:E[aid].fig,name:E[aid].name,w:E[aid].w,bw:!!E[aid].bw,unit:E[aid].unit,reps:E[aid].reps,yt:E[aid].yt,steps:E[aid].steps,g:E[aid].g,b:E[aid].b}))
    }));
    if(setup.finisher&&!d.cardio&&!d.functional&&(i===0||i===days.length-1)){
      const f=E.finisher;
      ex.push({id:'finisher',fig:f.fig,name:f.name,muscle:f.mus,w:0,bw:true,sets:1,reps:f.reps,rest:0,yt:f.yt,steps:f.steps,g:f.g,b:f.b,why:whyFor(f,99),
        alts:f.alts.map(aid=>({id:aid,fig:E[aid].fig,name:E[aid].name,bw:true,reps:E[aid].reps,yt:E[aid].yt,steps:E[aid].steps,g:E[aid].g,b:E[aid].b}))});
    }
    const meta={kind:d.cardio?'cardio':d.functional?'functional':'normal',freq:setup.freq,spName,
      goal:goal,letter:L,cardioName:sel[0]?sel[0].name:'Cardio',circuitPairs:!!gdef.circuitPairs};
    const label=buildDayLabel(meta,d.label);
    const sub=buildDaySub(meta,d.sub);
    const intro=buildDayIntro(meta);
    prog[L]={label,sub,intro,meta,ex};
  });
  return prog;
}
function setupName(S){
  const tp=S&&S.tpl&&tplById(S.tpl);

function weekPlan(setup){

  const keys=LETTERS.slice(0,tp?tp.n:setup.splits);

}

function migrateProgramUnits(){
  if(!PROGRAM)return;
  let changed=false;
  Object.keys(PROGRAM).forEach(k=>{
    const day=PROGRAM[k];if(!day||!day.ex)return;
    day.ex.forEach(ex=>{
      const meta=E[ex.id];
      if(meta&&meta.unit&&ex.unit!==meta.unit){
        ex.unit=meta.unit;ex.bw=!!meta.bw;
        if(!ex.w)ex.w=meta.w||0;
        if(WEIGHTS[ex.id]==null||WEIGHTS[ex.id]===0)WEIGHTS[ex.id]=meta.w||0;
        changed=true;
      }
      if(ex.alts)ex.alts.forEach(alt=>{
        const am=E[alt.id];
        if(am&&am.unit&&alt.unit!==am.unit){
          alt.unit=am.unit;alt.bw=!!am.bw;
          if(!alt.w)alt.w=am.w||0;
          changed=true;
        }
      });
    });
  });
  if(changed){save('iron_program',PROGRAM);save('iron_weights',WEIGHTS)}
}

function setsArr(baseId,n,key){

  let s=SESSION[k][baseId];

  else if(typeof s[0]!=='object'||s[0]===null){s=s.map(v=>({d:!!v,w:null}));SESSION[k][baseId]=s}

function sessionStats(key){
  const day=PROGRAM[key];if(!day)return {done:0,tot:0};
  const s=SESSION[key]||{};let done=0,tot=0;
  day.ex.forEach(ex=>{const a=activeOf(ex);tot+=a.sets;
    const arr=s[ex.id];
    if(Array.isArray(arr))arr.forEach(x=>{if(x&&typeof x==='object'?x.d:x)done++});
  });
  return {done,tot};
}

    }
  });
  return out;
}

let WAKELOCK=null;
async function syncWakeLock(){
  const want=view==='train';
  if(want&&!WAKELOCK){
    try{
      if('wakeLock' in navigator){
        WAKELOCK=await navigator.wakeLock.request('screen');
        WAKELOCK.addEventListener('release',()=>{WAKELOCK=null});
      }
    }catch(e){WAKELOCK=null}
  }else if(!want&&WAKELOCK){
    try{await WAKELOCK.release()}catch(e){}
    WAKELOCK=null;
  }
}

function relDate(iso){
  const d=new Date(iso+'T00:00'),h=new Date(todayISO()+'T00:00');
  const diff=Math.round((h-d)/864e5);
  if(diff===0)return t('hoje');
  if(diff===1)return t('ontem');
  if(diff>1&&diff<7)return (LANG==='en'?diff+' days ago':'há '+diff+' dias');
  return d.toLocaleDateString(localeOf(),{day:'2-digit',month:'short'});
}

let SHEET=null;

  const ov=$('shOv'),sh=$('sheet');
  sh.innerHTML=`<div class="sh-grab" id="shGrab"><i></i></div><div class="sh-body">${html}</div>`;
  sh.style.transform='';sh.style.transition='';

  SHEET=kind||'sheet';
  const g=$('shGrab');let y0=0,dy=0,drag=false,t0=0;
  g.onpointerdown=e=>{drag=true;y0=e.clientY;dy=0;t0=Date.now();try{g.setPointerCapture(e.pointerId)}catch(_){}sh.style.transition='none'};
  g.onpointermove=e=>{if(!drag)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translateY(${dy}px)`};
  const end=()=>{if(!drag)return;drag=false;sh.style.transition='';const v=dy/Math.max(1,Date.now()-t0);
    if(dy>110||v>0.7)closeSheet();else sh.style.transform=''};
  g.onpointerup=end;g.onpointercancel=end;
}

  const ov=$('shOv'),sh=$('sheet');

function unlockAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function beep(){
  try{
    if(!AC)return;const t0=AC.currentTime;
    [0,.24,.48].forEach((d,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=i===2?1175:880;
      g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.35,t0+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.2);
      o.connect(g);g.connect(AC.destination);o.start(t0+d);o.stop(t0+d+.22)});
  }catch(e){}
}
function startRestFor(baseId){const ex=findBase(baseId);if(!ex)return;const a=activeOf(ex);startRest(a.rest,nmv(a.vid,a.name))}
function startRest(sec,name){
  unlockAudio();
  TMR={end:Date.now()+sec*1000,total:sec,name:name||'',fired:false,late:false};
  save('iron_timer',TMR);

}
function timerLoop(){clearInterval(tInt);if(!TMR){paintTimer();return}tInt=setInterval(tick,250);tick()}
function tick(){
  if(!TMR){clearInterval(tInt);paintTimer();return}
  if(leftMs()<=0&&!TMR.fired){
    TMR.fired=true;TMR.late=-leftMs()>4000;TMR.seen=Date.now();save('iron_timer',TMR);
    if(!TMR.late){if(navigator.vibrate)navigator.vibrate([140,70,140,70,220]);beep()}
  }
  paintTimer();
  if(TMR&&TMR.fired&&Date.now()-(TMR.seen||TMR.end)>(TMR.late?5500:2800))endTimer();
}
function endTimer(){TMR=null;try{localStorage.removeItem('iron_timer')}catch(e){}clearInterval(tInt);paintTimer()}
function timerAdd(n){
  if(!TMR){if(n>0)startRest(n,'');return}
  if(TMR.fired){startRest(Math.max(15,n),TMR.name);return}
  TMR.end+=n*1000;
  const left=Math.ceil((TMR.end-Date.now())/1000);
  if(left<=0)TMR.end=Date.now();
  TMR.total=Math.max(TMR.total,left);
  save('iron_timer',TMR);tick();
}

function kcalRangeSum(pred){return HISTORY.filter(pred).reduce((s,h)=>s+kcalOf(h),0)}
function kcalToday(){const d=todayISO();return Math.round(kcalRangeSum(h=>h.date===d))}
function kcalThisWeek(){
  const mon=weekMondayOf(0);const a=isoOf(mon);const b=new Date(mon);b.setDate(mon.getDate()+6);const e=isoOf(b);
  return Math.round(kcalRangeSum(h=>h.date>=a&&h.date<=e));
}
function kcalThisMonth(){const m=todayISO().slice(0,7);return Math.round(kcalRangeSum(h=>h.date.slice(0,7)===m))}
function kcalThisYear(){const y=todayISO().slice(0,4);return Math.round(kcalRangeSum(h=>h.date.slice(0,4)===y))}
function kcalAllTime(){return Math.round(kcalRangeSum(()=>true))}
function animateNumber(el,to,duration){
  if(!el)return;
  const from=parseInt(el.dataset.val||'0',10)||0;
  el.dataset.val=to;
  const start=performance.now();
  function frame(now){
    const p=Math.min(1,(now-start)/duration);
    const eased=1-Math.pow(1-p,3);
    const v=Math.round(from+(to-from)*eased);
    const txt=v.toLocaleString(localeOf());
    if(el.firstChild&&el.firstChild.nodeType===1){el.firstChild.textContent=txt}else{el.textContent=txt}
    if(p<1)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function priorMaxWeight(vid){
  let mx=null;
  HISTORY.forEach(h=>{
    (h.items||[]).forEach(it=>{
      if(it.id!==vid)return;
      const vals=(it.sw||[]).filter(v=>v!=null);
      const localMax=vals.length?Math.max(...vals):(it.w!=null?it.w:null);
      if(localMax!=null&&(mx==null||localMax>mx))mx=localMax;
    });
    if(h.weights&&h.weights[vid]!=null&&(mx==null||h.weights[vid]>mx))mx=h.weights[vid];
  });
  return mx;
}

  const day=PROGRAM[key];if(!day)return null;

    const s=arr.filter(x=>x.d).length;done+=s;tot+=a.sets;
    if(!a.bw)snap[a.vid]=wOf(a);
    const sw=a.bw?null:arr.map(x=>x.d?(x.w!=null?x.w:wOf(a)):null);
    const trackedVal=((a.unit==='m'||a.unit==='min')&&s>0)?(()=>{const first=arr.find(x=>x.d);return first&&first.w!=null?first.w:wOf(a)})():0;
    kcalTotal+=estimateKcalForItem(ex,a,s,trackedVal);
    if(!a.bw&&!a.unit&&s>0){
      const doneW=(sw||[]).filter(v=>v!=null);
      const bestNow=doneW.length?Math.max(...doneW):null;
      if(bestNow!=null){
        const prior=priorMaxWeight(a.vid);
        if(prior!=null&&bestNow>prior)prs.push({name:exName(a.vid,a.name),w:bestNow});
      }
    }
    return {id:a.vid,n:a.name,s,t:a.sets,w:a.bw?null:wOf(a),sw,seat:seatOn(a.vid)?seatLevel(a.vid):null};
  });
  if(done===0)return null;
  const kcal=Math.round(kcalTotal);
  HISTORY.unshift({date:dateStr||todayISO(),workout:key,label:day.label,done,tot,weights:snap,items,kcal,ts:Date.now()});
  save('iron_history',HISTORY);
  SESSION[key]={};save('iron_session',SESSION);OPEN[key]=undefined;
  delete SESSMETA[key];save('iron_sessmeta',SESSMETA);
  if(RESUMED===key)RESUMED=null;
  cloudSync();
  return {done,tot,kcal,prs};
}

/* =================== PROGRESSO =================== */
function weekMondayOf(off){
  const now=new Date(todayISO()+'T00:00');
  const dw=(now.getDay()+6)%7;
  const m=new Date(now);m.setDate(now.getDate()-dw+(off*7));
  return m;
}
const isoOf=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
function weekLabel(off){
  const a=weekMondayOf(off),b=new Date(a);b.setDate(a.getDate()+6);
  const f=x=>x.toLocaleDateString(localeOf(),{day:'2-digit',month:'short'});
  if(off===0)return t('estasemana');
  if(off===-1)return t('semanapassada');
  return f(a)+' '+t('ate')+' '+f(b);
}
function shiftWeek(n){
  const nw=WEEKOFF+n;
  if(nw>0)return;
  WEEKOFF=nw;renderProgress();
}
function renderProgress(){
  const pv=$('progView');
  const now=new Date();
  const last7=new Set();
  HISTORY.forEach(h=>{const d=new Date(h.date+'T00:00');const diff=(now-d)/864e5;if(diff>=0&&diff<7)last7.add(h.date)});
  const total=HISTORY.length;
  const lastH=HISTORY[0];
  const wd=[t('wdSeg'),t('wdTer'),t('wdQua'),t('wdQui'),t('wdSex'),t('wdSab'),t('wdDom')];
  const WKPAGES=12;
  let pagesHtml='';
  for(let off=-(WKPAGES-1);off<=0;off++){
    const mon=weekMondayOf(off);
    let ds='';

function trainedDaysLast365(){
  const cutoff=new Date(todayISO()+'T00:00');cutoff.setDate(cutoff.getDate()-364);
  const set=new Set();
  HISTORY.forEach(h=>{if(new Date(h.date+'T00:00')>=cutoff)set.add(h.date)});
  return set.size;
}
function heatmapHtml(){
  const days=365;
  const end=new Date(todayISO()+'T00:00');
  const counts={};
  HISTORY.forEach(h=>{counts[h.date]=(counts[h.date]||0)+1});
  let maxC=1;Object.values(counts).forEach(c=>{if(c>maxC)maxC=c});
  const cells=[];
  for(let i=days-1;i>=0;i--){
    const d=new Date(end);d.setDate(d.getDate()-i);
    const iso=isoOf(d);
    const c=counts[iso]||0;
    let lvl=0;
    if(c>0)lvl=c>=maxC?4:Math.max(1,Math.ceil(c/maxC*3));
    cells.push({iso,c,lvl});
  }
  const firstDow=(new Date(cells[0].iso+'T00:00').getDay()+6)%7;
  const padded=Array(firstDow).fill(null).concat(cells);
  return `<div class="heatgrid">${padded.map(c=>c?`<div class="hcell l${c.lvl}" title="${dtBR(c.iso)}: ${c.c} ${c.c===1?t('umtreino'):t('doistreinos')}"></div>`:`<div class="hcell empty"></div>`).join('')}</div>`;
}
function bestLiftsMap(){
  const m={};
  HISTORY.forEach(h=>{
    (h.items||[]).forEach(it=>{
      const u=unitOf(it.id);
      if(u!=='kg')return;
      const vals=(it.sw||[]).filter(v=>v!=null);
      const localMax=vals.length?Math.max(...vals):(it.w!=null?it.w:null);
      if(localMax==null)return;
      if(!m[it.id]||localMax>m[it.id].w)m[it.id]={w:localMax,date:h.date,name:exName(it.id,it.n)};
    });
  });
  return m;
}
function strengthPanelHtml(){
  const m=bestLiftsMap();
  const ids=Object.keys(m);
  if(!ids.length)return `<div class="tip"><div class="ic">🏆</div><p>${t('semrecordes')}</p></div>`;
  ids.sort((a,b)=>new Date(m[b].date)-new Date(m[a].date));
  const top=ids.slice(0,8);
  return `<div class="hist">`+top.map(id=>{
    const rec=m[id];
    const meta=E[id];
    const reps=meta?parseRepsSeconds(meta.reps):{kind:'reps',avg:10};
    const oneRM=reps.kind==='reps'?Math.round(rec.w*(1+reps.avg/30)):null;
    return `<div class="hd-row"><span>${exName(id,rec.name)}</span><small>${t('melhorcarga')}: <b>${fmtW(rec.w)}kg</b>${oneRM?' · '+t('rm1est')+': <b>~'+oneRM+'kg</b>':''} · ${dtBR(rec.date)}</small></div>`;
  }).join('')+`</div>`;
}
function calcStreak(){
  if(!HISTORY.length)return 0;
  const weeks=new Set();
  HISTORY.forEach(h=>{const d=new Date(h.date+'T00:00');const oneJan=new Date(d.getFullYear(),0,1);
    const wk=d.getFullYear()+'-'+Math.ceil(((d-oneJan)/864e5+oneJan.getDay()+1)/7);weeks.add(wk)});
  const now=new Date();const oneJan=new Date(now.getFullYear(),0,1);
  let wkNum=Math.ceil(((now-oneJan)/864e5+oneJan.getDay()+1)/7);
  let streak=0;
  while(weeks.has(now.getFullYear()+'-'+wkNum)){streak++;wkNum--}
  return streak;
}

          <div class="tx"><b>${trLbl(d.label)}</b><small>${d.ex.length} ${t('exercicios')} · ${d.ex.reduce((s,e)=>s+e.sets,0)} ${t('series')}</small></div></div>
        ${d.ex.map((e,i)=>`<div class="rex"><div class="rn">${i+1}</div>
          <div class="rtx"><b>${exName(e.id,e.name)}</b><small>${musLabel(e.muscle)} · ${e.sets}×${e.reps}${e.rest?` · ${e.rest}s`:''}</small></div>
          <button class="rx" onclick="obRm('${k}',${i})">✕</button></div>`).join('')}
        <button class="radd" onclick="openPicker('${k}')">${t('addexextra')}</button>

}
function obGrabBodyKg(){const i=$('obBodyKg');if(i&&i.value){const v=parseFloat(i.value.replace(',','.'));if(!isNaN(v)&&v>0)OBDATA.bodyKg=v}}

/* =================== TREINO RÁPIDO DO DIA ===================
   Objetivo + grupos + tempo -> um dia completo (musculação, funcional, HIIT, circuito ou cardio) guardado como o dia extra Q.
   Reaproveita o gerador de modelos (generateFromTpl) com um bloco de dia montado na hora. Nunca mexe nos dias A, B, C... */
const QK_GOALS=['hipertrofia','forca','emagrecimento','hiit','funcional','circuito','cardio','resistencia','geral'];
const QK_TIMES=[20,30,45,60];
const QK_CHIPS=['chest','back','shoulders','arms','legs','glutes','core','calf'];
const QK_PRIO=['legs','chest','back','shoulders','arms','glutes','core','calf'];   /* com pouco tempo, entram primeiro os da frente */
const QK_FULL=['legs','chest','back','shoulders','arms','core'];
const QK_SLOTS={
 chest:['barbellbench/chestpress/dbbench','inclinedb/inclinebench/inclinepushup','pecdeck/cablefly/dbfly','cablecrossover/lowcablefly','declinebench/declinedb/chestdips','pushupv/dbpullover'],
 back:['pullupv/latpull/neutralpull','bentrow/seatedrow/tbar','onearmrow/cablerow1/widerow','lowrow/neutralpull/widerow','straightarm/dbpullover','shrugv'],
 shoulders:['dbshoulder/shoulderpress/ohpv','sidelat/latraisemachine/cablelatv/seateddblat','dbrevfly/reversefly/facepullv','arnoldpress/dbpressstand','frontraise/cablefrontraise','uprightrow/facepullv'],
 arms:['biceps/ezcurl/preachercurl','triceps/pushdownbar/skullcrusher','hammer/inclinecurl/cablecurl','overheadtriceps/dbtriext/benchdipv','concentrationcurl/zottman/cablehammer','diamondpushup/benchdipv/dbkickback'],
 legs:['backsquat/legpress/hacksquat/smithsquat','rdlv/rdlbarv','legext/lungev','legcurl/lyinglegcurl/ballegcurl','walkinglunge/bulgarian/stepup/legpresssingle','goblet2/frontsquat'],
 glutes:['hipthrustv/hipthrustmachine/glutekick','bulgarian/walkinglunge/stepup','glutekick/abductor','rdlv/rdlbarv','abductor/bridgev'],
 core:['plankv/deadbug/absfull','cablecrunchv/absfull/weightedcrunch','legraisev/reversecrunch/hangingraisev','russiantwist/cablewoodchop/crosscrunch','sideplank/bicyclecrunch'],
 calf:['calf/dbcalf/seatedcalf','seatedcalf/dbcalf/calf'],
 pad:['legext/lungev','legcurl/lyinglegcurl/ballegcurl','walkinglunge/bulgarian/stepup/legpresssingle']   /* completa o dia quando o grupo pedido tem poucas vagas (só panturrilha) */
};
const QK_BLK={
 hiit:{all:['HI_TABATA','HI_FULL','HI_LO','HI_UP','HI_KB'],low:['HI_LO','HI_TABATA','HI_KB'],up:['HI_UP','HI_TABATA','HI_KB'],mach:['HI_MACH','HI_MACH2']},
 funcional:{all:['FU_A','FU_B','FU_C'],body:['FU_BW','FU_BW2']},
 cardio:{short:['CA_I_A','CA_I_B','CA_I_C'],long:['CA_Z_A','CA_Z_B','CA_Z_C']}
};
const QK_LOW=['legs','glutes','calf'],QK_UP=['chest','back','shoulders','arms'];
const qkNoGrp=g=>{const d=GOALS[g]||{};return !!(d.cardioFocus||d.functionalFocus)};
let QK=null,QKSTEP='pick',QKPREV=null,QKFROM='start';

/* tempo estimado de um exercício (segundos): séries x (trabalho + descanso) + troca de aparelho */
function qkSecOf(it){
  const rp=String(it.reps==null?'':it.reps).replace(/,/g,'.');
  const nums=(rp.match(/\d+(?:\.\d+)?/g)||[]).map(Number);
  const mid=nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:10;
  let work;
  if(/min/i.test(rp))work=mid*60;
  else if(/\d\s*s\b/.test(rp))work=mid;
  else if(/metros/i.test(rp))work=mid*1.2;
  else if(/passos/i.test(rp))work=mid*.8;
  else work=Math.max(20,Math.min(75,mid*3.5));
  if(/\/\s*(lado|perna)|cada lado/i.test(rp))work*=2;
  const sets=Math.max(1,it.sets||1),rest=it.rest||0;
  return sets*work+(sets-1)*rest+(it.ss?20:60);
}
const qkEst=ex=>Math.round(ex.reduce((s,it)=>s+qkSecOf(it),0)/60);

/* reparte as vagas entre os grupos (1 de cada, depois o 2º de cada...) e põe compostos antes de isolados, panturrilha e core no fim */
function qkAlloc(gs,n,seed,lim){
  const lists=gs.map(g=>{let l=QK_SLOTS[g].slice();
    if(lim&&lim[g]!=null)l=l.slice(0,lim[g]);
    if(seed>0&&l.length>2){const tail=l.slice(1),r=seed%tail.length;return [l[0]].concat(tail.slice(r),tail.slice(0,r))}
    return l});
  const out=[];
  for(let r=0;out.length<n;r++){
    let any=false;
    lists.forEach(l=>{if(r<l.length&&out.length<n){out.push(l[r]);any=true}});
    if(!any)break;
  }
  const rk=s=>{const e=E[s.split('/')[0]],c=e?e.cat:'';return c==='comp'?0:c==='iso'?1:c==='calf'?2:3};
  return out.map((s,i)=>[s,i]).sort((a,b)=>(rk(a[0])-rk(b[0]))||(a[1]-b[1])).map(x=>x[0]);
}
/* treino rápido de musculação: poucas séries e descanso um pouco menor (força mantém o descanso longo) */
function qkCompress(ex,o){
  const cap=o.min<=30?3:o.min<=45?4:9,k=o.min<=30?.75:o.min<=45?.9:1;
  ex.forEach(it=>{
    if((it.sets||0)>cap)it.sets=cap;
    const c=E[it.id]&&E[it.id].cat;
    if(o.goal!=='forca'&&k<1&&it.rest&&(c==='comp'||c==='iso'))it.rest=Math.max(30,Math.round(it.rest*k/5)*5);
  });
}
/* dupla sem par (o parceiro era repetido) volta a ser exercício normal */
function qkCleanPairs(ex){
  const c={};ex.forEach(it=>{if(it.ss)c[it.ss]=(c[it.ss]||0)+1});
  ex.forEach(it=>{if(it.ss&&c[it.ss]<2){delete it.ss;if(!it.rest)it.rest=20}});
}
/* duplas de circuito terminam juntas: todas com o menor número de séries da dupla */
function qkEqualize(ex){
  const t={};ex.forEach(it=>{if(it.ss)t[it.ss]=Math.min(t[it.ss]||99,it.sets||1)});
  ex.forEach(it=>{if(it.ss)it.sets=t[it.ss]});
}
/* corta o dia até caber no tempo: primeiro séries (em dupla juntas), depois os últimos exercícios */
function qkMinItem(it){return /min/i.test(String(it.reps))&&(it.sets||1)===1}
function qkShrinkMin(it,f){
  let r=String(it.reps).replace(/\d+/g,n=>String(Math.max(4,Math.round(n*f))));
  const m=/^(\d+)–(\d+)(.*)$/.exec(r);if(m&&m[1]===m[2])r=m[1]+m[3];
  it.reps=r;
}
function qkFit(ex,limitMin){
  let guard=80;
  while(qkEst(ex)>limitMin&&guard--){
    const mi=ex.filter(it=>qkMinItem(it)&&Math.max.apply(null,(String(it.reps).match(/\d+/g)||[0]).map(Number))>8);
    if(mi.length){mi.forEach(it=>qkShrinkMin(it,.85));continue}
    let bi=-1,bs=-1;
    ex.forEach((it,i)=>{if((it.sets||1)>2){const s=qkSecOf(it);if(s>bs){bs=s;bi=i}}});
    if(bi>=0){const tag=ex[bi].ss;ex.forEach(x=>{if(x===ex[bi]||(tag&&x.ss===tag)){if((x.sets||1)>2)x.sets-=1}});continue}
    if(ex.length>3){
      const gone=ex.pop();
      if(gone.ss){const left=ex.filter(x=>x.ss===gone.ss);if(left.length<2)left.forEach(x=>{delete x.ss;if(!x.rest)x.rest=30})}
      continue;
    }
    break;
  }
}
function qkHiitKey(gs,style){
  if(style==='mach')return 'mach';
  const g=gs.filter(x=>x!=='core');
  if(!g.length)return 'all';
  if(g.every(x=>QK_LOW.indexOf(x)>=0))return 'low';
  if(g.every(x=>QK_UP.indexOf(x)>=0))return 'up';
  return 'all';
}
function qkMake(o){
  const gd=GOALS[o.goal]||GOALS.hipertrofia;
  const style=o.goal==='cardio'?'mix':(o.style||'mix');
  const seed=o.vseed||0;
  const base={groups:Object.keys(GRP_LABEL),splits:1,freq:1,first:'',cardioPrefs:[],style,vseed:seed,goal:o.goal};
  const build=(key,n,ign,fin)=>{
    const tpl={id:'quick',goal:o.goal,n:1,days:[key],pd:n,ign,circ:o.goal==='circuito',pt:'Rápido',en:'Quick'};
    return generateFromTpl({...base,perDay:n,finisher:fin},tpl).A;
  };
  const wanted=qkNoGrp(o.goal)?[]:QK_CHIPS.filter(g=>(o.groups||[]).indexOf(g)>=0);
  let day,est,dropped=[];
  if(!gd.cardioFocus&&!gd.functionalFocus&&!gd.hiitFocus){
    let gs=QK_PRIO.filter(g=>wanted.indexOf(g)>=0);
    if(!gs.length)gs=QK_FULL.slice();
    const nsl=a=>a.reduce((s,g)=>s+QK_SLOTS[g].length,0);
    const lim={},need=4-nsl(gs);
    if(need>0){gs.push('pad');lim.pad=need}   /* ex.: só panturrilha tem 2 vagas: completa com 2 de pernas */
    const fin=o.min>=45&&!!gd.finisherDefault;
    let best=null;
    for(let n=8;n>=3;n--){
      const use=gs.slice(0,n);
      TD.QK={l:['Rápido','Quick'],s:['',''],x:qkAlloc(use,n+1,seed,lim)};
      const d=build('QK',n,true,fin);qkCompress(d.ex,o);qkEqualize(d.ex);const e=qkEst(d.ex);
      best={d,e,use};
      if(e<=o.min*1.08)break;
    }
    delete TD.QK;
    day=best.d;est=best.e;
    dropped=wanted.filter(g=>best.use.indexOf(g)<0);
  }else{
    let keys;
    if(o.goal==='hiit')keys=QK_BLK.hiit[qkHiitKey(wanted,style)];
    else if(o.goal==='funcional')keys=style==='body'?QK_BLK.funcional.body:QK_BLK.funcional.all;
    else keys=o.min>=40?QK_BLK.cardio.long:QK_BLK.cardio.short;
    const cands=keys.filter(k=>TD[k]).map(k=>{const d=build(k,8,false,false);return {k,d,e:qkEst(d.ex)}});
    cands.sort((a,b)=>Math.abs(a.e-o.min)-Math.abs(b.e-o.min));
    const pk=cands[seed%Math.min(cands.length,3)];
    day=pk.d;
    if(pk.e<o.min*.7&&(o.goal==='hiit'||o.goal==='funcional')&&cands.length>1){
      let b2=null;
      cands.forEach(c=>{if(c===pk)return;const sc=Math.abs(pk.e+c.e-o.min);if(!b2||sc<b2.sc)b2={c,sc}});
      const used=new Set(day.ex.map(e=>e.id)),tm={};
      b2.c.d.ex.forEach(e=>{
        if(used.has(e.id))return;
        const x={...e};
        if(x.ss){if(!tm[x.ss])tm[x.ss]='T2'+Object.keys(tm).length;x.ss=tm[x.ss]}
        day.ex.push(x);used.add(x.id);
      });
    }
    qkCleanPairs(day.ex);qkEqualize(day.ex);
    if(qkEst(day.ex)>o.min*1.15)qkFit(day.ex,o.min*1.1);
    est=qkEst(day.ex);
  }
  day.meta=Object.assign({},day.meta,{quick:true,qgoal:o.goal,qgroups:wanted,qmin:o.min,qest:est,qseed:seed,letter:'Q',freq:1});
  day.label=qkLabel(day.meta);day.sub=qkSub(day.meta);day.intro=qkIntro(day.meta);
  return {day,est,dropped};
}

/* ---- textos do dia rápido (calculados no idioma atual) ---- */
function qkFocus(m){
  const en=LANG==='en',g=m.qgoal,gs=m.qgroups||[];
  if(g==='hiit'||g==='funcional'||g==='cardio')return goalLabel(g);
  if(!gs.length||gs.length>=6)return en?'Full body':'Corpo todo';
  if(gs.length<=2)return gs.map(grpLabel).join(' + ');
  return gs.length+' '+(en?'groups':'grupos');
}
function qkLabel(m){return (LANG==='en'?'Quick':'Rápido')+' · '+qkFocus(m)}
function qkSub(m){return goalLabel(m.qgoal)+' · ~'+m.qest+' min'}
function qkIntro(m){
  const en=LANG==='en',g=m.qgoal,f=qkFocus(m);
  const strength=!(g==='hiit'||g==='funcional'||g==='cardio');
  const bits=[en?'Quick workout':'Treino rápido',goalLabel(g)];
  if(strength)bits.push(f);
  bits.push('~'+m.qest+' min');
  return bits.join(' · ')+'. '+(en?'Built to fit your time; your other workouts stay as they were.':'Montado para caber no seu tempo; seus outros treinos continuam como estavam.');
}
function qkTrLbl(l){
  const m=/^(Rápido|Quick) · (.+)$/.exec(l);if(!m)return l;
  const en=LANG==='en',pre=en?'Quick':'Rápido',tail=m[2];
  if(tail==='Corpo todo'||tail==='Full body')return pre+' · '+(en?'Full body':'Corpo todo');
  const k=/^(\d+) (grupos|groups)$/.exec(tail);if(k)return pre+' · '+k[1]+' '+(en?'groups':'grupos');
  const gk=Object.keys(GOALS).find(x=>GOALS[x].label===tail||(GOALS_EN[x]&&GOALS_EN[x].label===tail));
  if(gk)return pre+' · '+goalLabel(gk);
  const parts=tail.split(' + ').map(s=>{const key=Object.keys(GRP_LABEL).find(g=>GRP_LABEL[g]===s||GRP_LABEL_EN[g]===s);return key?grpLabel(key):s});
  return pre+' · '+parts.join(' + ');
}

/* ---- telas ---- */
function qkInit(){
  const old=PROGRAM&&PROGRAM.Q&&PROGRAM.Q.meta&&PROGRAM.Q.meta.quick?PROGRAM.Q.meta:null;
  QK={goal:old?old.qgoal:(SETUP&&QK_GOALS.indexOf(SETUP.goal)>=0?SETUP.goal:'hipertrofia'),
      groups:old?(old.qgroups||[]).slice():[],min:old&&QK_TIMES.indexOf(old.qmin)>=0?old.qmin:30,vseed:0,
      style:(SETUP&&SETUP.style)||'mix'};
}
function qkOpen(from){

}
function qkBack(){
  if(QKFROM==='day'){closeOB();return}
  OBSTEP=0;QKPREV=null;QKSTEP='pick';renderOB();$('ob').scrollTop=0;
}
function qkSetGoal(g){QK.goal=g;QK.vseed=0;renderOB()}
function qkTglGrp(g){const i=QK.groups.indexOf(g);if(i>=0)QK.groups.splice(i,1);else QK.groups.push(g);QK.vseed=0;renderOB()}
function qkFullBody(){QK.groups=[];QK.vseed=0;renderOB()}
function qkSetMin(m){QK.min=m;QK.vseed=0;renderOB()}
function qkGen(){QKPREV=qkMake(QK);QKSTEP='prev';renderOB();$('ob').scrollTop=0}
function qkVar(){QK.vseed=(QK.vseed||0)+1;QKPREV=qkMake(QK);renderOB();toast(t('variacaoaplicada'))}
function qkToPick(){QKSTEP='pick';renderOB();$('ob').scrollTop=0}

      </div>

        ${QK_CHIPS.map(g=>`<button class="qchip${o.groups.indexOf(g)>=0?' on':''}" onclick="qkTglGrp('${g}')">${grpLabel(g)}</button>`).join('')}
      </div></div>`;
  ob.innerHTML=`<div class="ob-in">

}
function qkCommit(){
  if(!QKPREV)return;
  if(PROGRAM&&PROGRAM.Q&&sessionStats('Q').done>0&&!confirm(t('qk_replace')))return;
  /* sem treino seu ainda (instalação nova ou depois de Sair): o A/B/C que existe é só o padrão automático, então o rápido fica sozinho */
  const fresh=!SETUP&&qkPristine();
  if(!SETUP){SETUP={...DEFAULT_SETUP,quick:fresh,name:(OBDATA&&OBDATA.name)||'',bodyKg:(OBDATA&&OBDATA.bodyKg)||undefined};save('iron_setup',SETUP)}
  if(fresh)PROGRAM={};
  else if(!PROGRAM||!Object.keys(PROGRAM).length)PROGRAM=generateProgram(SETUP);
  PROGRAM.Q=QKPREV.day;
  QKDAY=todayISO();save('iron_qkonly',QKDAY);
  SESSION.Q={};delete SESSMETA.Q;
  save('iron_session',SESSION);save('iron_sessmeta',SESSMETA);save('iron_program',PROGRAM);
  cloudSync();
  QKPREV=null;QKSTEP='pick';OPEN.Q=undefined;
  closeOB();cur='Q';render();window.scrollTo({top:0});
  toast(t('qk_pronto'));
}
/* "só o rápido": no dia em que o treino rápido é criado, a tela de treino mostra só ele; os treinos A, B, C... continuam guardados */
function qkOnly(){return !!(PROGRAM&&PROGRAM.Q&&QKDAY&&QKDAY===todayISO()&&Object.keys(PROGRAM).length>1)}
