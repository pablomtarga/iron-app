/* o programa A/B/C é o padrão automático, sem edição e sem série marcada? (então pode ficar só o rápido) */
function qkPristine(){
  if(!PROGRAM)return true;
  const ks=Object.keys(PROGRAM).filter(k=>k!=='Q');
  if(ks.some(k=>sessionStats(k).done>0))return false;
  let d;try{d=generateProgram(DEFAULT_SETUP)}catch(e){return false}
  const kd=Object.keys(d);
  return ks.length===kd.length&&ks.every(k=>d[k]&&PROGRAM[k].ex.map(e=>e.id).join()===d[k].ex.map(e=>e.id).join());
}
function qkExit(){QKDAY='';try{localStorage.removeItem('iron_qkonly')}catch(e){}}
function qkMyProg(){qkExit();cur=Object.keys(PROGRAM).find(k=>k!=='Q')||'Q';render();window.scrollTo({top:0})}
function qkRemove(){
  if(!PROGRAM||!PROGRAM.Q)return;
  if(sessionStats('Q').done>0&&!confirm(t('qk_removeconf')))return;
  delete PROGRAM.Q;delete SESSION.Q;delete SESSMETA.Q;
  qkExit();
  if(!Object.keys(PROGRAM).length){
    PROGRAM=null;SETUP=null;cur='A';
    ['iron_program','iron_setup'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
    save('iron_session',SESSION);save('iron_sessmeta',SESSMETA);cloudSync();
    render();openWizard(false);toast(t('qk_removido'));return;
  }
  save('iron_program',PROGRAM);save('iron_session',SESSION);save('iron_sessmeta',SESSMETA);cloudSync();
  cur=Object.keys(PROGRAM)[0];render();toast(t('qk_removido'));
}

/* aplica um modelo: define quantos treinos, frequência e exercícios por dia sugeridos */
function obApplyTpl(tp){
  OBDATA.tpl=tp.id;OBDATA.splits=tp.n;OBDATA.freq=tp.freq;OBDATA.perDay=tp.pd;
  OBDATA.first=TD[tp.days[0]].l[0];OBDATA.vseed=0;
}
function obEnsure(){
  if(!OBDATA.goal||!GOALS[OBDATA.goal])OBDATA.goal='hipertrofia';
  let tp=OBDATA.tpl&&tplById(OBDATA.tpl);
  if(!tp||tp.goal!==OBDATA.goal){
    tp=tplPick(OBDATA.goal,OBDATA.splits||3);
    const f=OBDATA.freq,pd=OBDATA.perDay;
    obApplyTpl(tp);
    if(f)OBDATA.freq=f;if(pd)OBDATA.perDay=pd;   /* quem já tinha treino mantém frequência e exercícios por dia */
  }
  OBDATA.groups=OBDATA.groups||Object.keys(GRP_LABEL);
  if(OBDATA.perDay>8)OBDATA.perDay=8;
}
function obSetGoal(g){
  OBDATA.goal=g;
  if(GOALS[g].cardioFocus&&!OBDATA.cardioPrefs)OBDATA.cardioPrefs=[];
  if(OBDATA.finisher===undefined||OBDATA.finisher===null)OBDATA.finisher=GOALS[g].finisherDefault;
  if(g==='cardio'&&OBDATA.style&&OBDATA.style!=='mix')OBDATA.style='mix';
  obApplyTpl(tplPick(g,3));
  renderOB();
}
function obSetTpl(id){const tp=tplById(id);if(!tp)return;obApplyTpl(tp);renderOB()}
function obSetStyle(s){OBDATA.style=s;renderOB()}
function obVariation(){
  OBDATA.vseed=(OBDATA.vseed||0)+1;
  OBPROG=generateProgram(OBDATA);renderOB();toast(t('variacaoaplicada'));
}
function obTglCardio(id){
  OBDATA.cardioPrefs=OBDATA.cardioPrefs||[];
  const i=OBDATA.cardioPrefs.indexOf(id);
  if(i>=0)OBDATA.cardioPrefs.splice(i,1);else OBDATA.cardioPrefs.push(id);
  renderOB();
}
function obTgl(g){
  const i=OBDATA.groups.indexOf(g);
  if(i>=0){if(OBDATA.groups.length>1)OBDATA.groups.splice(i,1)}
  else OBDATA.groups.push(g);
  renderOB();
}
function obGen(){OBPROG=generateProgram(OBDATA);OBSTEP=2;renderOB();window.scrollTo({top:0})}

function pickChoose(id){
  const ctx=PICKCTX;if(!ctx)return;
  const item=buildItem(id, ctx.replaceIdx!=null?whyFor(E[id],ctx.replaceIdx):whyFor(E[id],5));
  if(ctx.replaceIdx!=null){
    const old=ctx.list[ctx.replaceIdx];
    // aparece em outros treinos? oferece substituir lá também
    if(ctx.mode==='program'){
      const outros=Object.keys(PROGRAM).filter(k=>k!==ctx.dayKey&&PROGRAM[k].ex.some(x=>x.id===old.id));
      if(outros.length){
        $('pickOv').classList.add('hidden');
        askScope(old,item,ctx.dayKey,ctx.replaceIdx,outros);
        return;
      }
    }
    ctx.list.splice(ctx.replaceIdx,1,item);
    cleanupEx(ctx.dayKey,old.id);
  }else{
    ctx.list.splice(insertPos(ctx.list,E[id].cat),0,item);
  }
  $('pickOv').classList.add('hidden');
  if(ctx.mode==='wizard'){renderOB()}
  else{
    save('iron_program',PROGRAM);cloudSync();
    if(ctx.replaceIdx==null)OPEN[cur]=id;
    renderTrain();
    if(ctx.replaceIdx==null)setTimeout(()=>{const els=$('list').querySelectorAll('.card,.erow');const el=els[els.length-1];if(el)keepVisible(el)},140);
  }
  toast(ctx.replaceIdx!=null?t('substituidopor')+' '+nmv(item.id,item.name):nmv(item.id,item.name)+' '+t('adicionado'));
}
function askScope(old,item,dayKey,idx,outros){
  boxOpen(`<h3>${t('trocarem')}</h3>
    <div class="sub"><b>${exName(old.id,old.name)}</b> ${t('tambemaparece')} ${outros.length===1?t('notreino'):t('nostreinos')} <b>${outros.join(', ')}</b>. ${t('querttrocar')} <b>${exName(item.id,item.name)}</b> ${t('sopara')}</div>
    <div class="mrow"><button class="mbtn" onclick="doScope(false)">${t('sonotreino')} ${dayKey}</button></div>
    <div class="mrow"><button class="mbtn pri" onclick="doScope(true)">${t('trocaremtodos')} (${outros.length+1})</button></div>
    <div class="mfoot"><button onclick="boxClose()">${t('cancelar')}</button></div>`);
  SCOPE={old,item,dayKey,idx,outros};
}
let SCOPE=null;
function doScope(todos){
  const s=SCOPE;if(!s)return;
  PROGRAM[s.dayKey].ex.splice(s.idx,1,JSON.parse(JSON.stringify(s.item)));
  cleanupEx(s.dayKey,s.old.id);
  let n=1;
  if(todos){
    s.outros.forEach(k=>{
      PROGRAM[k].ex=PROGRAM[k].ex.map(x=>x.id===s.old.id?JSON.parse(JSON.stringify(s.item)):x);
      cleanupEx(k,s.old.id);n++;
    });
  }
  save('iron_program',PROGRAM);cloudSync();
  SCOPE=null;boxClose();renderTrain();
  toast(todos?t('trocadoem')+' '+n+' '+t('doistreinos'):t('trocadono')+' '+s.dayKey);
}

let DRAG=null;
function dragStart(e,i){
  if(e.button>0)return;
  e.preventDefault();
  const list=$('list');
  const rows=[...list.querySelectorAll('.erow')];
  const el=rows[i];if(!el)return;
  const r0=el.getBoundingClientRect(),rf=rows[0].getBoundingClientRect();
  const step=rows[1]?rows[1].getBoundingClientRect().top-rf.top:r0.height+8;
  DRAG={i,to:i,el,rows,step,n:rows.length,y0:e.clientY,y:e.clientY,s0:window.scrollY,
    top0:r0.top+window.scrollY,firstTop:rf.top+window.scrollY,pid:e.pointerId,raf:0};
  el.classList.add('lift');list.classList.add('dragmode');
  rows.forEach(r=>{if(r!==el)r.classList.add('shift')});
  if(navigator.vibrate)navigator.vibrate(12);
  window.addEventListener('pointermove',dragMove,{passive:false});
  window.addEventListener('pointerup',dragEnd);
  window.addEventListener('pointercancel',dragEnd);
  DRAG.raf=requestAnimationFrame(dragFrame);
}
function dragMove(e){if(!DRAG||e.pointerId!==DRAG.pid)return;e.preventDefault();DRAG.y=e.clientY}
function dragFrame(){
  const D=DRAG;if(!D)return;
  const top=$('tabsbar').offsetHeight+10;
  const bot=innerHeight-(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nav-h'))||84)-6;
  let v=0;
  if(D.y<top+46)v=-Math.min(20,(top+46-D.y)/3);
  else if(D.y>bot-46)v=Math.min(20,(D.y-(bot-46))/3);
  if(v)window.scrollBy(0,v);
  const dy=(D.y-D.y0)+(window.scrollY-D.s0);
  const minDy=D.firstTop-D.top0,maxDy=D.firstTop+(D.n-1)*D.step-D.top0;
  const cdy=Math.max(minDy,Math.min(maxDy,dy));
  D.el.style.transform=`translate3d(0,${cdy}px,0) scale(1.015)`;
  const to=Math.max(0,Math.min(D.n-1,Math.round((D.top0+cdy-D.firstTop)/D.step)));
  if(to!==D.to){
    D.to=to;if(navigator.vibrate)navigator.vibrate(7);
    D.rows.forEach((r,j)=>{
      if(r===D.el)return;
      let sh=0;
      if(to>D.i&&j>D.i&&j<=to)sh=-D.step;
      if(to<D.i&&j<D.i&&j>=to)sh=D.step;
      r.style.transform=sh?`translate3d(0,${sh}px,0)`:'';
    });
  }
  D.raf=requestAnimationFrame(dragFrame);
}
function dragEnd(e){
  const D=DRAG;if(!D)return;
  if(e&&e.pointerId!=null&&D.pid!=null&&e.pointerId!==D.pid)return;
  cancelAnimationFrame(D.raf);
  window.removeEventListener('pointermove',dragMove);
  window.removeEventListener('pointerup',dragEnd);
  window.removeEventListener('pointercancel',dragEnd);
  const done=()=>{
    DRAG=null;
    $('list').classList.remove('dragmode');
    if(D.to!==D.i){
      const exs=PROGRAM[cur].ex;const mv=exs.splice(D.i,1)[0];exs.splice(D.to,0,mv);
      save('iron_program',PROGRAM);cloudSync();
      if(navigator.vibrate)navigator.vibrate([10,30,10]);
      toast(t('ordematualizada'));
    }
    renderTrain();
  };
  D.el.classList.add('drop');
  D.el.style.transform=`translate3d(0,${(D.firstTop+D.to*D.step)-D.top0}px,0)`;
  setTimeout(done,190);
}

function b64uToBuf(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
function bufToB64u(b){const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function shNormUrl(v){
  v=String(v||'').trim().replace(/\/+$/,'');
  if(!v)return '';
  if(!/^https?:\/\//i.test(v))v=(/^(localhost|127\.|192\.168\.|10\.)/.test(v)?'http://':'https://')+v;
  return v;
}
async function shApi(base,path,method,body,token){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),20000);
  try{
    const h={};if(body)h['content-type']='application/json';
    if(token)h.authorization='Bearer '+token;
    const r=await fetch(base+'/api'+path,{method:method||'GET',headers:h,body:body?JSON.stringify(body):undefined,signal:ctl.signal});
    let j=null;try{j=await r.json()}catch(e){}
    if(!r.ok){const e=new Error((j&&j.error)||('HTTP '+r.status));e.status=r.status;throw e}
    return j;
  }finally{clearTimeout(to)}
}
function shCredJSON(cred){
  const r=cred.response,out={id:cred.id,rawId:bufToB64u(cred.rawId),type:cred.type,
    clientExtensionResults:cred.getClientExtensionResults?cred.getClientExtensionResults():{}};
  if(cred.authenticatorAttachment)out.authenticatorAttachment=cred.authenticatorAttachment;
  if(r.attestationObject){
    out.response={clientDataJSON:bufToB64u(r.clientDataJSON),attestationObject:bufToB64u(r.attestationObject),transports:r.getTransports?r.getTransports():[]};
  }else{
    out.response={clientDataJSON:bufToB64u(r.clientDataJSON),authenticatorData:bufToB64u(r.authenticatorData),signature:bufToB64u(r.signature)};
    if(r.userHandle)out.response.userHandle=bufToB64u(r.userHandle);
  }
  return out;
}
async function shRegister(base,username,token){
  const o=await shApi(base,'/register/options','POST',{username},token);
  const op=o.options;
  const pk={...op,challenge:b64uToBuf(op.challenge),user:{...op.user,id:b64uToBuf(op.user.id)},
    excludeCredentials:(op.excludeCredentials||[]).map(c=>({...c,id:b64uToBuf(c.id)}))};
  const cred=await navigator.credentials.create({publicKey:pk});
  if(!cred)throw Object.assign(new Error('cancel'),{name:'NotAllowedError'});
  return shApi(base,'/register/verify','POST',{rid:o.rid,response:shCredJSON(cred)});
}
async function shLogin(base,username){
  const o=await shApi(base,'/login/options','POST',{username});
  const op=o.options;
  const pk={...op,challenge:b64uToBuf(op.challenge)};
  if(op.allowCredentials&&op.allowCredentials.length)pk.allowCredentials=op.allowCredentials.map(c=>({...c,id:b64uToBuf(c.id)}));
  else delete pk.allowCredentials;
  const cred=await navigator.credentials.get({publicKey:pk});
  if(!cred)throw Object.assign(new Error('cancel'),{name:'NotAllowedError'});
  return shApi(base,'/login/verify','POST',{rid:o.rid,response:shCredJSON(cred)});
}
function shErr(e){
  const n=e&&e.name,m=String((e&&e.message)||'');
  if(n==='NotAllowedError')return t('shcancelou');
  if(n==='InvalidStateError')return t('shjatem');
  if(n==='SecurityError')return t('shseguranca');
  if(e&&e.status)return m;
  if(n==='AbortError'||n==='TypeError'||/failed to fetch|network/i.test(m))return t('shsemconexao');
  return t('errgenerico')+m;
}

}

      HISTORY.sort((a,b)=>(b.date<a.date?-1:b.date>a.date?1:(b.ts||0)-(a.ts||0)));

      if(d.bodylog)mergeBodyLog(d.bodylog);

      if(d.trash){const st=new Set(TRASH.map(x=>x.ts));(d.trash||[]).forEach(x=>{if(!st.has(x.ts))TRASH.push(x)})}
      save('iron_history',HISTORY);save('iron_weights',WEIGHTS);save('iron_trash',TRASH);

/* =================== GRÁFICOS (linha simples, com dica ao tocar) =================== */
const LCS={};
function lcHtml(id,pts,unit){
  const W=320,H=150,pl=36,pr=16,pt=14,pb=24;
  if(pts.length<2)return '';
  const xs=pts.map(p=>new Date(p.d+'T00:00').getTime()),ys=pts.map(p=>p.v);
  const x0=xs[0];let x1=xs[xs.length-1];if(x1===x0)x1=x0+864e5;
  let lo=Math.min(...ys),hi=Math.max(...ys);const pad=Math.max((hi-lo)*.2,hi>=100?1:.5);lo-=pad;hi+=pad;
  const nice=v=>Math.round(v*10)/10;
  const sx=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr),sy=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  const P=pts.map((p,i)=>[sx(xs[i]),sy(p.v)]);
  const line=P.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const area=line+` L${P[P.length-1][0].toFixed(1)} ${H-pb} L${P[0][0].toFixed(1)} ${H-pb} Z`;
  const ticks=[lo+(hi-lo)*.1,(lo+hi)/2,hi-(hi-lo)*.1].map(nice);
  const grid=ticks.map(v=>`<line class="gr" x1="${pl}" x2="${W-pr}" y1="${sy(v).toFixed(1)}" y2="${sy(v).toFixed(1)}"/><text x="${pl-6}" y="${(sy(v)+3.5).toFixed(1)}" text-anchor="end">${fmtW(v)}</text>`).join('');
  const dl=d=>new Date(d+'T00:00').toLocaleDateString(localeOf(),{day:'2-digit',month:'short'});
  const last=P[P.length-1];
  LCS[id]={pts,unit:unit||'',xs:P.map(q=>q[0]),ys:P.map(q=>q[1]),W};
  return `<div class="lc" id="lc_${id}" onpointermove="lcMove(event,'${id}')" onpointerdown="lcMove(event,'${id}')" onpointerleave="lcLeave('${id}')">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escH(unit||'')}">${grid}
      <path class="ar" d="${area}"/><path class="ln" d="${line}"/>
      <line class="xh" y1="${pt}" y2="${H-pb}" x1="0" x2="0" style="display:none"/>
      <circle class="dt hv" r="4.5" cx="0" cy="0" style="display:none"/>
      <circle class="dt" r="4.5" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}"/>
      <text x="${pl}" y="${H-6}" text-anchor="start">${dl(pts[0].d)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${dl(pts[pts.length-1].d)}</text>
    </svg><div class="lct" style="display:none"></div></div>`;
}
function lcMove(e,id){
  const c=LCS[id],el=$('lc_'+id);if(!c||!el)return;
  const svg=el.querySelector('svg'),r=svg.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*c.W;
  let bi=0,bd=1e9;c.xs.forEach((v,i)=>{const d=Math.abs(v-x);if(d<bd){bd=d;bi=i}});
  const p=c.pts[bi],px=c.xs[bi],py=c.ys[bi];
  const xh=el.querySelector('.xh'),dt=el.querySelector('.hv'),tip=el.querySelector('.lct');
  xh.setAttribute('x1',px);xh.setAttribute('x2',px);xh.style.display='';
  dt.setAttribute('cx',px);dt.setAttribute('cy',py);dt.style.display='';
  tip.innerHTML='';
  const b=document.createElement('b');b.textContent=fmtW(p.v)+(c.unit?' '+c.unit:'');
  const s=document.createElement('span');s.textContent=new Date(p.d+'T00:00').toLocaleDateString(localeOf(),{day:'2-digit',month:'short',year:'numeric'});
  tip.appendChild(b);tip.appendChild(s);tip.style.display='';
  const w=tip.offsetWidth,left=Math.min(Math.max(px/c.W*r.width-w/2,0),r.width-w);
  tip.style.left=left+'px';
}
function lcLeave(id){const el=$('lc_'+id);if(!el)return;
  el.querySelector('.xh').style.display='none';el.querySelector('.hv').style.display='none';el.querySelector('.lct').style.display='none'}

function exerciseSeries(id){
  const by={};
  HISTORY.forEach(h=>(h.items||[]).forEach(it=>{
    if(it.id!==id)return;
    const vals=(it.sw||[]).filter(v=>v!=null),best=vals.length?Math.max(...vals):it.w;

function csvParse(text){
  text=String(text||'').replace(/^﻿/,'');
  const first=text.split(/\r?\n/,1)[0]||'';
  const cnt=ch=>(first.match(new RegExp(ch==='\t'?'\\t':'\\'+ch,'g'))||[]).length;
  const delim=cnt('\t')>cnt(',')&&cnt('\t')>cnt(';')?'\t':cnt(';')>cnt(',')?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===delim){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);if(row.length>1||row[0]!=='')rows.push(row)}
  return rows;
}

function impIndex(){

  });

  return _IMPIDX={m,fz,tok};
}
function impMatch(name){
  const I=impIndex(),n=impNorm(name);if(!n)return null;
  if(I.m[n])return I.m[n];
  const nb=impNorm(String(name).replace(/\([^)]*\)/g,' '));
  if(nb&&I.m[nb])return I.m[nb];
  const tk=I.tok(name);if(tk.length<2)return null;
  let best=null,bs=0;
  I.fz.forEach(([ft,id])=>{
    const a=new Set(tk),b=new Set(ft);let inter=0;a.forEach(w=>{if(b.has(w))inter++});
    const sc=inter/(a.size+b.size-inter);
    if(sc>bs){bs=sc;best=id}});
  return bs>=.75?best:null;
}

function impParse(text,defUnit){
  const rows=csvParse(text);
  if(rows.length<2)throw new Error('vazio');
  const C=impCols(rows[0]);
  if(C.exercise==null||C.date==null)throw new Error('cols');
  const W={},order=[];let nsets=0;
  for(let r=1;r<rows.length;r++){
    const row=rows[r],name=(row[C.exercise]||'').trim(),date=impDate(row[C.date]);
    if(!name||!date)continue;
    if(C.setType!=null&&/warm/i.test(row[C.setType]||''))continue;
    const wn=C.workout!=null?(row[C.workout]||'').trim():'';
    const key=date+'|'+wn;
    if(!W[key]){W[key]={date,label:wn||'',ex:{},eo:[]};order.push(key)}
    const w=W[key];
    if(!w.ex[name]){w.ex[name]={name,cat:C.category!=null?row[C.category]:'',sets:[]};w.eo.push(name)}
    let kg=null;
    const num=v=>{const x=parseFloat(String(v||'').replace(',','.'));return isNaN(x)?null:x};
    if(C.wkg!=null&&num(row[C.wkg])>0)kg=num(row[C.wkg]);
    else if(C.wlb!=null&&num(row[C.wlb])>0)kg=num(row[C.wlb])*0.45359237;
    else if(C.w!=null&&num(row[C.w])>0){
      const u=C.wunit!=null?(row[C.wunit]||'').toLowerCase():defUnit;
      kg=/lb/.test(u||defUnit)?num(row[C.w])*0.45359237:num(row[C.w]);
    }
    let sec=C.secs!=null?num(row[C.secs]):null;
    if(!(sec>0)&&C.time!=null){const tm=/^(\d+):(\d{2})(?::(\d{2}))?$/.exec((row[C.time]||'').trim());if(tm)sec=tm[3]!=null?(+tm[1])*3600+(+tm[2])*60+(+tm[3]):(+tm[1])*60+(+tm[2])}
    w.ex[name].sets.push({kg:kg!=null?Math.round(kg*10)/10:null,reps:C.reps!=null?num(row[C.reps]):null,secs:sec});
    nsets++;
  }
  return {W,order,nsets};
}

  keys.forEach((k,ki)=>{
    const w=P.W[k],items=[],weights={};let done=0;
    w.eo.forEach(name=>{
      const x=w.ex[name];let id=impMatch(name);
      if(!id){
        id='imp_'+impNorm(name).replace(/ /g,'_').slice(0,40);
        if(!E[id]){const grp=impGroupGuess(name,x.cat),cardio=grp==='cardio';
          const entry={name,fig:'custom',grp:cardio?'cardio':grp,mus:GRP_LABEL[cardio?'cardio':grp]||'',cat:cardio?'cardio':'iso',bw:false,w:cardio?0:20,sets:3,reps:'8–12',rest:60,yt:name+' exercise form',steps:[],g:'',b:'',custom:true,alts:[]};
          CUSTOM_EX[id]=entry;E[id]=entry;_IMPIDX=null}
      }
      const e=E[id],isMin=e.unit==='min',s=x.sets;
      const sw=(e.bw||isMin)?null:s.map(z=>z.kg);
      const wv=sw?sw.filter(v=>v!=null):[];
      const top=wv.length?Math.max(...wv):null;
      if(top!=null)weights[id]=Math.max(weights[id]||0,top);
      done+=s.length;
      items.push({id,n:name,s:s.length,t:s.length,w:isMin?Math.round(s.reduce((a,z)=>a+(z.secs||0),0)/60)||null:top,sw:wv.length?sw:null,seat:null});
    });
    const h={date:w.date,workout:'I',label:w.label||t('importado'),done,tot:done,weights,items,kcal:0,ts:(new Date(w.date+'T12:00').getTime())+ki+n,ik:k,src:'import'};
    h.kcal=recomputeKcal(h);
    HISTORY.push(h);n++;
  });
  HISTORY.sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:(b.ts||0)-(a.ts||0));
  save('iron_history',HISTORY);save('iron_customex',CUSTOM_EX);cloudSync();
  IMPSTATE=null;boxClose();render();toast(t('importok').replace('{w}',n));
}

/* =================== EXPORTAÇÃO (Excel / PDF) =================== */
async function ensureXLSX(){if(!window.XLSX)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js')}
async function ensurePDF(){
  if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  if(!(window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API.autoTable))await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js');
}
function vidName(vid){
  if(E[vid])return exName(vid);
  for(const k in PROGRAM){for(const ex of PROGRAM[k].ex){
    if(ex.id===vid)return exName(vid,ex.name);
    if(ex.alts){const a=ex.alts.find(x=>x.id===vid);if(a)return exName(vid,a.name)}
  }}
  return vid;
}
function fmtBR(iso){const d=new Date(iso+'T00:00');return d.toLocaleDateString(localeOf())}
const decX=v=>LANG==='en'?String(v):String(v).replace('.',',');
async function exportXLSX(){
  if(!HISTORY.length){toast(t('semtreinosyet'));return}
  toast(t('gerandoexcel'));
  try{await ensureXLSX()}catch(e){toast(t('precisainternet'));return}
  const s1=[[t('xData'),t('trein'),t('xNome'),t('xSeriesFeitas'),t('xSeriesTotais'),t('xConclusao')]];
  [...HISTORY].reverse().forEach(h=>s1.push([fmtBR(h.date),h.workout,hLabel(h),h.done,h.tot,Math.round(h.done/h.tot*100)+'%']));
  const s2=[[t('xData'),t('trein'),t('xExercicio'),t('xCarga'),t('xUnidade')]];
  [...HISTORY].reverse().forEach(h=>{
    if(h.items&&h.items.length){h.items.forEach(it=>{
      const u=unitOf(it.id);
      (it.sw&&it.sw.length?it.sw.filter(v=>v!=null):(it.w!=null?[it.w]:[])).forEach(w=>s2.push([fmtBR(h.date),h.workout,exName(it.id,it.n),w,u]));
    })}
    else if(h.weights){Object.entries(h.weights).forEach(([vid,w])=>s2.push([fmtBR(h.date),h.workout,vidName(vid),w,unitOf(vid)]))}
  });
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.aoa_to_sheet(s1);ws1['!cols']=[{wch:12},{wch:7},{wch:16},{wch:13},{wch:13},{wch:11}];
  const ws2=XLSX.utils.aoa_to_sheet(s2);ws2['!cols']=[{wch:12},{wch:7},{wch:30},{wch:16},{wch:9}];
  XLSX.utils.book_append_sheet(wb,ws1,t('xSessoes'));
  XLSX.utils.book_append_sheet(wb,ws2,t('xCargas'));
  XLSX.writeFile(wb,t('xFile')+todayISO()+'.xlsx');
  toast(t('excelgerado'));
}
async function exportPDF(){
  if(!HISTORY.length){toast(t('semtreinosyet'));return}
  toast(t('gerandopdf'));
  try{await ensurePDF()}catch(e){toast(t('precisainternet'));return}
  const {jsPDF}=window.jspdf;const doc=new jsPDF();
  doc.setFontSize(18);doc.setTextColor(20);doc.text(t('pdfTitulo'),14,18);
  doc.setFontSize(10);doc.setTextColor(120);
  doc.text(((SETUP&&SETUP.name)?SETUP.name:'IRON')+' · '+t('pdfGerado')+' '+new Date().toLocaleDateString(localeOf()),14,25);
  doc.autoTable({startY:32,
    head:[[t('xData'),t('trein'),t('xSeries'),t('xConclusao')]],
    body:[...HISTORY].reverse().map(h=>[fmtBR(h.date),h.workout+' · '+hLabel(h),h.done+'/'+h.tot,Math.round(h.done/h.tot*100)+'%']),
    headStyles:{fillColor:[245,179,1],textColor:[24,24,24],fontStyle:'bold'},
    styles:{fontSize:9},alternateRowStyles:{fillColor:[246,247,249]}});
  const rows=[];
  [...HISTORY].reverse().forEach(h=>{
    if(h.items&&h.items.length){h.items.forEach(it=>{
      const u=unitOf(it.id);
      const vals=(it.sw&&it.sw.length?it.sw.filter(v=>v!=null):(it.w!=null?[it.w]:[]));
      if(vals.length)rows.push([fmtBR(h.date),h.workout,exName(it.id,it.n),vals.map(decX).join(' · ')+' '+u]);
    })}
    else if(h.weights){Object.entries(h.weights).forEach(([vid,w])=>rows.push([fmtBR(h.date),h.workout,vidName(vid),decX(w)+' '+unitOf(vid)]))}
  });
  if(rows.length){
    doc.setFontSize(13);doc.setTextColor(20);
    const y=doc.lastAutoTable.finalY+12;
    doc.text(t('pdfCargas'),14,y);
    doc.autoTable({startY:y+4,
      head:[[t('xData'),t('trein'),t('xExercicio'),t('xCarga')]],body:rows,
      headStyles:{fillColor:[24,24,24]},styles:{fontSize:8.5},
      alternateRowStyles:{fillColor:[246,247,249]}});
  }
  doc.save(t('xFile')+todayISO()+'.pdf');
  toast(t('pdfgerado'));
}

/* =================== INIT =================== */
const APP_VERSION='iron-v22';
/* atualização automática: confere versão nova ao abrir, ao voltar pro app e a cada 1h; aplica sozinha
   (se houver treino em andamento, espera o app ir pro segundo plano pra não interromper) */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  let hadCtl=!!navigator.serviceWorker.controller;
  let swReg=null,swReloaded=false,reloadPending=false;
  /* treino em andamento = alguma série marcada ou o timer de descanso rodando */
  const sessionBusy=()=>{try{return !!(TMR&&TMR.end>Date.now())||Object.values(SESSION||{}).some(day=>day&&Object.values(day).some(arr=>Array.isArray(arr)&&arr.some(x=>x&&x.d)))}catch(e){return false}};
  const applyReload=()=>{if(swReloaded)return;swReloaded=true;window.location.reload()};
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    swReg=reg;
    reg.update();
    setInterval(()=>reg.update(),60*60*1000);
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;if(!nw)return;
      nw.addEventListener('statechange',()=>{if(nw.state==='activated'&&hadCtl)toast(t('atualizado'))});
    });
  }).catch(()=>{});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){if(reloadPending)applyReload()}
    else if(swReg)swReg.update().catch(()=>{});
  });
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadCtl){hadCtl=true;return}              /* primeira instalação: só passa a controlar, não recarrega */
    if(swReloaded)return;
    if(sessionBusy()){reloadPending=true;toast(t('atualizacaopronta'))}
    else applyReload();
  });
}
document.querySelector('.datebox').addEventListener('click',e=>{
  if(e.target.id==='date')return;
  const d=$('date');try{d.showPicker()}catch(_){d.focus()}
});
$('date').value=todayISO();
ensureProgram();
applyTheme();
render();
sbInit();
