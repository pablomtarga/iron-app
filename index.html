<style>
/* ============ TOKENS (Apple HIG) ============ */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#F2F2F7; --elev:#FFFFFF;
  --sep:rgba(60,60,67,.20); --sep-strong:rgba(60,60,67,.34);
  --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.34);
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.20);
  --chrome:rgba(242,242,247,.82);
  --viz1:#1C1C1E; --viz2:#0A0A0C;
  --green:#248A3D; --red:#D70015; --warn:#B25000;
  --accent:#E5A500; --accent-ink:#FFFFFF; --accent-text:#8A6200; --accent-soft:rgba(229,165,0,.14);
  --shadow-1:0 .5px 1px rgba(0,0,0,.05),0 2px 6px -2px rgba(0,0,0,.08);
  --shadow-2:0 8px 30px -8px rgba(0,0,0,.18);
  --r-s:10px; --r-m:14px; --r-l:18px; --r-xl:26px;
  --sp:16px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
html[data-theme=dark]{
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --elev:#2C2C2E;
  --sep:rgba(84,84,88,.55); --sep-strong:rgba(84,84,88,.75);
  --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.32);
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --chrome:rgba(20,20,22,.80);
  --green:#30D158; --red:#FF453A; --warn:#FF9F0A;
  --accent:#FFD426; --accent-ink:#1A1A1A; --accent-text:#FFD426; --accent-soft:rgba(255,212,38,.16);
  --shadow-1:0 .5px 1px rgba(0,0,0,.4),0 4px 14px -4px rgba(0,0,0,.5);
  --shadow-2:0 10px 34px -8px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;letter-spacing:0;
  overflow-x:hidden;padding-bottom:104px;
  transition:background .35s var(--ease),color .35s var(--ease);
  -webkit-font-smoothing:antialiased;
}
body.tmron{padding-top:72px}
.wrap{position:relative;z-index:2;max-width:560px;margin:0 auto}
button,input,a{font-family:inherit}
:where(button,a,[onclick]):active{transform:scale(.97)}
:where(button,a,[onclick]){transition:transform 110ms ease-out,background-color 160ms var(--ease),border-color 160ms var(--ease),color 160ms var(--ease)}
:where(button,a,input,[onclick]):focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ============ HEADER ============ */
header{padding:calc(10px + env(safe-area-inset-top)) var(--sp) 2px}
.htop{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:38px}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer;min-width:0;flex:1}
.brand>div{min-width:0}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-1)}
.brand .logo svg{width:17px;height:17px}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{display:block;color:var(--label2);font-size:11px;font-weight:500;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.hbtns{display:flex;gap:8px;align-items:center}
.thm{width:34px;height:34px;border-radius:50%;border:none;background:var(--fill);
  color:var(--label);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.datebox{background:var(--fill);border:none;border-radius:var(--r-s);padding:5px 9px;text-align:right}
.datebox label{display:block;font-size:10px;color:var(--label3);font-weight:600;letter-spacing:0}
.datebox input{background:none;border:none;color:var(--label);font-weight:600;font-size:13px;
  text-align:right;width:104px;color-scheme:light}
html[data-theme=dark] .datebox input{color-scheme:dark}
.hello{margin-top:10px;font-size:clamp(28px,8.4vw,34px);font-weight:700;line-height:1.06;letter-spacing:-.022em}
.hello em{font-style:normal;color:var(--label)}
.quote{color:var(--label2);font-size:15px;font-weight:400;margin-top:2px;letter-spacing:-.01em}

/* ============ ALERTA ============ */
.alertc{margin:14px var(--sp) 0;background:var(--surface);border-radius:var(--r-m);
  padding:14px;box-shadow:var(--shadow-1);border-left:3px solid var(--warn)}
.alertc+.alertc{margin-top:10px}
.alertc .atop{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;
  letter-spacing:-.01em;color:var(--warn);margin-bottom:3px}
.alertc p{font-size:14px;line-height:1.42;color:var(--label2);margin-bottom:12px;letter-spacing:-.005em}
.alertc p b{color:var(--label);font-weight:600}
.alertc .abtns{display:flex;gap:8px}
.alertc .abtns button{flex:1;border:none;background:var(--fill);color:var(--label);
  border-radius:var(--r-s);padding:10px 8px;font-weight:600;font-size:14px;cursor:pointer;letter-spacing:-.01em}
.alertc .abtns button.pri{background:var(--warn);color:#fff}
.alertc .abtns button.ghost{flex:0 0 auto;color:var(--label2);background:none}

/* ============ ÚLTIMO TREINO ============ */
.lastcard{margin:14px var(--sp) 0;background:var(--surface);border-radius:var(--r-m);
  box-shadow:var(--shadow-1);overflow:hidden}
.lastcard .lhead{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;width:100%;
  background:none;border:none;text-align:left;color:var(--label)}
.lastcard .lbadge{flex:0 0 34px;height:34px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:16px;font-weight:700;color:#1A1A1A;letter-spacing:-.01em}
.lastcard .ltx{flex:1;min-width:0}
.lastcard .ltx .lk{display:block;font-size:11px;color:var(--label3);font-weight:600;letter-spacing:.01em}
.lastcard .ltx b{display:block;font-size:16px;font-weight:600;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.lastcard .ltx small{color:var(--label2);font-size:13px}
.lastcard .ldone{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;
  border-radius:999px;margin-top:3px;letter-spacing:-.005em}
.lastcard .ldone.full{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.lastcard .ldone.part{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.lastcard .lcv{color:var(--label3);font-size:12px;transition:transform .3s var(--ease)}
.lastcard .lhead.op .lcv{transform:rotate(180deg)}
.lastcard .lbody{max-height:0;overflow:hidden;transition:max-height .42s var(--ease)}
.lastcard .lbody.op{max-height:1400px}
.lastcard .lbody-i{padding:2px 14px 8px}
.lastcard .lrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:9px 0;border-top:.5px solid var(--sep)}
.lastcard .lrow span{font-size:15px;font-weight:400;letter-spacing:-.01em;min-width:0}
.lastcard .lrow small{color:var(--label2);font-size:13px;white-space:nowrap;text-align:right}

/* ============ SEGMENTED CONTROL (A/B/C) ============ */
.tabsbar{position:sticky;top:0;z-index:30;padding:12px var(--sp) 8px;background:var(--bg)}
.tabsbar::after{content:'';position:absolute;left:0;right:0;top:100%;height:16px;pointer-events:none;
  background:linear-gradient(var(--bg),transparent)}
.tabs{display:flex;gap:2px;padding:2px;background:var(--fill);border-radius:10px}
.tab{flex:1;border:none;background:none;border-radius:8px;padding:7px 4px;cursor:pointer;
  transition:background-color .22s var(--ease),box-shadow .22s var(--ease),transform 110ms ease-out}
.tab .ltr{font-size:15px;font-weight:600;line-height:1.1;color:var(--label2);letter-spacing:-.01em}
.tab .nm{font-size:11px;font-weight:500;color:var(--label3);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--tc,var(--surface));box-shadow:0 .5px 2px rgba(0,0,0,.14),0 3px 10px -4px rgba(0,0,0,.20)}
.tab.on .ltr{color:var(--tci,var(--label))}
.tab.on .nm{color:var(--tci,var(--label2));opacity:.78}

/* ============ PROGRESSO DO TREINO ============ */
.prog{margin:0 var(--sp) 10px;background:var(--surface);border-radius:var(--r-m);
  padding:13px 14px;box-shadow:var(--shadow-1)}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.prog .row .l{font-size:13px;color:var(--label2);font-weight:500;letter-spacing:-.005em}
.prog .row .r{font-size:15px;font-weight:600;letter-spacing:-.01em}
.prog .row .r em{font-style:normal;color:var(--accent-text)}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--accent);
  transition:width .5s var(--ease)}
.dintro{margin:0 var(--sp) 12px;color:var(--label2);font-size:14px;line-height:1.45;letter-spacing:-.005em}

/* ============ POR QUE ESSA ORDEM ============ */
.order{margin:0 var(--sp) 12px;background:var(--surface);border-radius:var(--r-m);
  box-shadow:var(--shadow-1);overflow:hidden}
.order>button{width:100%;background:none;border:none;color:var(--label);font-weight:500;font-size:15px;
  padding:13px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left;letter-spacing:-.01em}
.order>button .cv{margin-left:auto;color:var(--label3);font-size:12px;transition:transform .3s var(--ease)}
.order>button.op .cv{transform:rotate(180deg)}
.order .bd{max-height:0;overflow:hidden;transition:max-height .45s var(--ease)}
.order .bd.op{max-height:1600px}
.order .bd-i{padding:0 14px 10px}
.order .oi{display:flex;gap:11px;padding:10px 0;border-top:.5px solid var(--sep)}
.order .oi .n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);
  font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.order .oi .tx b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.order .oi .tx span{font-size:13.5px;color:var(--label2);line-height:1.4}

/* ============ EDITAR ============ */
.editrow{margin:0 var(--sp) 10px;display:flex;justify-content:flex-end}
.editbtn{border:none;background:none;color:var(--accent-text);border-radius:999px;
  padding:6px 10px;font-weight:500;font-size:14.5px;cursor:pointer;letter-spacing:-.01em}
.editbtn.on{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:8px 14px}
.ebar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px 0;align-items:center}
.dhandle{flex:0 0 34px;height:34px;border-radius:9px;border:none;background:var(--fill);color:var(--label2);
  font-size:15px;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center}
.card.dragging{z-index:40;position:relative;box-shadow:var(--shadow-2);transform:scale(1.02);
  opacity:.96;cursor:grabbing;transition:none}
.card.shifted{transition:transform .22s var(--ease)}
.list.dragmode .card:not(.dragging){pointer-events:none}
.ebtn{border:none;background:var(--fill);color:var(--label);border-radius:9px;
  padding:9px 12px;font-weight:500;font-size:14px;cursor:pointer;letter-spacing:-.01em}
.ebtn:disabled{opacity:.32;cursor:default}
.ebtn.wide{flex:1}
.ebtn.danger{color:var(--red)}
.ebtn.combo{color:var(--accent-text)}
.ebtn.combo.on{background:var(--accent);color:var(--accent-ink)}

/* ============ CARD DE EXERCÍCIO ============ */
.list{padding:0 var(--sp) 4px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--shadow-1);
  opacity:0;transform:translateY(10px);animation:rise .42s var(--ease) forwards}
.card.done{box-shadow:var(--shadow-1),0 0 0 1.5px var(--accent)}
@keyframes rise{to{opacity:1;transform:none}}
.ssband{height:2.5px;background:var(--accent);opacity:.55}
.ctop{display:flex;gap:13px;padding:14px 14px 10px}
.viz{flex:0 0 86px;width:86px;height:86px;border-radius:var(--r-m);
  background:linear-gradient(165deg,var(--viz1),var(--viz2));overflow:hidden}
.viz svg{width:100%;height:100%}
.cinfo{flex:1;min-width:0}
.cidx{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cidx .n{font-size:12px;color:var(--label3);font-weight:600}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;letter-spacing:-.005em}
.badge.ss{background:var(--accent-soft);color:var(--accent-text)}
.cname{font-size:19px;font-weight:600;line-height:1.18;margin:2px 0 7px;letter-spacing:-.018em}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--label2)}
.chip b{color:var(--accent-text);font-weight:600}
.vars{display:flex;gap:7px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.vars::-webkit-scrollbar{display:none}
.vars{mask-image:linear-gradient(90deg,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.vlab{flex:0 0 auto;font-size:12px;color:var(--label3);align-self:center;padding-right:2px}
.vchip{flex:0 0 auto;border:none;background:var(--fill);color:var(--label2);
  font-weight:500;font-size:13.5px;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;letter-spacing:-.01em}
.vchip.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.wtlab{padding:2px 16px 4px;font-size:12px;color:var(--label3)}
.wtlab span{opacity:.75}
.wt{display:flex;align-items:stretch;gap:8px;padding:0 14px 6px}
.wt .stp{display:flex;align-items:center;background:var(--fill);border-radius:var(--r-s);overflow:hidden;flex:1}
.wt .stp button{width:44px;border:none;background:none;color:var(--accent-text);font-size:20px;
  font-weight:500;cursor:pointer;padding:10px 0}
.wt .stp .val{flex:1;text-align:center;cursor:text}
.wt .stp .val .num{font-size:22px;font-weight:600;letter-spacing:-.02em}
.wt .stp .val .u{font-size:12px;color:var(--label2);font-weight:500;margin-left:2px}
.wt .stp .val input{width:74px;background:var(--surface);border:1.5px solid var(--accent);border-radius:8px;
  color:var(--label);font-size:19px;font-weight:600;text-align:center;padding:2px}
.wt .rest{flex:0 0 auto;background:var(--fill);border-radius:var(--r-s);padding:0 13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-width:60px}
.wt .rest .t{font-size:15px;font-weight:600;color:var(--accent-text);letter-spacing:-.01em}
.wt .rest .lb{font-size:10.5px;color:var(--label3);font-weight:500}
.prev{margin:4px 16px 0;font-size:12.5px;color:var(--label3)}
.prev b{color:var(--accent-text);font-weight:600}
.lastw{padding:4px 16px 0;font-size:12.5px;color:var(--label3)}

/* séries */
.sets{padding:8px 14px 12px}
.sets .lab{font-size:12.5px;color:var(--label3);margin-bottom:8px;display:flex;justify-content:space-between}
.sets .lab span:last-child{color:var(--accent-text);font-weight:600}
.srows{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:var(--r-s);
  padding:4px 6px;transition:background-color .2s var(--ease)}
.srow.done{background:var(--accent-soft)}
.snum{flex:0 0 20px;height:20px;border-radius:50%;background:var(--surface);
  color:var(--label3);font-weight:600;font-size:11.5px;display:flex;align-items:center;justify-content:center}
.srow.done .snum{background:var(--accent);color:var(--accent-ink)}
.sstep{flex:0 0 30px;height:30px;border-radius:8px;border:none;background:var(--surface);
  color:var(--accent-text);font-size:17px;font-weight:500;line-height:1;cursor:pointer;padding:0;box-shadow:var(--shadow-1)}
.scell{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.swt{text-align:center;cursor:text;font-size:17px;font-weight:600;line-height:1.15;letter-spacing:-.015em}
.swt .u{font-size:11px;color:var(--label2);font-weight:500;margin-left:2px}
.swt.bwlab{font-size:13px;color:var(--label2);font-weight:500;cursor:default;letter-spacing:-.005em}
.swt input{width:64px;background:var(--surface);border:1.5px solid var(--accent);border-radius:7px;
  color:var(--label);font-size:16px;font-weight:600;text-align:center;padding:1px}
.sant{font-size:11px;color:var(--label3);line-height:1.1}
.schk{flex:0 0 32px;height:32px;border-radius:50%;border:1.5px solid var(--sep-strong);background:var(--surface);
  color:var(--label3);font-size:14px;cursor:pointer;padding:0}
.schk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.schk,.sstep{position:relative}
.schk::after{content:"";position:absolute;inset:-6px}
.sstep::after{content:"";position:absolute;inset:-7px -4px}
.datebox{cursor:pointer}

.drnote{margin:0 14px 10px;background:var(--fill);border-radius:var(--r-s);padding:10px 12px;display:flex;gap:9px}
.drnote .ic{flex:0 0 auto;font-size:14px}
.drnote p{font-size:13px;line-height:1.42;color:var(--label2);letter-spacing:-.005em}
.acts{display:flex;gap:8px;padding:0 14px 14px}
.abtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:none;
  background:var(--fill);border-radius:var(--r-s);padding:11px;color:var(--label);
  font-weight:500;font-size:14.5px;cursor:pointer;text-decoration:none;letter-spacing:-.01em}
.abtn.vid{background:var(--accent);color:var(--accent-ink);font-weight:600}
.abtn .cv{color:inherit;font-size:11px;transition:transform .3s var(--ease)}
.abtn.op .cv{transform:rotate(180deg)}
.how{max-height:0;overflow:hidden;transition:max-height .42s var(--ease);margin:0 14px}
.how.op{max-height:900px;margin-bottom:14px}
.how-i{padding:2px 0 4px;border-top:.5px solid var(--sep)}
.frames{display:flex;gap:8px;margin:12px 0 4px}
.frm{flex:1;text-align:center}
.frz{border-radius:var(--r-s);background:linear-gradient(165deg,var(--viz1),var(--viz2));
  overflow:hidden;aspect-ratio:1.2/1}
.frz svg{width:100%;height:100%}
.frz img{width:100%;height:100%;object-fit:cover;display:block}
.frz.photo{background:var(--fill)}
.fcredit{font-size:10.5px;color:var(--label3);text-align:center;margin-top:8px;line-height:1.35}
.frz.f0 svg *,.frz.f1 svg *{animation-play-state:paused!important;animation-duration:2s!important}
.frz.f0 svg *{animation-delay:0s!important}
.frz.f1 svg *{animation-delay:-1s!important}
.frm span{display:block;font-size:11px;color:var(--label3);margin-top:5px}
.how ol{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:9px;margin:12px 0}
.how ol li{counter-increment:s;position:relative;padding-left:28px;font-size:15px;line-height:1.42;
  color:var(--label);letter-spacing:-.01em}
.how ol li::before{content:counter(s);position:absolute;left:0;top:1px;width:20px;height:20px;
  border-radius:50%;background:var(--accent-soft);color:var(--accent-text);font-weight:600;font-size:12px;
  display:flex;align-items:center;justify-content:center}
.cue{display:flex;gap:8px;font-size:14px;line-height:1.4;padding:9px 0;border-top:.5px solid var(--sep);letter-spacing:-.005em}
.cue.g{color:var(--green)}.cue.b{color:var(--red)}
.cue b{font-weight:600}
.fin{margin:16px var(--sp) 4px}
.fin button{width:100%;border:none;border-radius:var(--r-m);padding:16px;font-size:17px;font-weight:600;
  cursor:pointer;background:var(--fill);color:var(--label2);letter-spacing:-.015em}
.fin button.ready{background:var(--accent);color:var(--accent-ink)}

/* ============ PROGRESSO ============ */
.pv{padding:4px var(--sp) 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:none;border-radius:var(--r-m);padding:13px 8px;text-align:center;
  box-shadow:var(--shadow-1);cursor:pointer;width:100%}
.stat .v{font-size:26px;font-weight:700;line-height:1.05;color:var(--accent-text);letter-spacing:-.02em}
.stat .k{font-size:11.5px;color:var(--label2);margin-top:3px;letter-spacing:-.005em;line-height:1.2}
.stat .d{font-size:11px;color:var(--label3);margin-top:2px;line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums}
.week{background:var(--surface);border-radius:var(--r-m);padding:14px 0 12px;margin-bottom:16px;box-shadow:var(--shadow-1)}
.week h4{font-size:13px;color:var(--label2);font-weight:500;margin:0 14px 10px}
.wkscroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wkscroll::-webkit-scrollbar{display:none}
.wkpage{flex:0 0 100%;scroll-snap-align:center;padding:0 14px}
.wklab{font-size:13px;color:var(--label2);font-weight:500;text-align:center;margin-bottom:10px;letter-spacing:-.005em}
.days{display:flex;justify-content:space-between;gap:5px}
.day{flex:1;text-align:center}
.day .ball{width:100%;height:38px;border-radius:10px;background:var(--fill);border:none;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;
  color:var(--label3);cursor:pointer;letter-spacing:-.01em}
.day .ball.hit{background:var(--accent);color:var(--accent-ink)}
.day .ball.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day small{display:block;font-size:11px;color:var(--label3);margin-top:4px}
.wkfoot{margin:10px 14px 0;font-size:12px;color:var(--label3);text-align:center}
.heatgrid{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:11px;gap:3px;overflow-x:auto;padding:2px 14px;scrollbar-width:none}
.heatgrid::-webkit-scrollbar{display:none}
.hcell{width:11px;height:11px;border-radius:3px;background:var(--sep)}
.hcell.empty{background:transparent;padding:0;font-size:0;line-height:0}
.hcell.l1{background:var(--accent);opacity:.35}
.hcell.l2{background:var(--accent);opacity:.55}
.hcell.l3{background:var(--accent);opacity:.78}
.hcell.l4{background:var(--accent);opacity:1}
.hleg{display:inline-flex;align-items:center;gap:2px;vertical-align:middle}
.hleg .hcell{display:inline-block;width:9px;height:9px}
.sectit{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:6px 2px 10px;
  display:flex;justify-content:space-between;align-items:center}
.sectit button{background:var(--fill);border:none;color:var(--label2);border-radius:999px;
  font-size:13px;font-weight:500;padding:6px 12px;cursor:pointer}
.hist{display:flex;flex-direction:column;gap:9px}
.hrow{background:var(--surface);border-radius:var(--r-m);padding:12px 14px;display:flex;align-items:center;
  gap:12px;box-shadow:var(--shadow-1);cursor:pointer}
.hrow .wk{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;flex:0 0 auto;color:#1A1A1A}
.hrow .mid{flex:1;min-width:0}
.hrow .mid b{font-size:15.5px;font-weight:600;letter-spacing:-.015em}
.hrow .mid small{display:block;color:var(--label2);font-size:13px}
.hrow .pct{font-size:15px;font-weight:600;color:var(--accent-text)}
.hrow .hcv{color:var(--label3);font-size:11px;transition:transform .3s var(--ease)}
.hrow.op .hcv{transform:rotate(180deg)}

/* ============ TIMER (material translúcido) ============ */
.tmr{position:fixed;left:var(--sp);right:var(--sp);top:calc(8px + env(safe-area-inset-top));z-index:60;
  background:var(--chrome);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  color:var(--label);border-radius:var(--r-m);padding:11px 14px;display:none;align-items:center;gap:13px;
  box-shadow:var(--shadow-2);max-width:528px;margin:0 auto;border:.5px solid var(--sep)}
.tmr.show{display:flex;animation:matIn .34s var(--ease)}
@keyframes matIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
.tmr .big{font-size:30px;font-weight:700;line-height:1;min-width:78px;color:var(--accent-text);
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tmr .info{flex:1;min-width:0}
.tmr .info b{font-size:15px;font-weight:600;letter-spacing:-.01em}

.tmr .x{width:34px;height:34px;border-radius:50%;border:none;background:var(--fill2);color:var(--label);
  font-size:15px;cursor:pointer}
.tmr .ring{position:absolute;left:0;bottom:0;height:2.5px;background:var(--accent);
  border-radius:2px;transition:width 1s linear}

/* ============ TAB BAR ============ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;gap:0;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));

  border-top:.5px solid var(--sep)}
.nav button{flex:1;max-width:200px;border:none;background:none;padding:5px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--label3)}
.nav button.on{color:var(--accent-text)}
.nav button svg{width:24px;height:24px}
.nav button span{font-size:10.5px;font-weight:500;letter-spacing:0}

/* ============ TOAST / CONFETE ============ */
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(16px);
  background:var(--chrome);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  color:var(--label);font-weight:500;font-size:14.5px;padding:11px 18px;border-radius:999px;z-index:130;
  opacity:0;transition:opacity .28s var(--ease),transform .28s var(--ease);pointer-events:none;
  white-space:nowrap;box-shadow:var(--shadow-2);border:.5px solid var(--sep);letter-spacing:-.01em}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast{max-width:calc(100vw - 32px);width:max-content;white-space:normal;text-align:center;line-height:1.3;border-radius:22px}
.toast.top{bottom:auto!important;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-16px)}
.toast.top.show{transform:translateX(-50%) translateY(0)}
.cfx{position:fixed;inset:0;z-index:80;pointer-events:none;overflow:hidden}
.cf{position:absolute;width:8px;height:12px;top:-20px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}

/* ============ SHEETS / MODAIS ============ */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:75;display:flex;
  align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(3px);

#pickOv{z-index:120}
#boxOv{z-index:118}
#acctOv{z-index:117}
.modal{background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;max-width:560px;width:100%;
  padding:20px var(--sp) calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow-2);

  padding:14px;font-weight:600;font-size:16px;cursor:pointer;letter-spacing:-.015em}

/* ============ ONBOARDING ============ */

  font-weight:500;font-size:14.5px;cursor:pointer;min-height:44px}

.rday .rex .ssb{font-size:11px;color:var(--accent-text);font-weight:600;margin-left:6px}
.ob-lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);right:max(8px,env(safe-area-inset-right,0px));display:flex;z-index:2}

.ob-lang .fl{display:block;width:26px;height:18px;border-radius:3px;overflow:hidden;opacity:.45;box-shadow:0 0 0 1px var(--fill);transition:opacity .15s,transform .15s}

.qb .ob-name{max-width:100%;text-align:left;box-shadow:none;background:var(--fill);margin:0}
.ob h2{font-size:28px;font-weight:700;letter-spacing:-.022em;margin-bottom:4px}
.ob .lead{color:var(--label2);font-size:15px;line-height:1.45;margin-bottom:18px;letter-spacing:-.01em}
.qb{background:var(--surface);border-radius:var(--r-m);padding:15px;margin-bottom:12px;box-shadow:var(--shadow-1)}
.qb h4{font-size:16px;font-weight:600;margin-bottom:2px;letter-spacing:-.015em}
.qb .hint{font-size:13.5px;color:var(--label2);margin-bottom:12px;line-height:1.4}
.qchips{display:flex;flex-wrap:wrap;gap:8px}
.qchip{border:none;background:var(--fill);color:var(--label2);border-radius:999px;padding:9px 15px;
  font-weight:500;font-size:14.5px;cursor:pointer;letter-spacing:-.01em}
.qchip.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tpls{display:flex;flex-direction:column;gap:8px}
.tpl{display:block;width:100%;border:none;text-align:left;background:var(--fill);color:var(--label);border-radius:var(--r-m);
  padding:12px 14px;min-height:44px;cursor:pointer;font:inherit;box-shadow:inset 0 0 0 1.5px transparent}

.tpl small{display:block;color:var(--label2);font-size:12.5px;margin-top:2px}
.tpl.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.tpl .tdesc{margin-top:8px;font-size:13.5px;line-height:1.4;color:var(--label);font-weight:400}
.lvl{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--fill);color:var(--label2);margin-left:8px;vertical-align:1px}
.tpl.on .lvl{background:var(--accent);color:var(--accent-ink)}
.ob-var{width:100%;margin-top:10px}
.week>.wp{padding:0 14px}
.bl-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:2px 0 8px}
.bl-v{font-size:30px;font-weight:700;letter-spacing:-.02em}.bl-u{font-size:15px;color:var(--label2);font-weight:500}
.bl-d{font-size:13px;color:var(--label2);text-align:right}
.bl-in{display:flex;gap:10px;margin:12px 0}.bl-in label{flex:1;font-size:12.5px;color:var(--label2);display:block}

.lct{position:absolute;top:0;left:0;pointer-events:none;background:var(--surface);color:var(--label);border-radius:10px;padding:6px 10px;
  box-shadow:var(--shadow-1),0 0 0 .5px var(--sep);display:flex;flex-direction:column;font-size:12px;white-space:nowrap;z-index:2}
.lct b{font-size:15px;font-weight:700}.lct span{color:var(--label2)}
.lctab{margin-top:8px;font-size:13px}.lctab summary{cursor:pointer;color:var(--label2);padding:8px 0;min-height:44px;box-sizing:border-box}
.psel{width:100%;margin:6px 0 10px;padding:11px 12px;border-radius:var(--r-m);border:none;background:var(--fill);color:var(--label);font:inherit;font-size:15px}

.bal{display:flex;flex-direction:column;gap:9px}

.bal-msg{margin-top:12px;font-size:13.5px;color:var(--label2);line-height:1.4}.bal-msg b{color:var(--label)}
.wu{margin:8px 0 2px;padding:10px 12px;background:var(--fill);border-radius:var(--r-m);font-size:12.5px;color:var(--label2);line-height:1.4}

.wu .wc{display:inline-block;margin:6px 6px 0 0;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--label);font-weight:600;font-size:12.5px}

.rex .rn{flex:0 0 20px;height:20px;border-radius:50%;background:var(--fill);color:var(--label3);
  font-weight:600;font-size:11.5px;display:flex;align-items:center;justify-content:center}
.rex .rtx{flex:1;min-width:0}
.rex .rtx b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}

  cursor:pointer;font-size:13px}
.radd{width:calc(100% - 28px);margin:11px 14px 13px;border:none;background:var(--fill);color:var(--accent-text);
  border-radius:var(--r-s);padding:11px;font-weight:500;font-size:14.5px;cursor:pointer}

/* ============ ACESSIBILIDADE ============ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.12s!important;scroll-behavior:auto!important}
  .card{opacity:1;transform:none}
  .frz svg *{animation:none!important}
}
@media (prefers-reduced-transparency:reduce){
  .tmr,.nav,.toast{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--surface)}
}
@media (prefers-contrast:more){
  :root{--sep:rgba(60,60,67,.5);--label2:rgba(60,60,67,.85)}
  .card,.lastcard,.stat,.hrow,.tip{box-shadow:var(--shadow-1),0 0 0 1px var(--sep)}
}
/* ============ CALORIAS (gamificado) ============ */
.kcal-hero{margin:0 0 16px;background:linear-gradient(165deg,var(--surface),var(--fill));
  border-radius:var(--r-l);padding:26px 20px 22px;box-shadow:var(--shadow-1);text-align:center;
  position:relative;overflow:hidden}
.kcal-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 0%,rgba(255,180,60,.14),transparent 70%);
  pointer-events:none}
.kcal-ringwrap{position:relative;width:188px;height:188px;margin:0 auto 6px}
.kcal-ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.kcal-ringbg{fill:none;stroke:var(--fill);stroke-width:11}
.kcal-ringfg{fill:none;stroke:url(#kcalGrad);stroke-width:11;stroke-linecap:round;
  transition:stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1)}
.kcal-ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kcal-num{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--label)}

.kcal-sub{font-size:12.5px;color:var(--label2);margin-top:5px;font-weight:500}
.kcal-badge{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:5px 12px;
  border-radius:999px;background:rgba(255,150,30,.14);color:#C2600A;font-size:12px;font-weight:700}
html[data-theme=dark] .kcal-badge{background:rgba(255,170,60,.18);color:#FFB84D}
.kcal-badge.hot{animation:kcalPulse 1.6s infinite ease-in-out}
@keyframes kcalPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

.kcal-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.kcal-stat{background:var(--surface);border-radius:var(--r-m);padding:12px 6px;text-align:center;
  box-shadow:var(--shadow-1)}
.kcal-stat .v{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--label);
  font-variant-numeric:tabular-nums}
.kcal-stat .k{font-size:10px;color:var(--label3);margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}

.kcal-panel{background:var(--surface);border-radius:var(--r-l);padding:18px;margin-bottom:14px;
  box-shadow:var(--shadow-1);position:relative;overflow:hidden}
.kcal-ptitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.kcal-ptitle h4{font-size:15px;font-weight:700;letter-spacing:-.01em}
.kcal-ptitle button{background:var(--fill);border:none;color:var(--label2);border-radius:999px;
  font-size:11px;font-weight:600;padding:5px 10px;cursor:pointer}

/* moedas */
.coinrow{display:flex;align-items:center;gap:14px}
.coin-ic{flex:0 0 auto;width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFEB99,#F5B301 55%,#B87700 100%);
  display:flex;align-items:center;justify-content:center;font-size:24px;
  box-shadow:0 2px 0 #8A5A00,0 6px 14px -4px rgba(184,119,0,.55);
  position:relative;animation:coinFloat 2.6s infinite ease-in-out}
.coin-ic::after{content:'';position:absolute;top:8%;left:18%;width:26%;height:26%;border-radius:50%;
  background:rgba(255,255,255,.55);filter:blur(1px)}
@keyframes coinFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
.coininfo{flex:1;min-width:0}
.coin-num{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  color:var(--label);display:flex;align-items:baseline;gap:5px}
.coin-num small{font-size:12px;color:var(--label3);font-weight:600}
.coin-hint{font-size:12px;color:var(--label2);margin-top:2px}

/* barra de progresso pra próxima cruz */
.crossbar-wrap{margin-top:14px}
.crossbar{height:12px;border-radius:7px;background:var(--fill);overflow:hidden;position:relative}
.crossbar i{display:block;height:100%;border-radius:7px;width:0%;
  background:linear-gradient(90deg,#3FCB6B,#22A555);
  transition:width 1s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.crossbar i::after{content:'';position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 48%,transparent 66%);
  background-size:220% 100%;animation:shimmerMove 2.2s infinite linear}
@keyframes shimmerMove{0%{background-position:140% 0}100%{background-position:-40% 0}}
.crossbar-lab{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;
  color:var(--label3);font-weight:600;font-variant-numeric:tabular-nums}

/* cruzes conquistadas */
.crossgrid{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.crossitem{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:21px;background:linear-gradient(160deg,#3FCB6B,#1C8A46);color:#fff;
  box-shadow:0 2px 0 #0F5C2C,0 5px 12px -4px rgba(28,138,70,.55);
  animation:crossPop .5s cubic-bezier(.24,1.4,.4,1) backwards}
.crossitem.next{background:var(--fill);color:var(--label3);box-shadow:none;
  border:1.5px dashed var(--sep-strong);position:relative;animation:none}
.crossitem.next .cxfill{position:absolute;inset:0;border-radius:11px;overflow:hidden}
.crossitem.next .cxfill i{position:absolute;left:0;bottom:0;width:100%;height:0%;
  background:linear-gradient(0deg,#3FCB6B,#6EE499);transition:height .9s cubic-bezier(.16,1,.3,1)}
.crossitem.next span{position:relative;z-index:2}
@keyframes crossPop{0%{transform:scale(0) rotate(-25deg);opacity:0}70%{transform:scale(1.18) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.cross-empty{font-size:12.5px;color:var(--label3);padding:6px 2px;line-height:1.5}

/* burst de conquista (cruz nova) */
.kcal-burst{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0}
.kcal-burst.show{opacity:1;animation:burstFade 1.9s ease forwards}
@keyframes burstFade{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0}}
.kcal-burst .bx{width:120px;height:120px;border-radius:32px;display:flex;align-items:center;justify-content:center;
  font-size:56px;color:#fff;background:linear-gradient(160deg,#3FCB6B,#1C8A46);
  box-shadow:0 8px 0 #0F5C2C,0 20px 50px -10px rgba(28,138,70,.6);
  animation:burstPop 1.9s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes burstPop{0%{transform:scale(.2) rotate(-40deg)}45%{transform:scale(1.22) rotate(8deg)}62%{transform:scale(1) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}
.kcal-burst .blab{position:absolute;margin-top:150px;font-size:16px;font-weight:800;color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.4);white-space:nowrap}

/* peso corporal editável */
.bodykg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--fill);border-radius:var(--r-m);padding:12px 14px;margin-bottom:14px;cursor:pointer}
.bodykg-row .l{font-size:13px;color:var(--label2);font-weight:600}
.bodykg-row .v{font-size:15px;font-weight:800;color:var(--label)}
.bodykg-row .v span{color:var(--label3);font-weight:600;font-size:12px}

/* moedas voadoras */
.coinfly{position:fixed;z-index:96;pointer-events:none;font-size:20px;
  animation:coinFly 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes coinFly{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-10px) scale(1.15)}
  100%{transform:translateY(-130px) scale(.7);opacity:0}}

@media (prefers-reduced-motion:reduce){
  .coin-ic,.crossbar i::after,.kcal-badge.hot,.crossitem{animation:none!important}
}
.hidden{display:none!important}

/* =====================================================================
   REMODELAGEM v16: amarelo + cinza escuro fixos, cor do dia só na barra metálica
   ===================================================================== */
:root{
  --m1:#8A6A00;--m2:#FFD426;--m3:#FFF3B0;
  --metal:linear-gradient(90deg,var(--m1) 0%,var(--m2) 24%,var(--m3) 50%,var(--m2) 76%,var(--m1) 100%);
  --tabs-h:68px;--nav-h:84px;
}
html[data-theme=dark]{--bg:#000;--surface:#1C1C1E;--surface2:#242426;--chrome:rgba(24,24,26,.78)}
body{padding-bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:3px;z-index:200;pointer-events:none;
  background:var(--metal);box-shadow:0 1px 10px -1px var(--m2),inset 0 .5px 0 rgba(255,255,255,.5)}

/* ---- cabeçalho compacto ---- */
header{padding:calc(14px + env(safe-area-inset-top)) var(--sp) 2px}
.thm{width:36px;height:36px;background:var(--fill)}
.thm svg{width:18px;height:18px;display:block}
.hrow2{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:10px}
.hrow2>div:first-child{min-width:0}
.hello{margin-top:0;font-size:clamp(24px,7vw,29px);line-height:1.08}
.quote{font-size:13px;margin-top:3px;line-height:1.3}
.datebox{flex:0 0 auto;padding:4px 8px}
.datebox input{width:96px;font-size:12.5px}
.alertc,.lastcard{margin-top:12px}

/* ---- abas de vidro ---- */
.tabsbar{display:flex;align-items:center;gap:8px;padding:10px var(--sp) 10px;
  background:color-mix(in srgb,var(--bg) 70%,transparent);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  border-bottom:.5px solid var(--sep);margin-top:6px}
.tabsbar::after{display:none}
.tabs{position:relative;flex:1;min-width:0;display:flex;padding:3px;background:var(--fill);border-radius:15px;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabind{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:12px;background:var(--surface);z-index:0;
  box-shadow:0 .5px 2px rgba(0,0,0,.18),0 4px 12px -4px rgba(0,0,0,.3);pointer-events:none}
.tabind.go{transition:transform .38s var(--ease),width .38s var(--ease)}
.tabind::after{content:"";position:absolute;left:14%;right:14%;bottom:3px;height:2.5px;border-radius:2px;
  background:var(--metal);box-shadow:0 0 6px -1px var(--m2)}
.tab{position:relative;z-index:1;flex:1 0 74px;border-radius:12px;padding:7px 4px 8px;background:none!important;box-shadow:none!important;
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46px}
.tab .tl{font-size:15.5px;font-weight:700;line-height:1.1;color:var(--label2);letter-spacing:-.01em;display:flex;align-items:center;gap:5px}
.tab .nm{font-size:10.5px;font-weight:500;color:var(--label3);margin-top:2px;max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on .tl{color:var(--label)}
.tab.on .nm{color:var(--label2)}
.tab .tdot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 0 6px -1px currentColor}
.tab .tpct{position:absolute;top:3px;right:6px;font-size:9.5px;font-weight:700;color:var(--accent-text);letter-spacing:.01em}
.tmini{flex:0 0 auto;height:40px;min-width:40px;padding:0 11px;border-radius:14px;border:none;background:var(--fill);
  color:var(--label2);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;
  font-variant-numeric:tabular-nums;cursor:pointer}
.tmini svg{width:19px;height:19px}
.tmini.run{background:var(--accent);color:var(--accent-ink)}
.dayhair{position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none}
.dayhair i{display:block;height:100%;width:0;background:var(--metal);box-shadow:0 0 8px var(--m2);transition:width .5s var(--ease)}

/* ---- progresso do dia ---- */
.prog{margin-top:12px;padding:11px 14px}
.prog .row{margin-bottom:8px}
.bar{height:5px}
.bar i{background:var(--metal)}
.dintro{font-size:13.5px}

/* ---- cartões ---- */
.list{gap:10px;padding-top:2px}
.card{opacity:1;transform:none;animation:none;border-radius:20px;position:relative;scroll-margin-top:calc(var(--tabs-h) + 10px)}
html[data-theme=dark] .card,html[data-theme=dark] .erow{box-shadow:var(--shadow-1),inset 0 0 0 .5px rgba(255,255,255,.07)}
.list.enter .card,.list.enter .erow{animation:riseIn .42s var(--ease) backwards;animation-delay:calc(var(--i,0)*34ms)}
.list.sR .card,.list.sR .erow{animation:slideInR .36s var(--ease) backwards;animation-delay:calc(var(--i,0)*22ms)}
.list.sL .card,.list.sL .erow{animation:slideInL .36s var(--ease) backwards;animation-delay:calc(var(--i,0)*22ms)}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideInR{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes slideInL{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--metal);opacity:.92;z-index:2;
  box-shadow:0 1px 8px -2px var(--m2)}
.card.done{box-shadow:var(--shadow-1)}
.card.done::before{opacity:.45}
.ssband{display:none}
.card.ss{box-shadow:var(--shadow-1),inset 3px 0 0 var(--accent)}
.chead{display:flex;align-items:center;gap:12px;width:100%;padding:15px 12px 13px 12px;background:none;border:none;
  color:inherit;text-align:left;cursor:pointer;font:inherit}
.thumb{position:relative;flex:0 0 58px;width:58px;height:58px;border-radius:15px;overflow:hidden;
  background:linear-gradient(165deg,var(--viz1),var(--viz2))}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:100%;height:100%}
.thumb .tick{position:absolute;inset:0;background:rgba(0,0,0,.58);color:var(--accent);display:flex;
  align-items:center;justify-content:center;font-size:24px;font-style:normal;font-weight:800}
.ctx{flex:1;min-width:0}
.crow1{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--label3);font-weight:600;min-height:14px}
.crow1 .dots{margin-left:auto;display:flex;gap:4px}
.crow1 .dots i{width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--sep-strong)}
.crow1 .dots i.d{background:var(--accent);box-shadow:none}
.cname{font-size:17px;font-weight:600;line-height:1.2;letter-spacing:-.016em;margin:2px 0 5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:3px 11px;font-size:12.5px;color:var(--label2)}
.cmeta .m{white-space:nowrap}
.cmeta .m.w{color:var(--accent-text);font-weight:600}
.cmeta .m.q{color:var(--label3)}
.cmeta .seatchip{display:inline-flex;align-items:center;gap:3px;color:var(--label3);font-weight:600;font-size:11.5px;
  padding:1px 6px 1px 5px;border-radius:999px;background:var(--fill)}
.cmeta .seatchip svg{width:10px;height:10px}
.chead .cv{flex:0 0 auto;color:var(--label3);font-size:12px;transition:transform .32s var(--ease);align-self:center}
.card.open .chead .cv{transform:rotate(180deg)}
.cbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--ease)}
.card.open .cbody{grid-template-rows:1fr}
.cin{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s linear .38s}
.card.open .cin{visibility:visible;transition-delay:0s}
.cin>*:last-child{margin-bottom:0}
.card .vars{padding:2px 14px 10px}
.vchip{text-align:left;padding:6px 12px 6px;line-height:1.2}
.vchip .vq{display:block;font-size:10.5px;font-weight:500;opacity:.68;margin-top:1px}
.wtline{display:flex;align-items:center;gap:10px;padding:0 16px 5px}
.wtline .wtlab{padding:0;font-size:12px}
.seat{display:flex;align-items:center;gap:9px;margin:0 14px 8px}
.seat .sl{font-size:11px;color:var(--label3);font-weight:600;display:flex;align-items:center;gap:4px}
.seat .sl svg{width:12px;height:12px}
.seat .sr{display:flex;flex:1;background:var(--fill);border-radius:9px;padding:2px}
.seat .sr button{position:relative;flex:1;height:21px;border:none;background:none;border-radius:6px;font-size:10.5px;
  font-weight:600;color:var(--label3);cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.seat .sr button::after{content:"";position:absolute;inset:-8px -1px}
.seat .sr button.on{background:var(--accent);color:var(--accent-ink)}
.info{display:flex;align-items:center;gap:8px;width:calc(100% - 28px);margin:2px 14px 8px;padding:10px 12px;background:var(--fill);
  border:none;border-radius:var(--r-s);color:var(--label2);font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;letter-spacing:-.005em}
.info .ic{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;font-style:italic;font-family:Georgia,serif;flex:0 0 auto}
.info .cv{margin-left:auto;font-size:11px;transition:transform .3s var(--ease)}
.info.op .cv{transform:rotate(180deg)}
.infob{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s var(--ease);margin:0 14px}
.infob.op{grid-template-rows:1fr}
.infoi{overflow:hidden;min-height:0}
.ib{padding:11px 2px 4px}
.ib+.ib{border-top:.5px solid var(--sep);margin-top:8px}
.ib label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--label3);margin-bottom:6px}
.ib p{font-size:13.5px;line-height:1.46;color:var(--label2);letter-spacing:-.005em}
.mchips{display:flex;flex-wrap:wrap;gap:5px}
.mc{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--label2)}
.mc.p{background:var(--accent-soft);color:var(--accent-text)}
.infoi>.ib:last-child{padding-bottom:10px}
.acts{padding:2px 14px 14px}
.card .sets{padding-top:6px}
.card .drnote,.card .how{display:none}

/* ---- modo edição: linhas compactas e arrastar ---- */
.list.editing{gap:8px}
.erow{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 7px;background:var(--surface);border-radius:17px;
  box-shadow:var(--shadow-1);position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;will-change:transform}
.erow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--m3),var(--m2) 40%,var(--m1))}
.erow .dh{flex:0 0 46px;height:46px;border-radius:13px;border:none;background:var(--fill);color:var(--label2);touch-action:none;
  cursor:grab;display:flex;align-items:center;justify-content:center;margin-left:3px}
.erow .dh svg{width:20px;height:20px}
.erow .thumb{flex:0 0 42px;width:42px;height:42px;border-radius:11px}
.erow .etx{flex:1;min-width:0}
.erow .etx b{display:block;font-size:15px;font-weight:600;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .etx small{display:block;font-size:12px;color:var(--label3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .etx small .lk{color:var(--accent-text);font-weight:600}
.erow .emore{flex:0 0 42px;height:42px;border-radius:13px;border:none;background:none;color:var(--label2);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.erow .emore svg{width:20px;height:20px}
.erow.shift{transition:transform .2s var(--ease)}
.erow.lift{z-index:60;transition:none;box-shadow:var(--shadow-2),0 0 0 1.5px var(--accent);opacity:.98}
.erow.lift.drop{transition:transform .18s var(--ease)}
.list.dragmode .erow:not(.lift){pointer-events:none}
.list.dragmode{touch-action:none}
.edithint{margin:0 2px 2px;color:var(--label2);font-size:13px;line-height:1.4}

/* ---- folhas (passo a passo, timer, menu do exercício) ---- */
.sh-ov{position:fixed;inset:0;z-index:119;background:rgba(0,0,0,.46);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .26s var(--ease)}
.sh-ov.on{opacity:1}
.sheet{position:relative;background:var(--surface);width:100%;max-width:560px;border-radius:28px 28px 0 0;max-height:91vh;max-height:91dvh;
  display:flex;flex-direction:column;box-shadow:var(--shadow-2);transform:translateY(100%);transition:transform .4s var(--ease);
  padding-bottom:env(safe-area-inset-bottom);overflow:hidden}
.sh-ov.on .sheet{transform:none}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--metal);z-index:3}
.sh-grab{flex:0 0 auto;height:30px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.sh-grab i{width:38px;height:5px;border-radius:3px;background:var(--sep-strong)}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 var(--sp) 18px}
.shh h3{font-size:22px;font-weight:700;letter-spacing:-.022em;line-height:1.15}
.shh .sub{font-size:13px;color:var(--label2);margin-top:4px;line-height:1.35}
.shh .mchips{margin-top:8px}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px calc(var(--sp)*-1) 0;padding:0 var(--sp);
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar{display:none}
.car .fr{flex:0 0 80%;scroll-snap-align:center}
.car .fr:only-child{flex-basis:100%}
.car .fz{aspect-ratio:1.2/1;border-radius:20px;overflow:hidden;background:var(--fill)}
.car .fz img{width:100%;height:100%;object-fit:cover;display:block}
.car .fz.svg{background:linear-gradient(165deg,var(--viz1),var(--viz2))}
.car .fz.svg svg{width:100%;height:100%}
.car .cap{text-align:center;font-size:12px;color:var(--label3);margin-top:7px;font-weight:600}
.cdots{display:flex;justify-content:center;gap:5px;margin:8px 0 0}
.cdots i{width:6px;height:6px;border-radius:3px;background:var(--fill2);transition:width .25s var(--ease),background-color .25s var(--ease)}
.cdots i.on{width:18px;background:var(--accent)}
.shsteps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:11px;margin:16px 0 8px}
.shsteps li{counter-increment:s;position:relative;padding-left:34px;font-size:16px;line-height:1.42;color:var(--label);letter-spacing:-.012em}
.shsteps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;
  background:var(--accent-soft);color:var(--accent-text);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.sh-body .cue{font-size:14.5px}
.shfoot{display:flex;gap:9px;margin-top:14px}
.shfoot .abtn,.shfoot .mbtn{padding:13px}
.mbtn{flex:1;border:none;background:var(--fill);color:var(--label);border-radius:var(--r-m);padding:14px;font-weight:600;font-size:15.5px;cursor:pointer;letter-spacing:-.012em;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
.mbtn.pri{background:var(--accent);color:var(--accent-ink)}
.menul{display:flex;flex-direction:column;margin-top:4px}
.menul button{display:flex;align-items:center;gap:13px;width:100%;padding:14px 4px;background:none;border:none;border-top:.5px solid var(--sep);
  color:var(--label);font-size:16.5px;font-weight:500;cursor:pointer;text-align:left;letter-spacing:-.012em}
.menul button:first-child{border-top:none}
.menul button .mi{flex:0 0 26px;text-align:center;font-size:18px;display:flex;align-items:center;justify-content:center}
.menul button .mi svg{width:20px;height:20px}
body.tmron .tabsbar{top:calc(66px + env(safe-area-inset-top))}
body.tmron{padding-top:0}
.tabsbar{transition:top .3s var(--ease)}
.menul button.danger{color:var(--red)}
.menul button small{margin-left:auto;color:var(--label3);font-size:12.5px;font-weight:500}
.menul button:disabled{opacity:.35}

/* ---- timer: folha ---- */
.ts-ring{position:relative;width:176px;height:176px;margin:6px auto 12px}
.ts-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ts-ring .bg{fill:none;stroke:var(--fill2);stroke-width:7}
.ts-ring .fg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ts-ring .big{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ts-ring .big b{font-size:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.ts-ring .big small{font-size:12px;color:var(--label3);margin-top:4px;max-width:120px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-ctl{display:flex;gap:9px;margin-bottom:12px}
.ts-pre{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.ts-note{font-size:12.5px;line-height:1.45;color:var(--label3);margin-top:12px}
.ts-how{font-size:14px;line-height:1.5;color:var(--label2)}
.ts-how ol{padding-left:20px;margin:8px 0}
.ts-how li{margin-bottom:6px}
.ts-how code{background:var(--fill);padding:1px 6px;border-radius:6px;font-size:13px;color:var(--label)}

/* ---- timer: pílula ---- */
.tmr{cursor:pointer;overflow:hidden;padding:9px 10px 11px 14px;gap:10px;background:color-mix(in srgb,var(--surface) 90%,transparent)}
.tmr .big{font-size:28px;min-width:74px}
.tmr .info b{display:block;white-space:nowrap}
.tmr .x{flex:0 0 34px}
.tmr .ring{height:3px;background:var(--metal);border-radius:0 3px 3px 0;transition:width .3s linear}
.tmr .plus{flex:0 0 auto;border:none;background:var(--fill2);color:var(--label);border-radius:999px;height:34px;padding:0 11px;
  font-weight:700;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.tmr.done .big{color:var(--green)}

/* ---- navegação flutuante ---- */
.nav{left:50%;right:auto;width:min(calc(100% - 28px),420px);transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
  padding:6px;border-radius:28px;border:.5px solid var(--sep);box-shadow:var(--shadow-2);justify-content:stretch;gap:0}
.nav .navind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:22px;
  background:var(--accent-soft);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--accent) 45%,transparent);
  transition:transform .4s var(--ease);pointer-events:none}
.nav button{position:relative;z-index:1;max-width:none;border-radius:22px;padding:7px 4px 6px}
.nav button.on span{font-weight:700}
.toast{bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom))}

@media (prefers-reduced-motion:reduce){
  .tabind.go,.nav .navind,.cbody,.infob,.sheet{transition-duration:.01ms!important}
  .list.enter .card,.list.sR .card,.list.sL .card,.list.enter .erow,.list.sR .erow,.list.sL .erow{animation:none}
}
@media (prefers-reduced-transparency:reduce){
  .tabsbar,.sh-ov{backdrop-filter:none;-webkit-backdrop-filter:none}
  .tabsbar{background:var(--bg)}
}

/* ---- linha de ferramentas ---- */
.toolrow{display:flex;gap:8px;margin:0 var(--sp) 10px}
.orderbtn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:none;color:var(--label);border-radius:14px;
  padding:12px 14px;font-size:14.5px;font-weight:500;cursor:pointer;text-align:left;letter-spacing:-.01em;box-shadow:var(--shadow-1)}
.orderbtn #orderLbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.orderbtn .cv{margin-left:auto;color:var(--label3);font-size:12px;transition:transform .3s var(--ease)}
.orderbtn.op .cv{transform:rotate(180deg)}
.toolrow .editbtn{flex:0 0 auto;white-space:nowrap;background:var(--fill);color:var(--accent-text);border-radius:14px;padding:0 14px;font-size:14px;font-weight:600}
.toolrow .editbtn.on{background:var(--accent);color:var(--accent-ink)}
.order{margin:0 var(--sp);background:var(--surface);border-radius:var(--r-m);box-shadow:var(--shadow-1);overflow:hidden;
  display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .4s var(--ease),opacity .3s var(--ease),margin .4s var(--ease)}
.order.open{grid-template-rows:1fr;opacity:1;margin-bottom:12px}
.order .bd{min-height:0;overflow:hidden;max-height:none!important}
.order .bd-i{padding:12px 14px 6px}
.order .dintro{margin:0 0 6px;font-size:13.5px}
html[data-theme=dark] .erow.lift{box-shadow:var(--shadow-2),0 0 0 1.5px var(--accent)}
</style>
</head>

function setLang(l){LANG=l;save('iron_lang',LANG);document.documentElement.lang=l;boxClose();render();
  const obEl=$('ob');if(obEl&&!obEl.classList.contains('hidden'))renderOB();
  toast(l==='pt-BR'?'Idioma: Português':'Language: English')}
function openLangPicker(){
  const opts=[['pt-BR','🇧🇷 Português (Brasil)'],['en','🇬🇧 English']];
  boxOpen(`<h3>🌐 Idioma / Language</h3>
    <div class="sub">${t('idiomalangsub')}</div>
    <div class="mlist">${opts.map(([code,label])=>
      `<div class="prow"><div class="rtx"><b>${label}</b></div><button class="padd" onclick="setLang('${code}')">${LANG===code?'✓':'→'}</button></div>`).join('')}</div>
    <div class="mrow" style="margin-top:10px"><button class="mbtn pri" onclick="boxClose()">${t('fechar')}</button></div>
    <div class="mfoot"><button onclick="forceRefresh()">${t('verificaratualiz')} (${typeof APP_VERSION!=='undefined'?APP_VERSION:'?'})</button></div>`);
}
async function forceRefresh(){
  toast(t('verificandoatualiz'));
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs){await r.update();await r.unregister()}
    }
    if(window.caches){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}
  }catch(e){}
  location.reload(true);
}
